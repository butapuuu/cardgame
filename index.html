<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background:#1a2a1a;
  color:#eee;
  font-family:sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:10px;
  transition:background 0.8s;
}

/* ===== 全体レイアウト ===== */
#root{
  display:flex;
  gap:10px;
  width:100%;
  max-width:1200px;
}

/* ===== 左：カードプレビュー ===== */
#sidePreview{
  width:300px; /* ★200px→300px */
  flex-shrink:0;
  position:sticky;
  top:10px;
  align-self:flex-start;
}

#sidePreview img{
  width:300px; /* ★200px→300px */
  border-radius:8px;
  box-shadow:0 0 12px #000;
}

/* ===== 中央：プレイマット ===== */
#mat{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}

/* ===== 右：ログパネル ===== */
#logPanel{
  width:260px; /* ★190px→260px */
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:sticky;
  top:10px;
  align-self:flex-start;
}

#logTitle{
  font-size:13px;
  font-weight:bold;
  color:#ffe066;
  padding:4px 0;
  border-bottom:1px solid #444;
  margin-bottom:4px;
}

#logBox{
  background:rgba(0,0,0,0.45);
  border:1px solid #333;
  border-radius:8px;
  padding:8px;
  font-size:12px;
  color:#ccc;
  line-height:1.6;
  min-height:200px;
  max-height:60vh;
  overflow-y:auto;
}

#logBox .logLine{
  padding:2px 0;
  border-bottom:1px solid #2a2a2a;
}

#allLogBtn{
  background:linear-gradient(135deg,#0a0a1a,#1a1a2a);
  color:#8899cc;
  border:1px solid #334488;
  border-radius:6px;
  padding:7px;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 0 8px rgba(50,80,180,0.2), inset 0 0 4px rgba(0,0,0,0.4);
  transition:all 0.2s;
}
#allLogBtn:hover{
  background:linear-gradient(135deg,#1a1a2a,#2a2a4a);
  color:#aabbee;
  box-shadow:0 0 14px rgba(80,120,220,0.4);
}

/* ===== 捨て場モーダル ===== */
#graveModal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.75);
  z-index:1000;
  justify-content:center;
  align-items:center;
}
#graveModal.open{ display:flex; }

#graveModalInner{
  background:#1e1e2e;
  border:1px solid #555;
  border-radius:10px;
  padding:20px;
  width:60%;
  max-width:700px;
  min-width:320px;
  max-height:80vh;
  overflow-y:auto;
  position:relative;
}

#graveModalInner h3{
  color:#ffe066;
  margin-bottom:12px;
  font-size:15px;
}

#graveModalCards{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

#graveModalCards img{
  width:64px;
  border-radius:5px;
  box-shadow:0 2px 6px #000;
  cursor:pointer;
  transition:transform 0.15s;
}
#graveModalCards img:hover{
  transform:translateY(-4px);
}

/* 捨て場プレビュー（モーダル内右上） */
#gravePreview{
  position:fixed;
  top:50%;
  left:20px;
  transform:translateY(-50%);
  z-index:1100;
  pointer-events:none;
  display:none;
}
#gravePreview img{
  width:300px;
  border-radius:8px;
  box-shadow:0 0 16px #000;
}

/* ===== 全ログモーダル ===== */
#logModal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.75);
  z-index:1000;
  justify-content:center;
  align-items:center;
}
#logModal.open{ display:flex; }

#logModalInner{
  background:#1e2e1e;
  border:1px solid #444;
  border-radius:10px;
  padding:20px;
  width:90%;
  max-width:600px;
  max-height:80vh;
  overflow-y:auto;
  font-size:13px;
  color:#ccc;
  line-height:1.8;
}

#logModalInner h3{
  color:#ffe066;
  margin-bottom:12px;
}

#logModalClose{
  margin-top:12px;
  background:#444;
  color:#eee;
  border:1px solid #666;
  border-radius:6px;
  padding:6px 20px;
  cursor:pointer;
  font-size:13px;
}

/* ===== ヘッダー ===== */
#header{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

#header button{
  background:linear-gradient(135deg,#1a2a1a,#2a3a2a);
  color:#aaddaa;
  border:1px solid #3a6a3a;
  border-radius:6px;
  padding:6px 14px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  box-shadow:0 0 8px rgba(40,120,40,0.2), inset 0 0 4px rgba(0,0,0,0.3);
  transition:all 0.2s;
  white-space:nowrap;
}
#header button:hover{
  background:linear-gradient(135deg,#2a3a2a,#3a5a3a);
  color:#ccffcc;
  box-shadow:0 0 12px rgba(40,180,40,0.35);
}
/* ゲーム開始ボタンは別色 */
#header button[onclick="reset()"]{
  background:linear-gradient(135deg,#2a1a00,#4a3000);
  color:#ffcc66;
  border:1px solid #aa6600;
  box-shadow:0 0 8px rgba(180,100,0,0.3);
  font-size:13px;
}
#header button[onclick="reset()"]:hover{
  background:linear-gradient(135deg,#4a3000,#6a4a00);
  color:#ffee88;
  box-shadow:0 0 14px rgba(220,140,0,0.45);
}
/* プルダウン */
#header select{
  background:#0e1a0e;
  color:#aaddaa;
  border:1px solid #3a6a3a;
  border-radius:6px;
  padding:4px 8px;
  font-size:12px;
  max-width:130px;
  box-shadow:inset 0 0 4px rgba(0,0,0,0.4);
  cursor:pointer;
}
#header select option{
  background:#0e1a0e;
  color:#aaddaa;
}

#turn{ font-size:16px; font-weight:bold; color:#ffe066; }
#winner{ font-size:18px; font-weight:bold; color:#ff6666; }

/* ===== 情報バー ===== */
.infoBar{
  background:rgba(0,0,0,0.4);
  border-radius:8px;
  padding:6px 12px;
  font-size:13px;
  display:flex;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}

.life{ color:#ff6666; font-weight:bold; font-size:15px; }
.energy{ color:#66ccff; font-weight:bold; }
.deckCount{ color:#aaa; }
.graveBtn{
  background:rgba(255,255,255,0.1);
  border:1px solid #666;
  border-radius:4px;
  color:#ccc;
  padding:2px 8px;
  cursor:pointer;
  font-size:12px;
}

/* ===== フィールド ===== */
.field{
  background:var(--field-bg, rgba(0,80,0,0.35));
  border:2px solid var(--field-border, #2d6a2d);
  border-radius:10px;
  min-height:130px;
  padding:8px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  transition:background 0.8s, border-color 0.8s;
}

#enemyField{
  background:var(--enemy-field-bg, rgba(80,0,0,0.25));
  border-color:var(--enemy-field-border, #6a2d2d);
}

/* ===== 直接攻撃ゾーン ===== */
#enemyPlayerZone{
  background:linear-gradient(135deg,rgba(80,0,0,0.25),rgba(120,0,0,0.15));
  border:1px solid rgba(180,60,60,0.4);
  border-radius:6px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(220,100,100,0.7);
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
  transition:all 0.2s;
  box-shadow:inset 0 0 10px rgba(180,0,0,0.1);
}
#enemyPlayerZone:hover,
#enemyPlayerZone.dragover{
  background:linear-gradient(135deg,rgba(160,20,20,0.4),rgba(100,0,0,0.3));
  border-color:rgba(255,80,80,0.7);
  color:rgba(255,150,150,0.95);
  box-shadow:0 0 14px rgba(220,50,50,0.4), inset 0 0 10px rgba(180,0,0,0.2);
}

/* ===== 手札エリア ===== */
#handArea{
  background:rgba(0,0,0,0.3);
  border:2px solid #2d4a2d;
  border-radius:10px;
  min-height:110px;
  padding:8px 16px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  flex-wrap:nowrap;
  overflow:visible;
  position:relative;
}

/* ===== カード ===== */
.card{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform 0.15s;
  position:relative;
  z-index:1;
  flex-shrink:0;
}
.card:hover{ transform:translateY(-10px) !important; z-index:100 !important; }
.card img{
  width:72px;
  border-radius:5px;
  box-shadow:0 2px 6px #000;
}
.card .stat{
  font-size:11px;
  color:#ffe066;
  margin-top:2px;
  background:rgba(0,0,0,0.6);
  border-radius:3px;
  padding:1px 4px;
}
.card.selected img{
  outline:3px solid #ff4444;
  border-radius:5px;
}

/* ===== ターン終了・降参ボタン ===== */
#endTurnBtn{
  background:linear-gradient(135deg,#0d2a0d,#1a4a1a);
  color:#88ff88;
  border:1px solid #2a8a2a;
  border-radius:8px;
  padding:10px 16px;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 0 10px rgba(40,180,40,0.3), inset 0 0 6px rgba(0,0,0,0.4);
  transition:all 0.2s;
  width:100%;
}
#endTurnBtn:hover{
  background:linear-gradient(135deg,#1a4a1a,#2a6a2a);
  box-shadow:0 0 16px rgba(40,220,40,0.5);
  color:#aaffaa;
}
#surrenderBtn{
  background:linear-gradient(135deg,#2a0808,#4a1212) !important;
  color:#ff8888 !important;
  border:1px solid #8a2222 !important;
  border-radius:8px !important;
  padding:8px 16px !important;
  font-size:13px !important;
  font-weight:bold !important;
  letter-spacing:1px !important;
  cursor:pointer !important;
  white-space:nowrap !important;
  box-shadow:0 0 10px rgba(180,40,40,0.3), inset 0 0 6px rgba(0,0,0,0.4) !important;
  transition:all 0.2s !important;
  width:100% !important;
  text-align:center !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
#surrenderBtn:hover{
  background:linear-gradient(135deg,#4a1212,#6a1a1a) !important;
  box-shadow:0 0 16px rgba(220,40,40,0.5) !important;
  color:#ffaaaa !important;
}

/* ===== スマホ ===== */
@media(max-width:700px){
  #sidePreview{ display:none; }
  #logPanel{ display:none; }
  .card img{ width:56px; }
}

@keyframes attackMoveUp {
  0%  { transform:translateY(0); }
  45% { transform:translateY(-220px); }
  100%{ transform:translateY(0); }
}
@keyframes attackMoveLeft0 { 0%{transform:translate(0,0);} 45%{transform:translate(-160px,-80px);} 100%{transform:translate(0,0);} }
@keyframes attackMoveLeft1 { 0%{transform:translate(0,0);} 45%{transform:translate(0px,-140px);} 100%{transform:translate(0,0);} }
@keyframes attackMoveLeft2 { 0%{transform:translate(0,0);} 45%{transform:translate(160px,-80px);} 100%{transform:translate(0,0);} }
@keyframes attackMoveRight0 { 0%{transform:translate(0,0);} 45%{transform:translate(160px,-80px);} 100%{transform:translate(0,0);} }
@keyframes attackMoveRight1 { 0%{transform:translate(0,0);} 45%{transform:translate(0px,-140px);} 100%{transform:translate(0,0);} }
@keyframes attackMoveRight2 { 0%{transform:translate(0,0);} 45%{transform:translate(-160px,-80px);} 100%{transform:translate(0,0);} }

@keyframes screenShake {
  0%  { transform:translate(0,0) rotate(0deg); }
  15% { transform:translate(-6px,-4px) rotate(-0.5deg); }
  30% { transform:translate(6px,4px) rotate(0.5deg); }
  45% { transform:translate(-5px,3px) rotate(-0.3deg); }
  60% { transform:translate(5px,-3px) rotate(0.3deg); }
  75% { transform:translate(-3px,2px) rotate(-0.2deg); }
  90% { transform:translate(3px,-2px) rotate(0.2deg); }
  100%{ transform:translate(0,0) rotate(0deg); }
}
.shaking {
  animation: screenShake 0.45s ease-in-out;
}

/* ===== ターン交代アニメーション ===== */
#turnChangeOverlay{
  position:fixed;
  top:0;left:-100%;
  width:100%;height:100%;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
#turnChangeOverlay img{
  width:80%;
  max-width:700px;
  filter:drop-shadow(0 0 30px rgba(255,200,50,0.8));
}
@keyframes turnChangeSlide{
  0%  { left:-100%; opacity:0; }
  15% { left:0%;    opacity:1; }
  75% { left:0%;    opacity:1; }
  100%{ left:100%;  opacity:0; }
}
.turn-change-anim{
  animation:turnChangeSlide 1.4s cubic-bezier(0.22,1,0.36,1) forwards !important;
}

@keyframes popIn {
  0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; }
  60%{ transform:translate(-50%,-50%) scale(1.1); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}

/* ===== 扇状手札 ===== */
#handArea{
  position:relative;
  overflow:visible;
}
#handArea .card{
  transition:transform 0.18s ease;
  transform-origin:center bottom;
  flex-shrink:1;
  position:relative;
}
/* 枚数に応じて扇の角度をJSで付与するためここではrotateなし */

/* ===== 新UI追加CSS ===== */
.pm-wrapper{
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}
.pm-half{
  display:flex;
  align-items:stretch;
  gap:8px;
  min-height:180px;
  position:relative;
}
/* 左エリア・右エリア */
.pm-side{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  width:110px;
}
/* ライフ円形UI */
.life-circle{
  width:72px;height:72px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #5a1a1a, #1a0808);
  border:3px solid #cc4444;
  box-shadow:0 0 12px rgba(200,50,50,0.5), inset 0 0 8px rgba(0,0,0,0.6);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}
.life-circle .lc-val{
  font-size:22px;font-weight:bold;color:#ffaaaa;
  line-height:1;font-family:Georgia,serif;
}
.life-circle .lc-label{
  font-size:9px;color:#cc6666;letter-spacing:2px;margin-top:1px;
}
/* エネルギーUI */
.energy-plate{
  background:linear-gradient(135deg,#0a1a2a,#0d2a3a);
  border:1px solid #2266aa;
  border-radius:8px;
  padding:5px 10px;
  text-align:center;
  box-shadow:0 0 8px rgba(40,120,200,0.3);
  width:100%;
}
.energy-plate .ep-label{
  font-size:9px;color:#4488cc;letter-spacing:1px;
}
.energy-plate .ep-val{
  font-size:13px;font-weight:bold;color:#88ccff;
}
/* デッキ・捨て場エリア */
.deck-grave-area{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  justify-content:center;
}
.deck-pile{
  position:relative;
  width:56px;
  cursor:default;
}
.deck-pile img{
  width:56px;border-radius:5px;
  box-shadow:
    1px 1px 0 #222,
    2px 2px 0 #1a1a1a,
    3px 3px 0 #141414,
    4px 4px 0 #0e0e0e,
    5px 5px 0 #080808,
    0 6px 12px rgba(0,0,0,0.7);
}
.deck-pile .deck-count{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:#fff;font-size:15px;font-weight:bold;
  text-shadow:0 0 6px #000, 0 0 12px #000;
  pointer-events:none;
  z-index:10;
}
.grave-pile{
  position:relative;
  width:56px;
  cursor:pointer;
}
.grave-pile img{
  width:56px;border-radius:5px;
  box-shadow:0 2px 6px #000;
  transition:transform 0.15s;
}
.grave-pile:hover img{ transform:translateY(-4px); }
.grave-pile .grave-empty{
  width:56px;height:80px;
  border:1px solid rgba(180,140,80,0.4);
  border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(180,140,80,0.4);
  font-size:9px;
  letter-spacing:2px;
  font-weight:bold;
  background:rgba(180,140,80,0.04);
  box-shadow:inset 0 0 8px rgba(0,0,0,0.3);
}
/* 中央フィールドエリア */
.pm-center{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field-row{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--field-bg, rgba(0,80,0,0.35));
  border:2px solid var(--field-border, #2d6a2d);
  border-radius:10px;
  min-height:130px;
  padding:8px 10px;
  flex:1;
  transition:background 0.8s,border-color 0.8s;
}
.field-row.enemy-row{
  background:var(--enemy-field-bg, rgba(80,0,0,0.25));
  border-color:var(--enemy-field-border, #6a2d2d);
}
.unit-slots{
  display:flex;
  gap:8px;
  align-items:center;
  flex:1;
  position:relative;
  min-height:110px;
}

.unit-slot-empty{
  width:72px;
  height:100px;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:6px;
  flex-shrink:0;
  background:rgba(255,255,255,0.03);
  box-shadow:inset 0 0 8px rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.unit-slot-empty::before{
  content:"UNIT";
  font-size:9px;
  color:rgba(255,255,255,0.18);
  letter-spacing:3px;
  font-weight:bold;
  pointer-events:none;
}
/* ユニットカードが存在する場合は空枠を非表示 */
.unit-slots .card ~ .unit-slot-empty{
  display:none;
}
/* フィールドスペルスロット */
.fs-slot{
  width:80px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  min-height:110px;
  border:1px solid rgba(255,215,0,0.45);
  border-radius:6px;
  position:relative;
  background:rgba(255,215,0,0.04);
  box-shadow:inset 0 0 10px rgba(255,215,0,0.06);
}
.fs-slot::before{
  content:"FIELD";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:10px;
  color:rgba(255,215,0,0.3);
  letter-spacing:3px;
  pointer-events:none;
  font-weight:bold;
}
/* カードが入ったらテキストを隠す */
.fs-slot:not(:empty)::before{
  display:none;
}
/* 相手手札（裏向き）*/
.enemy-hand-area{
  display:flex;
  gap:3px;
  justify-content:center;
  flex-wrap:wrap;
  padding:4px 0;
  min-height:40px;
}
.enemy-hand-card img{
  width:40px;border-radius:3px;
  box-shadow:0 1px 4px #000;
}
/* 区切り線 */
.pm-divider{
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  margin:2px 0;
}

</style>
</head>
<body>

<!-- ターン交代オーバーレイ -->
<div id="turnChangeOverlay">
  <img src="images/TURN CHANGE.png" id="turnChangeImg" alt="TURN CHANGE">
</div>

<!-- 勝敗画像オーバーレイ -->
<div id="resultOverlay" onclick="closeResult()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:2000;justify-content:center;align-items:center;cursor:pointer;">
  <img id="resultImg" src="" style="max-width:60%;max-height:60%;">
</div>

<!-- 捨て場カードプレビュー -->
<div id="gravePreview"></div>

<!-- 捨て場モーダル -->
<div id="graveModal">
  <div id="graveModalInner">
    <h3 id="graveModalTitle">🪦 捨て場</h3>
    <div id="graveModalCards"></div>
    <br>
    <button onclick="closeGraveModal()" style="background:#444;color:#eee;border:1px solid #666;border-radius:6px;padding:6px 20px;cursor:pointer;font-size:13px;">閉じる</button>

// ②シームレスループ用：Web Audio APIを使う
let bgmContext=null;
let bgmSource=null;
let bgmBuffer=null;

async function startBGM(){
  if(bgmStarted) return;
  bgmStarted=true;
  try{
    bgmContext=new (window.AudioContext||window.webkitAudioContext)();
    // ★バッファが残っていれば再利用、なければ再取得
    if(!bgmBuffer){
      const res=await fetch("sounds/BGM.mp3");
      const arrayBuf=await res.arrayBuffer();
      bgmBuffer=await bgmContext.decodeAudioData(arrayBuf);
    } else {
      // 既存バッファを新しいcontextでデコードし直す
      const res=await fetch("sounds/BGM.mp3");
      const arrayBuf=await res.arrayBuffer();
      bgmBuffer=await bgmContext.decodeAudioData(arrayBuf);
    }
    playBGMLoop();
  }catch(e){
    BGM.loop=true;
    BGM.volume=0.12;
    BGM.play().catch(()=>{});
  }
}

function playBGMLoop(){
  if(!bgmContext||!bgmBuffer) return;
  bgmSource=bgmContext.createBufferSource();
  bgmSource.buffer=bgmBuffer;
  bgmSource.loop=true;
  bgmSource.loopStart=0;
  bgmSource.loopEnd=bgmBuffer.duration; // バッファの正確な終端を指定
  const gainNode=bgmContext.createGain();
  gainNode.gain.value=0.12;
  bgmSource.connect(gainNode);
  gainNode.connect(bgmContext.destination);
  bgmSource.start(0);
}

function loadDeckOptions(){
  [1,2].forEach(pn=>{
    const sel=document.getElementById("deckSelectP"+pn);
    if(!sel) return;
    const all=JSON.parse(localStorage.getItem("decks_p"+pn)||"[]");
    sel.innerHTML="<option value='-1'>デッキ選択</option>";
    all.forEach((d,i)=>{
      if(!d) return;
      const opt=document.createElement("option");
      opt.value=i;
      opt.innerText="["+(i+1)+"] "+(d.name||"名称未設定");
      sel.appendChild(opt);
    });
  });
}

function selectPlayer(num){
  const sel=document.getElementById("deckSelectP"+num);
  const slotIdx=parseInt(sel.value,10);
  let deck;
  if(slotIdx>=0){
    const all=JSON.parse(localStorage.getItem("decks_p"+num)||"[]");
    deck=(all[slotIdx]&&all[slotIdx].cards)||[];
  } else {
    deck=JSON.parse(localStorage.getItem("deck"+num)||"[]");
  }
  if(!deck||deck.length===0){ alert("デッキを選択してください"); return; }
  socket.emit("join",{player:num,deck});
  const slotName=slotIdx>=0?`スロット${slotIdx+1}`:"デフォルト";
  document.getElementById("playerStatus").innerText="P"+num+" 参加（"+slotName+")";
  // ★自分のデッキ属性でカラー適用
  const attr=detectDeckAttr(deck);
  applyAttrColor(attr);
}

function renderFieldSpell(elementId, fsData){
  const el=document.getElementById(elementId);
  if(!el) return;
  // ★フィールドスペルが消えた場合、少し遅らせて消去（破壊エフェクト表示のため）
  if(!fsData||!fsData.name){
    setTimeout(()=>{
      const el2=document.getElementById(elementId);
      if(el2) el2.innerHTML="";
    },400);
    return;
  }
  el.innerHTML="";
  const div=document.createElement("div");
  div.className="card";
  div.style.cssText="display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;";
  const img=document.createElement("img");
  img.src=`images/${fsData.name}.png`;
  img.style.cssText="width:72px;border-radius:5px;box-shadow:0 2px 6px #000;";
  img.onerror=()=>{img.style.display="none";};
  // ★プレビュー表示
  img.onmouseenter=()=>{ document.getElementById("preview").innerHTML=`<img src="images/${fsData.name}.png">`; };
  img.onmouseleave=()=>{ document.getElementById("preview").innerHTML=""; };
  const dur=document.createElement("div");
  dur.className="stat";
  dur.style.cssText="font-size:11px;color:#ffe066;margin-top:2px;background:rgba(0,0,0,0.6);border-radius:3px;padding:1px 4px;";
  dur.textContent=`耐久:${fsData.durability}`;
  div.appendChild(img);
  div.appendChild(dur);

  // ★相手フィールドスペルへの攻撃
  if(elementId==="enemyFieldSpell"){
    div.onclick=()=>{
      if(selectedUnitIndex===null) return;
      const atkIdx=selectedUnitIndex;
      const atkName=latestGameState?.myBoard?.[atkIdx]?.name||"ユニット";
      if(!confirm(`「${atkName}」で「${fsData.name}」に攻撃しますか？`)) return;

      // ★攻撃アニメーション：myUnitsからカード取得（逆順表示対応）
      const myContainer=document.getElementById("myUnits")||document.getElementById("myField");
      const myCards=myContainer.querySelectorAll(".card");
      // selectedUnitIndexは元のboard配列インデックス、表示は逆順なので変換
      // myCards[0]が最新ユニット（board末尾）、myCards[len-1]が最初のユニット（board先頭）
      const myBoardLen=myCards.length; // DOMから直接取得
      const displayAtkIdx=myBoardLen>0 ? myBoardLen-1-atkIdx : atkIdx;
      const atkCardEl=myCards[displayAtkIdx];

      // ★フィールドスペルの現在位置をDOMから直接取得（古いdiv参照を使わない）
      const fsDivNow=document.getElementById("enemyFieldSpell")?.querySelector(".card");

      // ★座標を先に記録（DOM再構築前に取得）
      const atkRect=atkCardEl ? atkCardEl.getBoundingClientRect() : null;
      const tgtRect=fsDivNow ? fsDivNow.getBoundingClientRect() : null;

      clearSelection();

      if(atkCardEl && atkRect && tgtRect){
        const dx=((tgtRect.left+tgtRect.width/2)-(atkRect.left+atkRect.width/2))*0.7;
        const dy=((tgtRect.top+tgtRect.height/2)-(atkRect.top+atkRect.height/2))*0.7;
        const attr=latestGameState?.myBoard?.[atkIdx]?.attr||"fire";

        // ★攻撃アニメーション開始
        atkCardEl.style.transition="none";
        atkCardEl.style.transform="translate(0,0)";
        void atkCardEl.offsetWidth;
        atkCardEl.style.transition="transform 0.18s ease-out";
        atkCardEl.style.transform=`translate(${dx}px,${dy}px)`;

        // ★200ms後：戻りアニメーション＋被弾エフェクト＋ソケット送信
        setTimeout(()=>{
          // 戻りアニメーション（DOM再構築後でも元素がなければ無視）
          if(atkCardEl.isConnected){
            atkCardEl.style.transition="transform 0.16s ease-in";
            atkCardEl.style.transform="translate(0,0)";
            setTimeout(()=>{ atkCardEl.style.transition=""; atkCardEl.style.transform=""; },180);
          }

          // 被弾エフェクト：破壊されても座標は記録済みなので確実に表示
          const cx=tgtRect.left+tgtRect.width/2;
          const cy=tgtRect.top+tgtRect.height/2;
          const fx=document.createElement("img");
          fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
          fx.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);width:100px;pointer-events:none;z-index:999;`;
          document.body.appendChild(fx);
          setTimeout(()=>fx.remove(),500);

          // ★ソケット送信はアニメーション開始200ms後（戻り途中）
          // ★攻撃効果音
          const atkAttrFS=latestGameState?.myBoard?.[atkIdx]?.attr||"neutral";
          playSE(SE.atk[atkAttrFS]||SE.atk.neutral);
          socket.emit("action",{type:"attack",a:atkIdx,target:"fieldSpell"});
        },200);

      } else {
        // カード要素が取得できなかった場合は即送信
        const atkAttrFS2=latestGameState?.myBoard?.[atkIdx]?.attr||"neutral";
        playSE(SE.atk[atkAttrFS2]||SE.atk.neutral);
        socket.emit("action",{type:"attack",a:atkIdx,target:"fieldSpell"});
      }
    };
  }

  el.appendChild(div);
}
// ★攻撃アニメーション
function playAttackAnim(attackerIdx, targetIdx, isDirect, enemyBoardLen){
  const myContainer=document.getElementById("myUnits")||document.getElementById("myField");
  const myCards=myContainer.querySelectorAll(".card");
  // ★自分ユニットは逆順表示のため表示インデックスを変換
  const myBoardLen=latestGameState?.myBoard?.length||0;
  const displayAtkIdx=myBoardLen>0 ? myBoardLen-1-attackerIdx : attackerIdx;
  const card=myCards[displayAtkIdx];
  if(!card) return;

  let dx=0, dy=-120;

  if(isDirect){
    dx=0; dy=-220;
  } else if(targetIdx!==null && targetIdx!==undefined){
    const atkRect=card.getBoundingClientRect();
    // ★enemyUnitsが存在すればそちらを使う
    const enContainer=document.getElementById("enemyUnits")||document.getElementById("enemyField");
    const enCards=enContainer.querySelectorAll(".card");
    const tgtCard=enCards[targetIdx];
    if(tgtCard){
      const tgtRect=tgtCard.getBoundingClientRect();
      const atkCx=atkRect.left+atkRect.width/2;
      const atkCy=atkRect.top+atkRect.height/2;
      const tgtCx=tgtRect.left+tgtRect.width/2;
      const tgtCy=tgtRect.top+tgtRect.height/2;
      dx=(tgtCx-atkCx)*0.7;
      dy=(tgtCy-atkCy)*0.7;
    }
  }

  card.style.transition="none";
  card.style.transform="translate(0,0)";
  void card.offsetWidth;
  card.style.transition="transform 0.18s ease-out";
  card.style.transform=`translate(${dx}px,${dy}px)`;
  setTimeout(()=>{
    card.style.transition="transform 0.16s ease-in";
    card.style.transform="translate(0,0)";
    setTimeout(()=>{
      card.style.transition="";
      card.style.transform="";
    },180);
  },200);
}

socket.on("hitEffect",(data)=>{
  // ★被弾中フラグをセット
  if(data.isEnemy){
    hitEffectActiveEnemy=true;
    clearTimeout(hitEffectEnemyTimer);
    hitEffectEnemyTimer=setTimeout(()=>{ hitEffectActiveEnemy=false; }, 520);
  } else {
    hitEffectActiveMy=true;
    clearTimeout(hitEffectMyTimer);
    hitEffectMyTimer=setTimeout(()=>{ hitEffectActiveMy=false; }, 520);
  }

  const attr=data.attr||"fire";

  // ★相手からの攻撃アニメーション（hasAttackAnimがある場合）
  if(data.hasAttackAnim && !data.isEnemy){
    playSE(SE.atk[attr]||SE.atk.neutral);

    // ★少し遅延してDOM確定後に実行
    setTimeout(()=>{
      const enContainer=document.getElementById("enemyUnits")||document.getElementById("enemyField");
      if(!enContainer) return;
      // ★.cardクラスのみ取得（unit-slot-emptyは.cardクラスを持たない）
      const enCards=Array.from(enContainer.querySelectorAll(".card"));
      const atkCard=enCards[data.attackerIdx];
      if(!atkCard) return;

      const atkRect=atkCard.getBoundingClientRect();
      let dx=0, dy=0;

      if(data.isDirect){
        dx=0; dy=180;
      } else if(data.isFieldSpell){
        const fsCard=document.getElementById("myFieldSpell")?.querySelector(".card");
        if(fsCard){
          const tr=fsCard.getBoundingClientRect();
          dx=((tr.left+tr.width/2)-(atkRect.left+atkRect.width/2))*0.7;
          dy=((tr.top+tr.height/2)-(atkRect.top+atkRect.height/2))*0.7;
          // 被弾エフェクト（フィールドスペル）
          setTimeout(()=>{
            const fc2=document.getElementById("myFieldSpell")?.querySelector(".card");
            if(!fc2) return;
            const r=fc2.getBoundingClientRect();
            const fx2=document.createElement("img");
            fx2.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
            fx2.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;transform:translate(-50%,-50%);width:100px;pointer-events:none;z-index:999;`;
            document.body.appendChild(fx2);
            setTimeout(()=>fx2.remove(),500);
          },180);
        }
      } else {
        // ★自分ユニットへの攻撃：逆順表示対応
        const myContainer=document.getElementById("myUnits")||document.getElementById("myField");
        if(!myContainer) return;
        const myCards=Array.from(myContainer.querySelectorAll(".card"));
        // myCards[0]が最新ユニット（board末尾）
        // data.targetIdxはboard配列インデックス → 表示インデックスに変換
        const myLen=myCards.length;
        const displayIdx=myLen>0 ? myLen-1-data.targetIdx : data.targetIdx;
        const tgtCard=myCards[displayIdx];
        if(tgtCard){
          const tr=tgtCard.getBoundingClientRect();
          dx=((tr.left+tr.width/2)-(atkRect.left+atkRect.width/2))*0.7;
          dy=((tr.top+tr.height/2)-(atkRect.top+atkRect.height/2))*0.7;
        }
      }

      // ★攻撃アニメーション実行
      atkCard.style.transition="none";
      atkCard.style.transform="translate(0,0)";
      void atkCard.offsetWidth;
      atkCard.style.transition="transform 0.18s ease-out";
      atkCard.style.transform=`translate(${dx}px,${dy}px)`;
      setTimeout(()=>{
        atkCard.style.transition="transform 0.16s ease-in";
        atkCard.style.transform="translate(0,0)";
        setTimeout(()=>{ atkCard.style.transition=""; atkCard.style.transform=""; },180);
      },200);

      // ★直接攻撃・フィールドスペルは被弾エフェクト不要（終了）
      if(data.isDirect || data.isFieldSpell) return;

      // ★自分ユニットへの被弾エフェクト（逆順対応）
      const myContainer2=document.getElementById("myUnits")||document.getElementById("myField");
      if(!myContainer2) return;
      const myCards2=Array.from(myContainer2.querySelectorAll(".card"));
      const myLen2=myCards2.length;
      const displayIdx2=myLen2>0 ? myLen2-1-data.targetIdx : data.targetIdx;
      const hitCard=myCards2[displayIdx2];
      if(!hitCard) return;
      const rect=hitCard.getBoundingClientRect();
      const fx=document.createElement("img");
      fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
      fx.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;transform:translate(-50%,-50%);width:100px;pointer-events:none;z-index:999;`;
      document.body.appendChild(fx);
      setTimeout(()=>fx.remove(),500);

    },50); // ★50ms遅延でDOM確定後に実行
    return;
  }

  // ★自分が攻撃した時（isEnemy:true）の被弾エフェクト
  if(data.isEnemy){
    if(data.targetIdx===-1) return;
    const enContainer=document.getElementById("enemyUnits")||document.getElementById("enemyField");
    if(!enContainer) return;
    const enCards=Array.from(enContainer.querySelectorAll(".card"));
    const card=enCards[data.targetIdx];
    if(!card) return;
    const rect=card.getBoundingClientRect();
    const fx=document.createElement("img");
    fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
    fx.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;transform:translate(-50%,-50%);width:100px;pointer-events:none;z-index:999;`;
    document.body.appendChild(fx);
    setTimeout(()=>fx.remove(),500);
    return;
  }

  // ★相手からの通常被弾エフェクト（hasAttackAnimなし・フォールバック）
  if(data.targetIdx===-1) return;
  const myContainer=document.getElementById("myUnits")||document.getElementById("myField");
  if(!myContainer) return;
  const myCards=Array.from(myContainer.querySelectorAll(".card"));
  const myLen=myCards.length;
  const displayIdx=myLen>0 ? myLen-1-data.targetIdx : data.targetIdx;
  const card=myCards[displayIdx];
  if(!card) return;
  const rect=card.getBoundingClientRect();
  const fx=document.createElement("img");
  fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
  fx.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;transform:translate(-50%,-50%);width:100px;pointer-events:none;z-index:999;`;
  document.body.appendChild(fx);
  setTimeout(()=>fx.remove(),500);
});

      console.log("[CLIENT] myLen="+myLen+", targetIdx="+data.targetIdx+", displayIdx="+displayIdx);
      const tgtCard=myCards[displayIdx];
      if(tgtCard){
        const ar=atkCard.getBoundingClientRect();
        const tr=tgtCard.getBoundingClientRect();
        dx=((tr.left+tr.width/2)-(ar.left+ar.width/2))*0.7;
        dy=((tr.top+tr.height/2)-(ar.top+ar.height/2))*0.7;
      }
    }
  }

  // ★アニメーション実行
  atkCard.style.transition="none";
  atkCard.style.transform="translate(0,0)";
  void atkCard.offsetWidth;
  atkCard.style.transition="transform 0.18s ease-out";
  atkCard.style.transform=`translate(${dx}px,${dy}px)`;
  setTimeout(()=>{
    atkCard.style.transition="transform 0.16s ease-in";
    atkCard.style.transform="translate(0,0)";
    setTimeout(()=>{
      atkCard.style.transition="";
      atkCard.style.transform="";
    },180);
  },200);
});

// ★対象選択モード
let selectTargetMode=null; // {type:"myUnit"|"enemyUnit"|"anyUnit", message}

socket.on("selectTarget",(data)=>{
  selectTargetMode=data;
  document.getElementById("turn").innerText="⚔ "+data.message;

if(data.type==="fieldSpell"){
    const myFs=latestGameState?.myFieldSpell;
    const enFs=latestGameState?.enemyFieldSpell;
    let msg="崩壊：破壊するフィールドスペルを選択\n";
    if(myFs) msg+=`[自分] ${myFs.name}（耐久${myFs.durability}）\n`;
    if(enFs) msg+=`[相手] ${enFs.name}（耐久${enFs.durability}）\n`;
    const choice=confirm(msg+"OKで相手、キャンセルで自分のフィールドスペルを破壊");
    const target=choice?"op":"my";
    socket.emit("action",{type:"select_target",fieldSpellTarget:target});
    return;
  }

  // ライフ入力モード
  if(data.type==="lifeInput"){
    const maxVal = data.message.includes("1〜") ? 3 : 99;
    const input=prompt(data.message)||"0";
    const amount=parseInt(input,10);
    if(amount>0&&amount<=maxVal){
      socket.emit("action",{type:"select_target",targetSide:"life",lifeAmount:amount});
      selectTargetMode=null;
      document.getElementById("turn").innerText="▶ YOUR TURN";
    }else{
      socket.emit("action",{type:"select_target",targetSide:"life",lifeAmount:0}); // 無効値で再要求
    }
    return;
  }

  // 捨て場選択モード
  if(data.type==="graveSelect"){
    const options=data.options||[];
    const choice=prompt(data.message+"\n"+(options.map((n,i)=>`${i}: ${n}`).join("\n")))||"";
    const idx=parseInt(choice,10);
    if(!isNaN(idx)&&idx>=0&&idx<options.length){
      socket.emit("action",{type:"select_target",targetSide:"grave",graveIndex:idx});
      selectTargetMode=null;
      document.getElementById("turn").innerText="▶ YOUR TURN";
    }
    return;
  }
  // ★モーダル風の通知を表示
  const notice=document.createElement("div");
  notice.id="targetNotice";
  notice.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#ffe066;padding:16px 28px;border-radius:10px;font-size:15px;z-index:500;border:2px solid #ffe066;text-align:center;pointer-events:none;";
  notice.innerText="⚔ "+data.message;
  document.body.appendChild(notice);
  setTimeout(()=>{ const el=document.getElementById("targetNotice"); if(el) el.remove(); },2000);
});

let _prevTurn=null;
socket.on("update",(g)=>{
  latestGameState=g;

  // ★ターン交代検知
  if(_prevTurn!==null && _prevTurn!==g.turn && !g.winner){
    showTurnChangeAnim();
  }
  _prevTurn=g.turn;

  // ★音検知処理
  // ドロー検知：自分のデッキが減った＝自分がドローした
  if(prevMyDeckCount!==null && g.myDeckCount < prevMyDeckCount){
    const drawCount = prevMyDeckCount - g.myDeckCount;
    for(let i=0;i<drawCount;i++) playSE(SE.draw);
  }
  // 相手ドロー検知：相手デッキが減った
  if(prevEnemyDeckCount!==null && g.enemyDeckCount < prevEnemyDeckCount){
    const drawCount = prevEnemyDeckCount - g.enemyDeckCount;
    for(let i=0;i<drawCount;i++) playSE(SE.draw);
  }
  prevMyDeckCount=g.myDeckCount;
  prevEnemyDeckCount=g.enemyDeckCount;

  // 召喚検知：自分の場が増えた
  if(prevMyBoardCount!==null && g.myBoard.length > prevMyBoardCount){
    playSE(SE.summon);
  }
  // 相手召喚検知：相手の場が増えた
  if(prevEnemyBoardCount!==null && g.enemyBoard.length > prevEnemyBoardCount){
    playSE(SE.summon);
  }
  prevMyBoardCount=g.myBoard.length;
  prevEnemyBoardCount=g.enemyBoard.length;

  // 攻撃音検知：allLogsに攻撃ログが新たに追加された場合
  const newLogs=(g.allLogs||[]).slice(prevAllLogsLen);
  newLogs.forEach(log=>{
    if(log.includes("に攻撃（") || log.includes("でプレイヤーに直接攻撃") || log.includes("に全体攻撃")){
      // 攻撃者の属性を特定するためログからユニット名を抽出
      const match=log.match(/「(.+?)」(?:で|が)/);
      if(match){
        const unitName=match[1];
        const attr=getClientAttr(unitName);
        playSE(SE.atk[attr]||SE.atk.neutral);
      }
      // ★直接攻撃のとき画面を揺らす
      if(log.includes("でプレイヤーに直接攻撃")){
        document.body.classList.remove("shaking");
        void document.body.offsetWidth;
        document.body.classList.add("shaking");
        setTimeout(()=>document.body.classList.remove("shaking"), 460);
      }
    }
  });
  prevAllLogsLen=(g.allLogs||[]).length;

  // グロウコア待機中は既にselectTargetモードで上書きされているため変更不要
  if(!selectTargetMode){
    document.getElementById("turn").innerText=
      g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
  }
  document.getElementById("winner").innerText=
    g.winner?(g.winner===socket.id?"YOU WIN！":"YOU LOSE"):"";
  // ★勝敗演出
  if(g.winner && !resultShown){
    setTimeout(()=>{ showResult(g.winner===socket.id); }, 300);
  }
  // ★ゲームリセット時に結果フラグをリセット
  if(!g.winner) resultShown=false;

  // 相手手札を裏向き画像で表示
  const enemyHandArea=document.getElementById("enemyHandArea");
  if(enemyHandArea){
    enemyHandArea.innerHTML="";
    for(let i=0;i<g.enemyHandCount;i++){
      const d=document.createElement("div");
      d.className="enemy-hand-card";
      const img=document.createElement("img");
      img.src="images/card_back.png";
      d.appendChild(img);
      enemyHandArea.appendChild(d);
    }
  }
  let handIcons="";

  document.getElementById("enemyLife").innerText=g.enemyLife;
  document.getElementById("enemyEnergy").innerText=g.enemyEnergy+"/"+g.enemyMaxEnergy;
  document.getElementById("enemyDeck").innerText=g.enemyDeckCount;
  // 相手デッキ画像の表示切替
  const enemyDeckImg=document.getElementById("enemyDeckImg");
  if(enemyDeckImg) enemyDeckImg.style.opacity=g.enemyDeckCount>0?"1":"0.2";

  allLogsData=g.allLogs||[];
  const logBox=document.getElementById("logBox");
  const currentLogs=g.currentTurnLogs||[];
  // ★現ターンのログがあれば更新して保持、なければ前回表示を維持
  if(currentLogs.length>0){
    lastDisplayedLogs=currentLogs;
  }
  const displayLogs=lastDisplayedLogs;
  if(displayLogs.length===0){
    logBox.innerHTML=`<div style="color:#666;font-size:12px">（まだログがありません）</div>`;
  }else{
    logBox.innerHTML=displayLogs.map(l=>`<div class="logLine">${l}</div>`).join("");
    logBox.scrollTop=logBox.scrollHeight;
  }
  document.getElementById("logTitle").innerText="GAME LOG";


　// --- フィールドスペル表示 ---
  renderFieldSpell("myFieldSpell", g.myFieldSpell);
  renderFieldSpell("enemyFieldSpell", g.enemyFieldSpell);

  // --- 相手フィールド ---
  const _renderEnemyField=()=>{
    const ef=document.getElementById("enemyUnits");
    if(!ef) return;
    ef.innerHTML="";
    // ★UNIT空枠3つを常時表示
    for(let si=0;si<3;si++){
      const slot=document.createElement("div");
      slot.className="unit-slot-empty";
      ef.appendChild(slot);
    }
    // ★相手は左から順に表示（空枠の後ろに追加）
    g.enemyBoard.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="card";
    const img=document.createElement("img");
    img.src="images/"+c.name+".png";
    img.onmouseenter=()=>{ document.getElementById("preview").innerHTML=`<img src="images/${c.name}.png">`; };
    img.onmouseleave=()=>{ document.getElementById("preview").innerHTML=""; };
    div.ondragover=(e)=>e.preventDefault();
    div.ondrop=(e)=>{
      e.preventDefault();
      if(draggedUnitIndex!==null){
        if(confirm(`${draggedUnitName} で ${c.name} に攻撃？`)){
          const atkIdx=draggedUnitIndex;
          const tIdx=i;
          const enLen=g.enemyBoard.length;
          draggedUnitIndex=null;
          playAttackAnim(atkIdx, tIdx, false, enLen);
          setTimeout(()=>{
            socket.emit("action",{type:"attack",a:atkIdx,t:tIdx});
          },200);
        } else {
          draggedUnitIndex=null;
        }
      }
    };
div.onclick=()=>{
      // ★対象選択モード中
      if(selectTargetMode && (selectTargetMode.type==="enemyUnit"||selectTargetMode.type==="anyUnit")){
        socket.emit("action",{type:"select_target",targetIndex:i,targetSide:"enemy"});
        selectTargetMode=null;
        document.getElementById("turn").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
        return;
      }
      if(selectedUnitIndex!==null){
        if(confirm(`${selectedUnitName} で ${c.name} に攻撃？`)){
          const atkIdx=selectedUnitIndex;
          const tIdx=i;
          const enLen=g.enemyBoard.length;
          clearSelection();
          playAttackAnim(atkIdx, tIdx, false, enLen);
          setTimeout(()=>{
            socket.emit("action",{type:"attack",a:atkIdx,t:tIdx});
          },200);
        } else {
          clearSelection();
        }
      }
    };
const stat=document.createElement("div");
    stat.className="stat";
    let statText=`HP${c.hp} AT${c.atk}`;
    if(c.disabled) statText+=" 🚫";
    if(c.barrier)  statText+=" 💎";
    if(c.denko && !c.attacked) statText+=" ⚡x2";
    if(c.denko && c.attacked && !c.denkoAttackedThisTurn) statText+=" ⚡x1";
    stat.innerText=statText;
    div.appendChild(img); div.appendChild(stat);
    ef.appendChild(div);
  });

// ★ユニット数に応じて空枠を調整
    const emptySlots=ef.querySelectorAll(".unit-slot-empty");
    const cardCount=ef.querySelectorAll(".card").length;
    emptySlots.forEach((s,i)=>{ s.style.display=i<(3-cardCount)?"flex":"none"; });

  }; // _renderEnemyField終了

  // ★被弾アニメーション中なら少し遅らせてから再描画
  if(hitEffectActiveEnemy){
    setTimeout(_renderEnemyField, 400);
  } else {
    _renderEnemyField();
  }
  // ★自分フィールドも被弾中なら遅延
  if(hitEffectActiveMy){
    setTimeout(()=>{
      const myUnits2=document.getElementById("myUnits");
      if(!myUnits2) return;
      // 自分フィールド再描画をここで行う必要があるため
      // 既存の自分フィールド描画コードをそのまま実行
    }, 400);
  }

  // --- 直接攻撃ゾーン ---
  const epz=document.getElementById("enemyPlayerZone");
  epz.ondragover=(e)=>{e.preventDefault();epz.classList.add("dragover");};
  epz.ondragleave=()=>epz.classList.remove("dragover");
  epz.ondrop=(e)=>{
    e.preventDefault();
    epz.classList.remove("dragover");
    if(draggedUnitIndex!==null){
      if(confirm(`${draggedUnitName} でプレイヤーに直接攻撃？`)){
        const atkIdx=draggedUnitIndex;
          draggedUnitIndex=null;
          playAttackAnim(atkIdx, null, true, 0);
          setTimeout(()=>{
            socket.emit("action",{type:"attack",a:atkIdx});
          },200);
      } else {
        draggedUnitIndex=null;
      }
    }
  };
  epz.onclick=()=>{
    if(selectedUnitIndex!==null){
      if(confirm(`${selectedUnitName} でプレイヤーに直接攻撃？`)){
        const atkIdx=selectedUnitIndex;
          clearSelection();
          playAttackAnim(atkIdx, null, true, 0);
          setTimeout(()=>{
            socket.emit("action",{type:"attack",a:atkIdx});
          },200);
      } else {
        clearSelection();
      }
    }
  };

  // --- 自分フィールド ---
  const _renderMyField=()=>{
  const myUnits=document.getElementById("myUnits");
  if(!myUnits) return;
  myUnits.innerHTML="";
  // ★UNIT空枠3つを常時表示（自分は右から表示のため逆順）
  for(let si=0;si<3;si++){
    const slot=document.createElement("div");
    slot.className="unit-slot-empty";
    myUnits.appendChild(slot);
  }
  // ★自分のユニットは右から配置（逆順で追加）
  const reversedMyBoard=[...g.myBoard].reverse();
  reversedMyBoard.forEach((c,i)=>{
    const originalIdx=g.myBoard.length-1-i; // 元のインデックス（攻撃時に使用）
    const div=document.createElement("div");
    div.className="card";
    const img=document.createElement("img");
    img.src="images/"+c.name+".png";
    img.onmouseenter=()=>{ document.getElementById("preview").innerHTML=`<img src="images/${c.name}.png">`; };
    img.onmouseleave=()=>{ document.getElementById("preview").innerHTML=""; };
    img.draggable=true;
    img.ondragstart=()=>{ draggedUnitIndex=i; draggedUnitName=c.name; };
div.onclick=()=>{
      // ★対象選択モード中
      if(selectTargetMode && (selectTargetMode.type==="myUnit"||selectTargetMode.type==="anyUnit")){
        socket.emit("action",{type:"select_target",targetIndex:originalIdx,targetSide:"my"});
        selectTargetMode=null;
        document.getElementById("turn").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
        return;
      }
      // 電光石火2回目：同じユニットが選択済みでも解除しない（そのまま相手を選ばせる）
      if(selectedUnitIndex===i){
        // 電光石火持ちで1回目攻撃済みの場合は選択維持（2回目攻撃のため）
        if(c.denko && c.attacked && !c.denkoAttackedThisTurn){
          // 電光石火2回目のため選択維持
          return;
        }
        clearSelection();
        return;
      }
      clearSelection();
      selectedUnitIndex=originalIdx;
      selectedUnitName=c.name;
      div.classList.add("selected");
    };
const stat=document.createElement("div");
    stat.className="stat";
    let statText=`HP${c.hp} AT${c.atk}`;
    if(c.disabled) statText+=" 🚫";
    if(c.barrier)  statText+=" 🛡";
    if(c.denko && !c.attacked) statText+=" ⚡x2";
    if(c.denko && c.attacked && !c.denkoAttackedThisTurn) statText+=" ⚡x1";
    stat.innerText=statText;
    div.appendChild(img); div.appendChild(stat);
    myUnits.appendChild(div);
  });

  // ★ユニット数に応じて空枠を調整
  const myEmptySlots=myUnits.querySelectorAll(".unit-slot-empty");
  const myCardCount=myUnits.querySelectorAll(".card").length;
  myEmptySlots.forEach((s,i)=>{ s.style.display=i<(3-myCardCount)?"flex":"none"; });

  // ★巻き戻し後の攻撃者選択を復元
  if(pendingAttackerIndex!==null){
    const myUnitsEl=document.getElementById("myUnits");
    const cards=myUnitsEl?myUnitsEl.querySelectorAll(".card"):[];
    const displayIdx=g.myBoard.length-1-pendingAttackerIndex;
    if(cards[displayIdx]){
      selectedUnitIndex=pendingAttackerIndex;
      selectedUnitName=g.myBoard[pendingAttackerIndex]?.name||"";
      cards[displayIdx].classList.add("selected");
    }
    pendingAttackerIndex=null;
  }
  }; // _renderMyField終了

  if(hitEffectActiveMy){
    setTimeout(_renderMyField, 400);
  } else {
    _renderMyField();
  }

  // --- 自分情報 ---
  document.getElementById("myLife").innerText=g.myLife;
  document.getElementById("myEnergy").innerText=g.myEnergy+"/"+g.myMaxEnergy;
  document.getElementById("myDeck").innerText=g.myDeckCount;
  // 自分デッキ画像の表示切替
  const myDeckImg=document.getElementById("myDeckImg");
  if(myDeckImg) myDeckImg.style.opacity=g.myDeckCount>0?"1":"0.2";
  myGraveData=g.myGrave;
  enemyGraveData=g.enemyGrave;
  // 捨て場の最新カード表示
  _renderGravePile("myGravePile","myGraveEmpty",g.myGrave);
  _renderGravePile("enemyGravePile","enemyGraveEmpty",g.enemyGrave);

// ★手札捨て待ちメッセージ
  if(g.pendingDiscard && g.pendingDiscard>0){
    if(g.isHandLimit){
      document.getElementById("turn").innerText=
        `⚠️ 手札上限超過！${g.pendingDiscard}枚捨ててください（上限7枚）`;
    } else if(g.isSoulTrade){
      document.getElementById("turn").innerText=
        `🔄 ソウルトレード：捨てるカードを1枚選んでください`;
    }
  }

  // --- 手札 ---
  const hand=document.getElementById("handArea");
  hand.innerHTML="";
  const handCount=g.myHand.length;
  // 枚数が増えるほど重なりを増やして枠内に収める
  const maxAngle=Math.min(3*handCount, 24);
  const overlapPx=handCount<=4 ? 0 : Math.min((handCount-4)*12, 44);
  g.myHand.forEach((card,hi)=>{
    const div=document.createElement("div");
    div.className="card";
    const ratio = handCount<=1 ? 0 : (hi/(handCount-1))*2-1;
    const rotate = ratio * maxAngle;
    const translateY = Math.abs(ratio) * Math.abs(rotate) * 0.4;
    const marginLeft = hi===0 ? 0 : -overlapPx;
    div.style.cssText=`transform:rotate(${rotate}deg) translateY(${translateY}px);transform-origin:center bottom;z-index:${hi};margin-left:${marginLeft}px;`;
    div.onmouseenter=()=>{
      div.style.cssText=`transform:rotate(${rotate}deg) translateY(${translateY-12}px);transform-origin:center bottom;z-index:100;transition:transform 0.18s ease;margin-left:${marginLeft}px;`;
    };
    div.onmouseleave=()=>{
      div.style.cssText=`transform:rotate(${rotate}deg) translateY(${translateY}px);transform-origin:center bottom;z-index:${hi};transition:transform 0.18s ease;margin-left:${marginLeft}px;`;
    };
    const img=document.createElement("img");
    img.src="images/"+card+".png";
    img.onmouseenter=()=>{ document.getElementById("preview").innerHTML=`<img src="images/${card}.png">`; };
    img.onmouseleave=()=>{ document.getElementById("preview").innerHTML=""; };
    img.draggable=true;
    img.ondragstart=()=>{ draggedCard=card; };
div.onclick=()=>{
      if(g.pendingDiscard && g.pendingDiscard>0){
        if(confirm(card+" を捨てますか？")){
          socket.emit("action",{type:"discard_hand",card});
        }
      
        } else if(selectTargetMode && (
        selectTargetMode.type==="handUnit_steel_cost3"||
        selectTargetMode.type==="handUnit_cost2"||
        selectTargetMode.type==="handUnit_cost3"||
        selectTargetMode.type==="handUnit_steel"
      )){
        // ★手札からユニット選択系
        const hi=g.myHand.indexOf(card);
        socket.emit("action",{type:"select_target",targetIndex:hi,targetSide:"hand",handIndex:hi});
        selectTargetMode=null;
        document.getElementById("turn").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
      } else if(selectTargetMode && selectTargetMode.type==="soulTrade"){
        // ★ソウルトレードの手札捨て（select_targetとして送信）
        if(confirm(card+" を捨てますか？")){
          const hi=g.myHand.indexOf(card);
          socket.emit("action",{type:"select_target",targetSide:"soulTrade",handIndex:hi,card:card});
          selectTargetMode=null;
          document.getElementById("turn").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
        }
      } else {
        if(confirm(card+" を使用しますか？")){
          socket.emit("action",{type:"play_card",card});
        }
      }
    };
    div.appendChild(img);
    hand.appendChild(div);
  });

});
