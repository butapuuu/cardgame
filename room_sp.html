<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="/manifest_room.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エレモン">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2a1a">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta charset="utf-8">
<title>Elemon ルーム対戦 SP</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{ --field-bg:rgba(0,80,0,0.35); --field-border:#2d6a2d; --enemy-field-bg:rgba(80,0,0,0.25); --enemy-field-border:#6a2d2d; }
html,body{ width:100%; height:100%; overflow:hidden; background:#1a2a1a; color:#eee; font-family:sans-serif; transition:background 0.8s; }
img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; pointer-events:auto; }

/* ===== ロビー ===== */
#spLobby{
  width:100%; max-width:400px; margin:0 auto;
  padding:16px; overflow-y:auto; height:100vh;
}
#spLobby h2{ color:#ffe066; font-size:17px; margin-bottom:16px; text-align:center; letter-spacing:2px; padding-top:8px; }
#spLobby input{
  width:100%; background:#0e1a0e; color:#eee;
  border:1px solid #3a6a3a; border-radius:6px;
  padding:10px 12px; font-size:14px; margin-bottom:8px;
  -webkit-appearance:none;
}
#spLobby input::placeholder{ color:#556655; }
.sp-lobby-btn{
  width:100%; padding:12px; font-size:13px; font-weight:bold;
  border-radius:6px; cursor:pointer; letter-spacing:1px;
  margin-bottom:8px; transition:all 0.2s; border:none;
  -webkit-appearance:none;
}
.sp-btn-create{ background:linear-gradient(135deg,#0d2a0d,#1a4a1a); color:#88ff88; border:1px solid #2a8a2a; }
.sp-btn-join{ background:linear-gradient(135deg,#0a1a2a,#1a2a3a); color:#88aaff; border:1px solid #2a4a8a; }
.sp-btn-spectate{ background:linear-gradient(135deg,#1a1a0a,#2a2a1a); color:#ffcc44; border:1px solid #6a6a22; }
.sp-btn-back{ background:rgba(0,0,0,0.3); color:#888; border:1px solid #444; }
#spLobbyStatus{ color:#aaa; font-size:12px; text-align:center; margin-top:8px; }
#spLobbyError{ color:#ff6666; font-size:12px; text-align:center; margin-top:4px; min-height:16px; }
.sp-lobby-divider{ border:none; border-top:1px solid #2a4a2a; margin:12px 0; }
.sp-lobby-label{ color:#aaddaa; font-size:11px; margin-bottom:5px; letter-spacing:1px; }
#spSpectateIdDisplay{
  background:rgba(255,200,0,0.1); border:1px solid rgba(255,200,0,0.4);
  border-radius:8px; padding:10px; margin-top:8px; display:none; text-align:center;
}
#spSpectateIdDisplay .sid-label{ color:#aaa; font-size:10px; letter-spacing:1px; }
#spSpectateIdDisplay .sid-val{ color:#ffe066; font-size:26px; font-weight:bold; letter-spacing:5px; margin-top:3px; }
#spSpectateIdDisplay .sid-note{ color:#888; font-size:10px; margin-top:3px; }

/* ===== 待機中 ===== */
#spWaiting{
  display:none; width:100%; max-width:400px; margin:0 auto;
  padding:32px 16px; text-align:center;
}
#spWaiting h3{ color:#ffe066; font-size:15px; margin-bottom:12px; }
#spWaitingRoomId{ color:#88ff88; font-size:20px; font-weight:bold; letter-spacing:3px; margin-bottom:6px; }
#spWaitingSpectateId{ color:#aaa; font-size:12px; margin-bottom:12px; }
.sp-waiting-anim{ color:#aaddaa; font-size:12px; animation:spWaitBlink 1.2s ease-in-out infinite; }
@keyframes spWaitBlink{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ===== ゲーム画面 ===== */
#spGameRoot{ display:none; flex-direction:column; width:100vw; height:100vh; overflow:hidden; position:relative; }

#spHeader{ background:rgba(0,0,0,0.6); border-bottom:1px solid #333; padding:2px 6px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-shrink:0; }
#spHeader button{ background:linear-gradient(135deg,#1a2a1a,#2a3a2a); color:#aaddaa; border:1px solid #3a6a3a; border-radius:4px; padding:3px 7px; font-size:10px; font-weight:bold; cursor:pointer; white-space:nowrap; }
#spTurnLabel{ font-size:10px; font-weight:bold; color:#ffe066; margin-left:auto; }
#spWinner{ font-size:10px; font-weight:bold; color:#ff6666; }

#spMat{ flex:1; display:flex; flex-direction:column; overflow:hidden; padding:2px 3px; gap:3px; min-height:0; }

/* 観戦バナー */
#spSpectateBanner{ background:rgba(255,200,0,0.15); border:1px solid rgba(255,200,0,0.4); border-radius:5px; padding:4px 10px; text-align:center; color:#ffe066; font-size:10px; font-weight:bold; letter-spacing:1px; flex-shrink:0; display:none; }

.sp-info-bar{ display:flex; align-items:center; gap:4px; padding:1px 4px; background:rgba(0,0,0,0.4); border-radius:5px; flex-shrink:0; }
.sp-life-badge{ display:flex; flex-direction:column; align-items:center; background:radial-gradient(circle at 40% 35%,#5a1a1a,#1a0808); border:2px solid #cc4444; border-radius:50%; width:clamp(36px,10vw,48px); height:clamp(36px,10vw,48px); justify-content:center; box-shadow:0 0 8px rgba(200,50,50,0.4); flex-shrink:0; }
.sp-life-badge .lv{ font-size:clamp(13px,4.5vw,17px); font-weight:bold; color:#ffaaaa; line-height:1; }
.sp-life-badge .ll{ font-size:6px; color:#cc6666; letter-spacing:1px; }
.sp-energy-badge{ background:linear-gradient(135deg,#0a1a2a,#0d2a3a); border:1px solid #2266aa; border-radius:5px; padding:2px 8px; text-align:center; }
.sp-energy-badge .el{ font-size:7px; color:#4488cc; letter-spacing:1px; }
.sp-energy-badge .ev{ font-size:12px; font-weight:bold; color:#88ccff; }
.sp-deck-grave{ display:flex; gap:4px; align-items:center; }
.sp-deck-pile{ position:relative; width:clamp(28px,9vw,38px); }
.sp-deck-pile img{ width:100%; border-radius:3px; box-shadow:1px 1px 0 #222,2px 2px 0 #111; }
.sp-deck-pile .sp-deck-count{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:9px; font-weight:bold; text-shadow:0 0 4px #000; pointer-events:none; z-index:10; }
.sp-grave-pile{ position:relative; width:clamp(28px,9vw,38px); cursor:pointer; }
.sp-grave-pile img{ width:100%; border-radius:3px; box-shadow:0 1px 4px #000; }
.sp-grave-pile .sp-grave-empty{ width:100%; height:calc(clamp(28px,9vw,38px)*1.44); border:1px solid rgba(180,140,80,0.4); border-radius:3px; display:flex; align-items:center; justify-content:center; color:rgba(180,140,80,0.4); font-size:5px; letter-spacing:1px; font-weight:bold; }
.sp-grave-pile .sp-grave-count{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:9px; font-weight:bold; text-shadow:0 0 4px #000; pointer-events:none; z-index:10; }

#spEnemyHand{ display:flex; gap:2px; justify-content:center; flex-shrink:0; padding:0; }
#spEnemyHand img{ width:clamp(14px,5vw,20px); border-radius:2px; box-shadow:0 1px 3px #000; }

.sp-field{ flex:0 0 13vh; background:var(--field-bg); border:1px solid var(--field-border); border-radius:6px; display:flex; align-items:center; justify-content:center; padding:2px 66px; min-height:0; position:relative; transition:background 0.8s,border-color 0.8s; overflow:visible; }
.sp-field.enemy-field{ background:var(--enemy-field-bg); border-color:var(--enemy-field-border); }
.sp-unit-slots{ display:flex; gap:4px; align-items:center; flex:0 0 auto; }
.sp-unit-slot-empty{ width:8vh; height:10vh; border:1px solid rgba(255,255,255,0.15); border-radius:4px; background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.sp-unit-slot-empty::before{ content:"UNIT"; font-size:6px; color:rgba(255,255,255,0.15); letter-spacing:2px; font-weight:bold; pointer-events:none; }
.sp-fs-slot{ position:absolute; top:50%; transform:translateY(-50%); width:8vh; height:10vh; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,215,0,0.4); border-radius:4px; background:rgba(255,215,0,0.03); }
.sp-fs-slot::before{ content:"FIELD"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:6px; color:rgba(255,215,0,0.25); letter-spacing:2px; pointer-events:none; font-weight:bold; }
.sp-fs-slot:not(:empty)::before{ display:none; }
#spMyField>.sp-fs-slot{ left:4px; }
#spEnemyField>.sp-fs-slot{ right:4px; }
.sp-card{ display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; position:relative; flex-shrink:0; transition:transform 0.15s; }
.sp-card:active{ transform:scale(0.95); }
.sp-card img{ width:8vh; border-radius:3px; box-shadow:0 2px 4px #000; }
.sp-card .sp-stat{ font-size:7px; color:#ffe066; margin-top:2px; background:rgba(0,0,0,0.85); border-radius:2px; padding:1px 3px; white-space:nowrap; z-index:5; }
.sp-card.selected img{ outline:2px solid #ff4444; border-radius:3px; }

#spDirectZone{ background:linear-gradient(135deg,rgba(80,0,0,0.25),rgba(120,0,0,0.15)); border:1px solid rgba(180,60,60,0.4); border-radius:4px; height:18px; display:flex; align-items:center; justify-content:center; color:rgba(220,100,100,0.7); font-size:8px; font-weight:bold; letter-spacing:2px; cursor:pointer; flex-shrink:0; transition:all 0.2s; }
#spDirectZone.active{ background:linear-gradient(135deg,rgba(160,20,20,0.4),rgba(100,0,0,0.3)); border-color:rgba(255,80,80,0.7); color:rgba(255,150,150,0.95); }

#spHandArea{ flex:1; min-height:14vh; max-height:20vh; display:flex; align-items:center; justify-content:center; padding:0 6px; position:relative; overflow:hidden; }

#spBtnArea{ display:flex; gap:4px; padding:4px 5px 10px; flex-shrink:0; }
#spEndTurnBtn{ flex:1; background:linear-gradient(135deg,#0d2a0d,#1a4a1a); color:#88ff88; border:1px solid #2a8a2a; border-radius:6px; padding:10px 4px; font-size:12px; font-weight:bold; cursor:pointer; }
#spSurrenderBtn{ flex:1; background:linear-gradient(135deg,#2a0808,#4a1212); color:#ff8888; border:1px solid #8a2222; border-radius:6px; padding:10px 4px; font-size:12px; font-weight:bold; cursor:pointer; }

/* モーダル */
.sp-modal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
.sp-modal.open{ display:flex; }
.sp-modal-inner{ background:#1e1e2e; border:1px solid #555; border-radius:10px; padding:16px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; }
.sp-modal-inner h3{ color:#ffe066; margin-bottom:10px; font-size:14px; }
.sp-modal-close{ margin-top:10px; background:#444; color:#eee; border:1px solid #666; border-radius:6px; padding:6px 18px; cursor:pointer; font-size:12px; width:100%; }

#spPreviewModal{ z-index:1500; }
#spPreviewModal .sp-modal-inner{ background:transparent; border:none; display:flex; align-items:center; justify-content:center; }
#spPreviewModal img{ width:220px; border-radius:10px; box-shadow:0 0 20px #000; }

/* アニメーション */
#spTurnChangeOverlay{ position:fixed; top:0; left:-100%; width:100%; height:100%; z-index:3000; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#spTurnChangeOverlay img{ width:85%; max-width:340px; filter:drop-shadow(0 0 20px rgba(255,200,50,0.8)); }
.sp-turn-change-anim{ animation:spTCSlide 1.4s cubic-bezier(0.22,1,0.36,1) forwards !important; }
@keyframes spTCSlide{ 0%{left:-100%;opacity:0;} 15%{left:0%;opacity:1;} 75%{left:0%;opacity:1;} 100%{left:100%;opacity:0;} }
#spDrawCardAnim{ position:fixed; pointer-events:none; z-index:2500; display:none; border-radius:7px; box-shadow:0 0 16px rgba(255,220,100,0.8); width:52px; }
#spDrawCardAnimFront{ position:fixed; pointer-events:none; z-index:2500; display:none; border-radius:7px; box-shadow:0 0 24px rgba(255,220,100,0.9); width:180px; }
@keyframes spDamagePop{ 0%{transform:translate(-50%,-150%) scale(0.5);opacity:0;} 15%{transform:translate(-50%,-180%) scale(1.3);opacity:1;} 40%{transform:translate(-50%,-200%) scale(1);opacity:1;} 100%{transform:translate(-50%,-280%) scale(0.8);opacity:0;} }
.sp-damage-pop{ position:fixed; pointer-events:none; z-index:1800; font-family:Georgia,serif; font-weight:bold; text-shadow:0 0 8px rgba(0,0,0,0.9); animation:spDamagePop 1.2s ease-out forwards; white-space:nowrap; }
.sp-damage-pop.dmg-unit{ font-size:22px; color:#ff4444; }
.sp-damage-pop.dmg-life{ font-size:28px; color:#ff2222; }
.sp-damage-pop.dmg-enemy{ color:#ffaa00; }
@keyframes spScreenShake{ 0%{transform:translate(0,0);} 15%{transform:translate(-5px,-3px);} 30%{transform:translate(5px,3px);} 45%{transform:translate(-4px,2px);} 60%{transform:translate(4px,-2px);} 75%{transform:translate(-2px,1px);} 100%{transform:translate(0,0);} }
.sp-shaking{ animation:spScreenShake 0.4s ease-in-out; }
#spResultOverlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:2000; justify-content:center; align-items:center; cursor:pointer; }
#spResultOverlay img{ max-width:80%; max-height:60%; }
#spTargetNotice{ position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:#ffe066; padding:12px 20px; border-radius:8px; font-size:13px; z-index:500; border:2px solid #ffe066; text-align:center; pointer-events:none; display:none; max-width:90vw; }

/* カスタム確認モーダル */
#spConfirmModal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9000; justify-content:center; align-items:center; }
#spConfirmModal .sp-cm-inner{ background:#1e2e1e; border:2px solid #3a6a3a; border-radius:12px; padding:20px; width:85%; max-width:340px; text-align:center; }
#spConfirmMsg{ color:#eee; font-size:14px; line-height:1.7; margin-bottom:16px; white-space:pre-wrap; }
.sp-cm-btns{ display:flex; gap:10px; }
.sp-cm-ok{ flex:1; background:linear-gradient(135deg,#0d2a0d,#1a4a1a); color:#88ff88; border:1px solid #2a8a2a; border-radius:6px; padding:10px; font-size:13px; font-weight:bold; cursor:pointer; }
.sp-cm-cancel{ flex:1; background:linear-gradient(135deg,#2a0808,#4a1212); color:#ff8888; border:1px solid #8a2222; border-radius:6px; padding:10px; font-size:13px; font-weight:bold; cursor:pointer; }
#spPromptModal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9000; justify-content:center; align-items:center; }
#spPromptModal .sp-pm-inner{ background:#1e2e1e; border:2px solid #3a6a3a; border-radius:12px; padding:20px; width:85%; max-width:340px; text-align:center; }
#spPromptMsg{ color:#eee; font-size:14px; line-height:1.7; margin-bottom:12px; white-space:pre-wrap; }
#spPromptInput{ width:100%; background:#0e1a0e; color:#eee; border:1px solid #3a6a3a; border-radius:6px; padding:8px; font-size:16px; text-align:center; margin-bottom:12px; }
</style>
</head>
<body>

<img id="spDrawCardAnim" src="images/card_back.png">
<img id="spDrawCardAnimFront" src="images/card_back.png">
<div id="spTurnChangeOverlay"><img src="images/TURN CHANGE.png" alt="TURN CHANGE"></div>
<div id="spResultOverlay" onclick="spCloseResult()"><img id="spResultImg" src=""></div>
<div id="spTargetNotice"></div>

<!-- カードプレビューモーダル -->
<div class="sp-modal" id="spPreviewModal" onclick="this.classList.remove('open')">
  <div class="sp-modal-inner"><img id="spPreviewImg" src=""></div>
</div>

<!-- 捨て場モーダル -->
<div class="sp-modal" id="spGraveModal">
  <div class="sp-modal-inner">
    <h3 id="spGraveModalTitle">🪦 捨て場</h3>
    <div id="spGraveModalCards" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    <button class="sp-modal-close" onclick="document.getElementById('spGraveModal').classList.remove('open')">閉じる</button>
  </div>
</div>

<!-- ログモーダル -->
<div class="sp-modal" id="spLogModal">
  <div class="sp-modal-inner">
    <h3>📜 ゲームログ</h3>
    <div id="spLogModalContent" style="font-size:12px;color:#ccc;line-height:1.7;"></div>
    <button class="sp-modal-close" onclick="document.getElementById('spLogModal').classList.remove('open')">閉じる</button>
  </div>
</div>

<!-- カスタム確認モーダル -->
<div id="spConfirmModal">
  <div class="sp-cm-inner">
    <div id="spConfirmMsg"></div>
    <div class="sp-cm-btns">
      <button class="sp-cm-ok" id="spConfirmOK">OK</button>
      <button class="sp-cm-cancel" id="spConfirmCancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- カスタム入力モーダル -->
<div id="spPromptModal">
  <div class="sp-pm-inner">
    <div id="spPromptMsg"></div>
    <input id="spPromptInput" type="number">
    <div class="sp-cm-btns">
      <button class="sp-cm-ok" id="spPromptOK">OK</button>
      <button class="sp-cm-cancel" id="spPromptCancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- ロビー -->
<div id="spLobby">
  <h2>⚔ ルーム対戦</h2>
  <a href="top_sp.html" style="display:block;width:100%;text-align:center;padding:9px;margin-bottom:8px;background:linear-gradient(135deg,#0a1a0a,#1a2a1a);color:rgba(180,220,100,0.7);border:1px solid rgba(60,140,60,0.35);border-radius:8px;font-size:11px;font-weight:bold;letter-spacing:3px;text-decoration:none;text-transform:uppercase;">◈ TOP</a>

  <div class="sp-lobby-label">デッキ選択</div>
  <select id="spDeckSelectLobby" style="width:100%;background:#0e1a0e;color:#aaddaa;border:1px solid #3a6a3a;border-radius:6px;padding:8px;font-size:12px;margin-bottom:10px;">
    <option value="-1">デッキ選択</option>
  </select>
  <button class="sp-lobby-btn" onclick="location.href='deck1_sp.html'" style="background:linear-gradient(135deg,#1a0a2a,#2a1a3a);color:#cc88ff;border:1px solid #6a3a8a;margin-bottom:8px;">⚔ デッキ構築</button>

  <hr class="sp-lobby-divider">

  <div id="spLobbyStatus"></div>

  <div class="sp-lobby-label">ルームIDを入力して作成 / 参加</div>
  <input type="text" id="spRoomIdInput" placeholder="ルームID（好きな言葉）" maxlength="20">
  <button class="sp-lobby-btn sp-btn-create" onclick="spCreateRoom()">🏠 ルームを作成する</button>
  <button class="sp-lobby-btn sp-btn-join" onclick="spJoinRoom()">🚪 ルームに参加する</button>

  <div id="spSpectateIdDisplay">
    <div class="sid-label">観戦ID</div>
    <div class="sid-val" id="spSpectateIdVal">----</div>
    <div class="sid-note">この数字で観戦できます</div>
  </div>

  <hr class="sp-lobby-divider">

  <div class="sp-lobby-label">観戦IDを入力して観戦</div>
  <input type="text" id="spSpectateIdInput" placeholder="観戦ID（4桁の数字）" maxlength="4" inputmode="numeric">
  <button class="sp-lobby-btn sp-btn-spectate" onclick="spJoinSpectate()">👁 観戦する</button>

  <div id="spLobbyStatus"></div>
  <div id="spLobbyError"></div>

</div>

<!-- 待機中 -->
<div id="spWaiting">
  <h3>⏳ 対戦相手を待っています</h3>
  <div id="spWaitingRoomId"></div>
  <div id="spWaitingSpectateId"></div>
  <div class="sp-waiting-anim">接続待機中...</div>
  <br>
  <button onclick="location.reload()" style="background:rgba(0,0,0,0.3);color:#888;border:1px solid #444;border-radius:6px;padding:8px 20px;cursor:pointer;font-size:12px;">キャンセル</button>
</div>

<!-- ゲーム画面 -->
<div id="spGameRoot">
  <div id="spHeader">
    <div style="display:flex;align-items:center;gap:4px;width:100%;flex-wrap:nowrap;">
      <span id="spRoomInfoLabel" style="color:#ffe066;font-size:9px;font-weight:bold;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      <a href="top_sp.html" style="background:linear-gradient(135deg,#0a1a0a,#1a2a1a);color:rgba(180,220,100,0.7);border:1px solid rgba(60,140,60,0.35);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:bold;letter-spacing:1px;text-decoration:none;white-space:nowrap;">◈ TOP</a>
      <button id="spBgmBtn" onclick="spToggleBGM()" style="background:linear-gradient(135deg,#0a1a2a,#1a2a3a);color:#88aacc;border:1px solid #2a4a6a;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:bold;cursor:pointer;">🎵</button>

// ===== 手札描画 =====
function _spRenderHand(handCards,g){
  if(spPlayerRole==="spectator"){
    const hand=document.getElementById("spHandArea");
    hand.innerHTML="";
    hand.style.overflow="hidden";
    const count=g.myHandCount||0;
    if(count===0)return;
    const handW=Math.max(1,hand.clientWidth-12);
    const hAH=hand.offsetHeight||window.innerHeight*0.18;
    const bCH=Math.floor(hAH*0.82);const bCW=Math.floor(bCH/1.4);
    const rawCardW=count<=1?bCW:Math.min(bCW,Math.floor(handW/count));
    const cardW=Math.max(24,rawCardW);
    const totalNatural=cardW*count;
    const overlapPx=totalNatural>handW&&count>1?Math.ceil((totalNatural-handW)/(count-1)):0;
    for(let i=0;i<count;i++){
      const div=document.createElement("div");div.className="sp-card";
      const ml=i===0?0:-overlapPx;
      div.style.cssText=`display:inline-flex;flex-direction:column;align-items:center;flex-shrink:0;margin-left:${ml}px;`;
      const img=document.createElement("img");img.src="images/card_back.png";
      img.style.cssText=`width:${cardW}px;border-radius:3px;box-shadow:0 1px 4px #000;`;
      div.appendChild(img);hand.appendChild(div);
    }
    return;
  }
  const hand=document.getElementById("spHandArea");hand.innerHTML="";
  const hc=handCards.length;const maxAngle=Math.min(3*hc,22);
  const hAH=document.getElementById("spHandArea")?.offsetHeight||window.innerHeight*0.18;
  const bCH=Math.floor(hAH*0.82);const bCW=Math.floor(bCH/1.4);
  const cardW=hc<=3?bCW:hc<=5?Math.max(52,Math.floor(bCW*0.88)):hc<=7?Math.max(48,Math.floor(bCW*0.76)):Math.max(44,Math.floor(bCW*0.65));
  const overlapPx=hc<=4?0:Math.min((hc-4)*8,36);
  handCards.forEach((card,hi)=>{
    const div=document.createElement("div");div.className="sp-card";
    const ratio=hc<=1?0:(hi/(hc-1))*2-1;const rotate=ratio*maxAngle;const ty=Math.abs(ratio)*Math.abs(rotate)*0.4;const ml=hi===0?0:-overlapPx;
    div.style.cssText=`transform:rotate(${rotate}deg) translateY(${ty}px);transform-origin:center bottom;z-index:${hi};margin-left:${ml}px;`;
    const img=document.createElement("img");img.src="images/"+card+".png";img.style.width=cardW+"px";
    let pt=null,lp=false;
    div.addEventListener("touchstart",(e)=>{lp=false;pt=setTimeout(()=>{lp=true;document.getElementById("spPreviewImg").src="images/"+card+".png";document.getElementById("spPreviewModal").classList.add("open");},400);},{passive:true});
    div.addEventListener("touchmove",()=>{clearTimeout(pt);lp=false;});
    div.ontouchend=(e)=>{
      e.preventDefault();clearTimeout(pt);if(lp){lp=false;return;}
      if(spPlayerRole==="spectator")return;
      if(g.pendingDiscard&&g.pendingDiscard>0){spConfirm(card+" を捨てますか？").then(ok=>{if(ok)socket.emit("roomAction",{type:"discard_hand",card});});return;}
      if(spSelectTargetMode&&(spSelectTargetMode.type==="handUnit_steel_cost3"||spSelectTargetMode.type==="handUnit_cost2"||spSelectTargetMode.type==="handUnit_cost3"||spSelectTargetMode.type==="handUnit_steel")){const hi2=g.myHand.indexOf(card);socket.emit("roomAction",{type:"select_target",targetIndex:hi2,targetSide:"hand",handIndex:hi2});spSelectTargetMode=null;document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";return;}
      if(spSelectTargetMode&&spSelectTargetMode.type==="soulTrade"){spConfirm(card+" を捨てますか？").then(ok=>{if(ok){const hi2=g.myHand.indexOf(card);socket.emit("roomAction",{type:"select_target",targetSide:"soulTrade",handIndex:hi2,card:card});spSelectTargetMode=null;document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";}});return;}
      spConfirm(card+" を使用しますか？").then(ok=>{if(ok)socket.emit("roomAction",{type:"play_card",card});});
    };
    div.appendChild(img);hand.appendChild(div);
  });
}

// バックグラウンド復帰時の再接続
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(!socket.connected){
      socket.connect();
    }
  }
});

</script>
