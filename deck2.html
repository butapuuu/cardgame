body{
  display:flex;
}

/* 左 */
#left{
  width:70%;
}

/* 右（プレビュー） */
#right{
  width:30%;
  position:fixed;
  right:-2cm; /* ★右に2cmずらす */
  top:20px;
}

/* デッキ（2行固定） */
#deck{
  display:grid;
  grid-template-columns:repeat(10,80px);
  grid-template-rows:repeat(2,100px);
  gap:5px;
  border:2px solid black;
  padding:5px;
  min-height:210px;
}

/* カード一覧 */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  gap:8px;
  margin-top:10px;
}

.card{
  text-align:center;
  cursor:pointer;
}

.card img{
  width:80px;
}

/* プレビュー */
#preview img{
  width:300px;
}

/* フィルター */
.filter button{
  margin:2px;
}
</style>

let filter="all";

// ===== フィルター =====
function setFilter(f){
  filter=f;
  renderCards();
}

// ===== ひらがな変換 =====
function hira(str){
  return str.replace(/[ァ-ン]/g, s => String.fromCharCode(s.charCodeAt(0)-0x60));
}

// ===== カード一覧 =====
function renderCards(){
  const area=document.getElementById("cards");
  area.innerHTML="";

  const keyword=document.getElementById("search").value;

  cards.forEach(c=>{

    // 検索
    if(keyword){
      const k=hira(keyword);
      if(!hira(c).includes(k)) return;
    }

    // フィルター
    if(filter!=="all"){
      if(attrMap[c]!==filter) return;
    }

    const div=document.createElement("div");
    div.className="card";

    const img=document.createElement("img");
    img.src="images/"+c+".png";

    // ★プレビュー（一覧）
    img.onmouseenter=()=>{
      preview.innerHTML=`<img src="images/${c}.png">`;
    };
    img.onmouseleave=()=>{
      preview.innerHTML="";
    };

    div.onclick=()=>{

      if(deck.length>=20) return;

      const count = deck.filter(x=>x===c).length;

      if(count>=2){
        alert("同名カードは2枚まで");
        return;
      }

      deck.push(c);
      render();
    };

    const name=document.createElement("div");
    name.innerText=c;

    div.appendChild(img);
    div.appendChild(name);
    area.appendChild(div);
  });
}

// ===== デッキ描画 =====
function render(){
  document.getElementById("count").innerText=`枚数: ${deck.length}/20`;

  const area=document.getElementById("deck");
  area.innerHTML="";

  deck.forEach((c,i)=>{

    const div=document.createElement("div");
    div.className="card";

    const img=document.createElement("img");
    img.src="images/"+c+".png";

    // ★プレビュー（デッキ側も追加）
    img.onmouseenter=()=>{
      preview.innerHTML=`<img src="images/${c}.png">`;
    };
    img.onmouseleave=()=>{
      preview.innerHTML="";
    };

    img.onclick=()=>{
      deck.splice(i,1);
      render();
    };

    div.appendChild(img);
    area.appendChild(div);
  });
}

// ===== デッキクリア =====
function clearDeck(){
  if(!confirm("デッキをすべてクリアしますか？")) return;
  deck=[];
  render();
}

// ===== スロット一覧表示 =====
function refreshSlotList(){
  const all=JSON.parse(localStorage.getItem("decks_p2")||"[]");
  const el=document.getElementById("slotList");
  if(!el) return;
  const names=all.map((d,i)=>d?`[${i+1}]${d.name||"名称未設定"}`:"").filter(s=>s);
  el.innerText=names.length>0?"保存済み: "+names.join(" / "):"（保存済みなし）";
}

// ===== スロット読込 =====
function loadSlot(){
  const slot=parseInt(document.getElementById("deckSlotSelect").value,10);
  const all=JSON.parse(localStorage.getItem("decks_p2")||"[]");
  if(!all[slot]){ alert("このスロットにデッキがありません"); return; }
  const d=all[slot];
  document.getElementById("deckNameInput").value=d.name||"";
  deck=d.cards||[];
  render();
  alert(`スロット${slot+1}「${d.name||"名称未設定"}」を読み込みました`);
}

// ===== 保存 =====
function save(){
  if(deck.length!==20){
    alert("20枚必要");
    return;
  }
  let attrs=new Set();
  deck.forEach(c=>{
    if(attrMap[c] && attrMap[c]!=="neutral") attrs.add(attrMap[c]);
  });
  if(attrs.size>1){
    alert("属性は1種類のみ");
    return;
  }
  const slot=parseInt(document.getElementById("deckSlotSelect").value,10);
  const name=document.getElementById("deckNameInput").value||("デッキ"+(slot+1));
  const all=JSON.parse(localStorage.getItem("decks_p2")||"[]");
  while(all.length<=slot) all.push(null);
  all[slot]={name, cards:deck};
  localStorage.setItem("decks_p2", JSON.stringify(all));
  // 後方互換：従来キーにも保存（スロット問わず最後に保存したものをdeck1に）
  localStorage.setItem("deck2", JSON.stringify(deck));
  refreshSlotList();
  alert(`スロット${slot+1}「${name}」に保存しました`);
}

renderCards();
