<!DOCTYPE html>
<html lang="ja">
<head>
<script>
  if(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELEMON</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{ --gold:#c8a96e; --gold2:#ffe599; --dark:#080c08; --card-bg:rgba(10,25,10,0.85); }
html,body{ width:100%; height:100vh; overflow:hidden; background:var(--dark); color:#ddd; font-family:'Rajdhani',sans-serif; }
#bg{ position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse 120% 60% at 50% 0%, rgba(20,60,20,0.7) 0%, transparent 70%), radial-gradient(ellipse 80% 80% at 80% 100%, rgba(10,40,10,0.5) 0%, transparent 60%), #080c08; }
#bg::before{ content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(40,100,40,0.06) 60px), repeating-linear-gradient(60deg,transparent,transparent 59px,rgba(40,100,40,0.06) 60px), repeating-linear-gradient(120deg,transparent,transparent 59px,rgba(40,100,40,0.06) 60px); animation:gridShift 40s linear infinite; }
@keyframes gridShift{ 0%{transform:translate(0,0);} 100%{transform:translate(60px,60px);} }
.particle{ position:fixed; border-radius:50%; pointer-events:none; z-index:1; background:radial-gradient(circle,rgba(100,220,80,0.6),transparent 70%); animation:floatUp linear infinite; }
@keyframes floatUp{ 0%{transform:translateY(100vh) scale(0);opacity:0;} 10%{opacity:1;} 90%{opacity:0.3;} 100%{transform:translateY(-20vh) scale(1);opacity:0;} }

#wrap{
  position:relative; z-index:10; height:100vh;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  align-items:start;
  justify-items:center;
  padding:0 40px;
}

/* ヒーローを上寄り */
#hero{ text-align:center; padding:32px 0 0; width:100%; }
.hero-emblem{ width:90px; height:90px; margin:0 auto 12px; animation:emblemFloat 4s ease-in-out infinite; }
@keyframes emblemFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-10px) rotate(2deg);} }
.hero-emblem svg{ width:100%; height:100%; filter:drop-shadow(0 0 20px rgba(100,220,80,0.6)); }
.hero-subtitle{ font-size:11px; letter-spacing:8px; color:var(--gold); margin-bottom:8px; text-transform:uppercase; animation:fadeInDown 1s ease both; }
@keyframes fadeInDown{ from{opacity:0;transform:translateY(-16px);} to{opacity:1;transform:translateY(0);} }
.hero-title{ font-family:'Cinzel Decorative',serif; font-size:clamp(40px,5.5vw,72px); font-weight:900; letter-spacing:6px; line-height:1; background:linear-gradient(135deg,#4aff4a 0%,var(--gold2) 40%,#88ff44 70%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 32px rgba(80,220,80,0.4)); animation:fadeInDown 1s 0.2s ease both; margin-bottom:8px; }
.hero-tagline{ font-size:12px; letter-spacing:6px; color:rgba(200,220,180,0.55); animation:fadeInDown 1s 0.4s ease both; }

.divider{ width:100%; max-width:980px; height:1px; background:linear-gradient(90deg,transparent,rgba(60,140,60,0.4),rgba(200,180,80,0.3),rgba(60,140,60,0.4),transparent); margin:18px 0 0; }

/* グリッド：縦方向に自動伸縮 */
#navGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:16px;
  width:100%; max-width:980px;
  padding:18px 0 0;
  animation:fadeInUp 1s 0.5s ease both;
  /* 残り高さを埋める */
  align-self:stretch;
  max-height:calc(100vh - 280px);
}
@keyframes fadeInUp{ from{opacity:0;transform:translateY(28px);} to{opacity:1;transform:translateY(0);} }

.nav-card{
  position:relative; background:var(--card-bg);
  border:1px solid rgba(60,140,60,0.3); border-radius:16px;
  padding:0; cursor:pointer; text-decoration:none; color:#ddd;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:10px; overflow:hidden;
  transition:transform 0.3s ease,border-color 0.3s ease,box-shadow 0.3s ease;
  backdrop-filter:blur(10px);
  min-height:0;
}
.nav-card::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%,rgba(60,160,60,0.12) 0%,transparent 70%); opacity:0; transition:opacity 0.3s; }
.nav-card::after{ content:""; position:absolute; top:0; left:-100%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent); transition:left 0.5s ease; }
.nav-card:hover{ transform:translateY(-6px) scale(1.02); border-color:rgba(80,200,80,0.6); box-shadow:0 20px 55px rgba(0,0,0,0.5),0 0 32px rgba(60,180,60,0.2); }
.nav-card:hover::before{ opacity:1; }
.nav-card:hover::after{ left:140%; }

.nav-card.room{ border-color:rgba(80,180,255,0.35); }
.nav-card.room:hover{ border-color:rgba(80,180,255,0.7); box-shadow:0 20px 55px rgba(0,0,0,0.5),0 0 32px rgba(60,140,220,0.25); }
.nav-card.room::before{ background:radial-gradient(circle at 50% 0%,rgba(60,140,220,0.14) 0%,transparent 70%); }
.nav-card.deck{ border-color:rgba(200,180,80,0.35); }
.nav-card.deck:hover{ border-color:rgba(200,180,80,0.7); box-shadow:0 20px 55px rgba(0,0,0,0.5),0 0 32px rgba(180,150,60,0.25); }
.nav-card.deck::before{ background:radial-gradient(circle at 50% 0%,rgba(180,150,60,0.14) 0%,transparent 70%); }
.nav-card.coming{ cursor:default; opacity:0.48; filter:grayscale(0.3); }
.nav-card.coming:hover{ transform:none; border-color:rgba(60,140,60,0.3); box-shadow:none; }

.card-icon{ width:52px; height:52px; flex-shrink:0; }
.nav-card.room .card-icon svg{ filter:drop-shadow(0 0 10px rgba(80,180,255,0.7)); }
.nav-card.deck .card-icon svg{ filter:drop-shadow(0 0 10px rgba(200,180,80,0.7)); }
.card-title{ font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; letter-spacing:3px; text-transform:uppercase; line-height:1; }
.nav-card.room .card-title{ color:#88ccff; }
.nav-card.deck .card-title{ color:var(--gold2); }
.nav-card:not(.room):not(.deck) .card-title{ color:#88dd88; }
.coming-badge{ position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); border:1px solid rgba(120,120,120,0.4); border-radius:4px; padding:2px 7px; font-size:8px; letter-spacing:2px; color:#777; text-transform:uppercase; }

#footer{ padding:12px 0 14px; text-align:center; font-size:10px; letter-spacing:2px; color:rgba(100,140,100,0.35); width:100%; }
</style>
</head>
<body>

</div>
<script>
function createParticles(){
  for(let i=0;i<16;i++){
    const p=document.createElement("div");p.className="particle";
    const size=Math.random()*4+2;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}vw;animation-duration:${Math.random()*20+15}s;animation-delay:${Math.random()*20}s;opacity:${Math.random()*0.4+0.1};`;
    document.body.appendChild(p);
  }
}
createParticles();
</script>
