<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta charset="utf-8">
<title>Elemon vs CPU SP</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

:root{
  --field-bg:rgba(0,80,0,0.35);
  --field-border:#2d6a2d;
  --enemy-field-bg:rgba(80,0,0,0.25);
  --enemy-field-border:#6a2d2d;
}

html,body{
  width:100%; height:100%;
  overflow:hidden;
  background:#1a2a1a;
  color:#eee;
  font-family:sans-serif;
  transition:background 0.8s;
}
/* ★画像の長押し保存ダイアログを防ぐ */
img{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  pointer-events:auto;
}

/* ===== メインレイアウト：縦方向に全画面 ===== */
#gameRoot{
  display:flex;
  flex-direction:column;
  width:100vw;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ===== ヘッダー ===== */
#spHeader{
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid #333;
  padding:2px 6px;
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
  flex-shrink:0;
}
#spHeader button{
  background:linear-gradient(135deg,#1a2a1a,#2a3a2a);
  color:#aaddaa;
  border:1px solid #3a6a3a;
  border-radius:4px;
  padding:3px 7px;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}
#spHeader select{
  background:#0e1a0e;
  color:#aaddaa;
  border:1px solid #3a6a3a;
  border-radius:4px;
  padding:2px 4px;
  font-size:10px;
  max-width:88px;
}
#spTurnLabel{ font-size:10px;font-weight:bold;color:#ffe066;margin-left:auto; }
#spWinner{ font-size:10px;font-weight:bold;color:#ff6666; }

/* ===== プレイマット ===== */
#spMat{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:2px 3px;
  gap:3px;
  min-height:0;
}

/* ===== 情報バー共通 ===== */
.sp-info-bar{
  display:flex;
  align-items:center;
  gap:4px;
  padding:1px 4px;
  background:rgba(0,0,0,0.4);
  border-radius:5px;
  flex-shrink:0;
}
.sp-life-badge{
  display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 40% 35%,#5a1a1a,#1a0808);
  border:2px solid #cc4444;border-radius:50%;
  width:clamp(36px,10vw,48px);height:clamp(36px,10vw,48px);
  justify-content:center;
  box-shadow:0 0 8px rgba(200,50,50,0.4);flex-shrink:0;
}
.sp-life-badge .lv{ font-size:clamp(13px,4.5vw,17px);font-weight:bold;color:#ffaaaa;line-height:1; }
.sp-life-badge .ll{ font-size:6px;color:#cc6666;letter-spacing:1px; }
.sp-energy-badge{
  background:linear-gradient(135deg,#0a1a2a,#0d2a3a);
  border:1px solid #2266aa;border-radius:5px;
  padding:2px 8px;text-align:center;
  box-shadow:0 0 6px rgba(40,120,200,0.3);
}
.sp-energy-badge .el{ font-size:7px;color:#4488cc;letter-spacing:1px; }
.sp-energy-badge .ev{ font-size:12px;font-weight:bold;color:#88ccff; }

/* デッキ・捨て場 */
.sp-deck-grave{ display:flex;gap:4px;align-items:center; }
.sp-deck-pile{ position:relative;width:clamp(28px,9vw,38px); }
.sp-deck-pile img{ width:100%;border-radius:3px;box-shadow:1px 1px 0 #222,2px 2px 0 #111,0 3px 6px rgba(0,0,0,0.7); }
.sp-deck-pile .sp-deck-count{ position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:9px;font-weight:bold;text-shadow:0 0 4px #000;pointer-events:none;z-index:10; }
.sp-grave-pile{ position:relative;width:clamp(28px,9vw,38px);cursor:pointer; }
.sp-grave-pile img{ width:100%;border-radius:3px;box-shadow:0 1px 4px #000; }
.sp-grave-pile .sp-grave-empty{ width:100%;height:calc(clamp(28px,9vw,38px) * 1.44);border:1px solid rgba(180,140,80,0.4);border-radius:3px;display:flex;align-items:center;justify-content:center;color:rgba(180,140,80,0.4);font-size:5px;letter-spacing:1px;font-weight:bold; }
.sp-grave-pile .sp-grave-count{ position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:9px;font-weight:bold;text-shadow:0 0 4px #000;pointer-events:none;z-index:10; }

/* ===== 相手手札 ===== */
#spEnemyHand{ display:flex;gap:2px;justify-content:center;flex-shrink:0;padding:0;min-height:clamp(20px,7vw,28px);align-items:center; }
#spEnemyHand img{ width:clamp(14px,5vw,20px);border-radius:2px;box-shadow:0 1px 3px #000; }

/* ===== フィールド共通 ===== */
.sp-field{
  flex:0 0 13vh;
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px 66px;
  min-height:0;
  position:relative;
  transition:background 0.8s,border-color 0.8s;
  overflow:visible;
}
.sp-field.enemy-field{ background:var(--enemy-field-bg);border-color:var(--enemy-field-border); }
.sp-unit-slots{ display:flex;gap:4px;align-items:center;flex:0 0 auto; }
.sp-unit-slot-empty{
  width:8vh;height:10vh;
  border:1px solid rgba(255,255,255,0.15);border-radius:4px;
  background:rgba(255,255,255,0.02);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sp-unit-slot-empty::before{ content:"UNIT";font-size:6px;color:rgba(255,255,255,0.15);letter-spacing:2px;font-weight:bold;pointer-events:none; }
/* FSスロット */
.sp-fs-slot{
  position:absolute;top:50%;transform:translateY(-50%);
  width:8vh;height:10vh;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,215,0,0.4);border-radius:4px;background:rgba(255,215,0,0.03);
}
.sp-fs-slot::before{ content:"FIELD";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:6px;color:rgba(255,215,0,0.25);letter-spacing:2px;pointer-events:none;font-weight:bold; }
.sp-fs-slot:not(:empty)::before{ display:none; }
#spMyField>.sp-fs-slot{ left:4px; }
#spEnemyField>.sp-fs-slot{ right:4px; }

/* ===== カード：statは全て下に統一 ===== */
.sp-card{ display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;flex-shrink:0;transition:transform 0.15s; }
.sp-card:active{ transform:scale(0.95); }
.sp-card img{ width:8vh;border-radius:3px;box-shadow:0 2px 4px #000; }
.sp-card .sp-stat{
  font-size:7px;color:#ffe066;
  margin-top:2px;
  background:rgba(0,0,0,0.85);
  border-radius:2px;padding:1px 3px;
  white-space:nowrap;
  z-index:5;
}
.sp-card.selected img{ outline:2px solid #ff4444;border-radius:3px; }

.sp-status-badges{ position:absolute; top:1px; right:1px; display:flex; flex-direction:column; gap:1px; z-index:20; pointer-events:none; }
.sp-status-badge{ width:14px; height:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:bold; box-shadow:0 0 4px rgba(0,0,0,0.8); border:1px solid rgba(255,255,255,0.85); position:relative; }
.sp-status-badge.brainwash{ background:radial-gradient(circle at 35% 30%,#c77dff,#7b2cbf); color:#fff; }
.sp-status-badge.restrain{ background:radial-gradient(circle at 35% 30%,#5eff7d,#1a9a3a); color:#fff; }
.sp-status-badge.crystal{ background:radial-gradient(circle at 35% 30%,#7de4ff,#1a9aca); color:#fff; }
.sp-status-badge.denko{ background:radial-gradient(circle at 35% 30%,#fff27d,#e0a800); color:#7a5a00; }
.sp-status-badge.denko .sp-denko-count{ position:absolute; bottom:-2px; right:-2px; background:#222; color:#ffe066; font-size:6px; font-weight:bold; width:8px; height:8px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid #ffe066; }

/* ===== 直接攻撃ゾーン ===== */
#spDirectZone{
  background:linear-gradient(135deg,rgba(80,0,0,0.25),rgba(120,0,0,0.15));
  border:1px solid rgba(180,60,60,0.4);border-radius:4px;
  height:18px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(220,100,100,0.7);font-size:8px;font-weight:bold;letter-spacing:2px;
  cursor:pointer;flex-shrink:0;transition:all 0.2s;
}
#spDirectZone.active{ background:linear-gradient(135deg,rgba(160,20,20,0.4),rgba(100,0,0,0.3));border-color:rgba(255,80,80,0.7);color:rgba(255,150,150,0.95); }

/* ===== 自分情報バー ===== */
#spMyInfoBar{ display:flex;align-items:center;gap:4px;padding:1px 4px;background:rgba(0,0,0,0.4);border-radius:5px;flex-shrink:0; }

/* ===== 手札エリア ===== */
#spHandArea{
  flex:1;
  min-height:14vh;
  max-height:20vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
  position:relative;
  overflow:hidden;
}

/* ===== ボタンエリア：必ず最下部 ===== */
#spBtnArea{ display:flex;gap:4px;padding:4px 5px 10px;flex-shrink:0; }
#spEndTurnBtn{
  flex:1;background:linear-gradient(135deg,#0d2a0d,#1a4a1a);color:#88ff88;
  border:1px solid #2a8a2a;border-radius:6px;padding:10px 4px;
  font-size:12px;font-weight:bold;letter-spacing:1px;cursor:pointer;
  box-shadow:0 0 6px rgba(40,180,40,0.3);
}
#spSurrenderBtn{
  flex:1;background:linear-gradient(135deg,#2a0808,#4a1212);color:#ff8888;
  border:1px solid #8a2222;border-radius:6px;padding:10px 4px;
  font-size:12px;font-weight:bold;letter-spacing:1px;cursor:pointer;
}

/* ===== モーダル共通 ===== */
.sp-modal{
  display:none;
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  z-index:1000;
  justify-content:center;align-items:center;
}
.sp-modal.open{ display:flex; }
.sp-modal-inner{
  background:#1e1e2e;
  border:1px solid #555;
  border-radius:10px;
  padding:16px;
  width:90%;max-width:400px;
  max-height:80vh;
  overflow-y:auto;
}
.sp-modal-inner h3{ color:#ffe066;margin-bottom:10px;font-size:14px; }
.sp-modal-close{
  margin-top:10px;
  background:#444;color:#eee;
  border:1px solid #666;border-radius:6px;
  padding:6px 18px;cursor:pointer;font-size:12px;
  width:100%;
}

/* ===== カードプレビューモーダル ===== */
#spPreviewModal{
  z-index:1500;
}
#spPreviewModal .sp-modal-inner{
  background:transparent;border:none;
  display:flex;align-items:center;justify-content:center;
}
#spPreviewModal img{ width:220px;border-radius:10px;box-shadow:0 0 20px #000; }

/* ===== ターン交代 ===== */
#spTurnChangeOverlay{
  position:fixed;top:0;left:-100%;
  width:100%;height:100%;
  z-index:3000;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
#spTurnChangeOverlay img{
  width:85%;max-width:340px;
  filter:drop-shadow(0 0 20px rgba(255,200,50,0.8));
}
.sp-turn-change-anim{
  animation:spTurnChangeSlide 1.4s cubic-bezier(0.22,1,0.36,1) forwards !important;
}
@keyframes spTurnChangeSlide{
  0%{left:-100%;opacity:0;}
  15%{left:0%;opacity:1;}
  75%{left:0%;opacity:1;}
  100%{left:100%;opacity:0;}
}

/* ===== ドローアニメーション ===== */
#spDrawCardAnim{
  position:fixed;pointer-events:none;z-index:2500;
  display:none;border-radius:7px;
  box-shadow:0 0 16px rgba(255,220,100,0.8);width:52px;
}
#spDrawCardAnimFront{
  position:fixed;pointer-events:none;z-index:2500;
  display:none;border-radius:7px;
  box-shadow:0 0 24px rgba(255,220,100,0.9);width:180px;
}

/* ===== ダメージポップ ===== */
@keyframes spDamagePopAnim{
  0%{transform:translate(-50%,-150%) scale(0.5);opacity:0;}
  15%{transform:translate(-50%,-180%) scale(1.3);opacity:1;}
  40%{transform:translate(-50%,-200%) scale(1.0);opacity:1;}
  100%{transform:translate(-50%,-280%) scale(0.8);opacity:0;}
}
.sp-damage-pop{
  position:fixed;pointer-events:none;z-index:1800;
  font-family:Georgia,serif;font-weight:bold;
  text-shadow:0 0 8px rgba(0,0,0,0.9);
  animation:spDamagePopAnim 1.2s ease-out forwards;
  white-space:nowrap;
}
.sp-damage-pop.dmg-unit{font-size:22px;color:#ff4444;}
.sp-damage-pop.dmg-life{font-size:28px;color:#ff2222;text-shadow:0 0 10px rgba(255,0,0,0.8);}
.sp-damage-pop.dmg-enemy{color:#ffaa00;}

/* ===== エフェクトポップ ===== */
@keyframes spPopIn{
  0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}
  60%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
}

/* ===== 画面シェイク ===== */
@keyframes spScreenShake{
  0%{transform:translate(0,0);}
  15%{transform:translate(-5px,-3px);}
  30%{transform:translate(5px,3px);}
  45%{transform:translate(-4px,2px);}
  60%{transform:translate(4px,-2px);}
  75%{transform:translate(-2px,1px);}
  100%{transform:translate(0,0);}
}
.sp-shaking{animation:spScreenShake 0.4s ease-in-out;}

/* ===== 勝敗オーバーレイ ===== */
#spResultOverlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.75);z-index:2000;
  justify-content:center;align-items:center;cursor:pointer;
}
#spResultOverlay img{max-width:80%;max-height:60%;}

/* ===== セレクトターゲット通知 ===== */
#spTargetNotice{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);color:#ffe066;
  padding:12px 20px;border-radius:8px;font-size:13px;
  z-index:500;border:2px solid #ffe066;text-align:center;
  pointer-events:none;display:none;
  max-width:90vw;
}
</style>
</head>
<body>

<!-- ドローアニメーション -->
<img id="spDrawCardAnim" src="images/card_back.png">
<img id="spDrawCardAnimFront" src="images/card_back.png">

<!-- ターン交代 -->
<div id="spTurnChangeOverlay">
  <img src="images/TURN CHANGE.png" alt="TURN CHANGE">
</div>

<!-- 勝敗オーバーレイ -->
<div id="spResultOverlay" onclick="spCloseResult()">
  <img id="spResultImg" src="">
</div>

<!-- セレクトターゲット通知 -->
<div id="spTargetNotice"></div>

<!-- カードプレビューモーダル -->
<div class="sp-modal" id="spPreviewModal" onclick="this.classList.remove('open')">
  <div class="sp-modal-inner">
    <img id="spPreviewImg" src="">
  </div>
</div>

<!-- 捨て場モーダル -->
<div class="sp-modal" id="spGraveModal">
  <div class="sp-modal-inner">
    <h3 id="spGraveModalTitle">🪦 捨て場</h3>
    <div id="spGraveModalCards" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    <button class="sp-modal-close" onclick="document.getElementById('spGraveModal').classList.remove('open')">閉じる</button>
  </div>
</div>

<!-- ログモーダル -->
<div class="sp-modal" id="spLogModal">
  <div class="sp-modal-inner">
    <h3>📜 ゲームログ</h3>
    <div id="spLogModalContent" style="font-size:12px;color:#ccc;line-height:1.7;"></div>
    <button class="sp-modal-close" onclick="document.getElementById('spLogModal').classList.remove('open')">閉じる</button>
  </div>
</div>

<!-- カスタム確認モーダル -->
<div id="spConfirmModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9000;justify-content:center;align-items:center;">
  <div style="background:#1e2e1e;border:2px solid #3a6a3a;border-radius:12px;padding:20px;width:85%;max-width:340px;text-align:center;">
    <div id="spConfirmMsg" style="color:#eee;font-size:14px;line-height:1.7;margin-bottom:16px;white-space:pre-wrap;"></div>
    <div style="display:flex;gap:10px;">
      <button id="spConfirmOK" style="flex:1;background:linear-gradient(135deg,#0d2a0d,#1a4a1a);color:#88ff88;border:1px solid #2a8a2a;border-radius:6px;padding:10px;font-size:13px;font-weight:bold;cursor:pointer;">OK</button>
      <button id="spConfirmCancel" style="flex:1;background:linear-gradient(135deg,#2a0808,#4a1212);color:#ff8888;border:1px solid #8a2222;border-radius:6px;padding:10px;font-size:13px;font-weight:bold;cursor:pointer;">キャンセル</button>
    </div>
  </div>
</div>

<!-- カスタム入力モーダル -->
<div id="spPromptModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9000;justify-content:center;align-items:center;">
  <div style="background:#1e2e1e;border:2px solid #3a6a3a;border-radius:12px;padding:20px;width:85%;max-width:340px;text-align:center;">
    <div id="spPromptMsg" style="color:#eee;font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;"></div>
    <input id="spPromptInput" type="text" style="width:100%;background:#0e1a0e;color:#eee;border:1px solid #3a6a3a;border-radius:6px;padding:8px;font-size:16px;text-align:center;margin-bottom:12px;">
    <div style="display:flex;gap:10px;">
      <button id="spPromptOK" style="flex:1;background:linear-gradient(135deg,#0d2a0d,#1a4a1a);color:#88ff88;border:1px solid #2a8a2a;border-radius:6px;padding:10px;font-size:13px;font-weight:bold;cursor:pointer;">OK</button>
      <button id="spPromptCancel" style="flex:1;background:linear-gradient(135deg,#2a0808,#4a1212);color:#ff8888;border:1px solid #8a2222;border-radius:6px;padding:10px;font-size:13px;font-weight:bold;cursor:pointer;">キャンセル</button>
    </div>
  </div>
</div>

<!-- 全体レイアウト -->
<div id="gameRoot">

  <!-- ヘッダー -->
  <div id="spHeader">
    <!-- 1段目：参加・デッキ選択・START -->
    <div style="display:flex;align-items:center;gap:4px;width:100%;flex-wrap:nowrap;">
      <button onclick="spSelectPlayer(1)" style="flex-shrink:0;">自分</button>
      <select id="spDeckSelectP1" style="flex:1;min-width:0;"><option value="-1">デッキ</option></select>
      <button onclick="spSelectPlayer(2)" style="flex-shrink:0;">CPU</button>
      <select id="spDeckSelectP2" style="flex:1;min-width:0;"><option value="-1">デッキ</option></select>
      <button onclick="cpuStartGame()" style="background:linear-gradient(135deg,#2a1a00,#4a3000);color:#ffcc66;border-color:#aa6600;flex-shrink:0;">▶START</button>
    </div>
    <!-- 2段目：DECKボタン＋ターン表示 -->
    <div style="display:flex;align-items:center;gap:4px;width:100%;">
      <button onclick="window.open('deck1_sp.html','_blank')" style="background:linear-gradient(135deg,#0a1a2a,#1a2a3a);color:#88aacc;border-color:#2a4a6a;">デッキ構築</button>
      <a href="top_sp.html" style="background:linear-gradient(135deg,#0a1a0a,#1a2a1a);color:rgba(180,220,100,0.8);border:1px solid rgba(60,140,60,0.4);border-radius:4px;padding:4px 8px;font-size:11px;font-weight:bold;text-decoration:none;">◈TOP</a>
      <button id="spBgmBtn" onclick="spToggleBGM()" style="background:linear-gradient(135deg,#0a1a2a,#1a2a3a);color:#88aacc;border:1px solid #2a4a6a;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:bold;cursor:pointer;">🎵</button>
      <button id="spSeBtn" onclick="spToggleSE()" style="background:linear-gradient(135deg,#0a1a2a,#1a2a3a);color:#88aacc;border:1px solid #2a4a6a;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:bold;cursor:pointer;">🔊</button>
      <span id="spTurnLabel" style="margin-left:auto;"></span>
      <span id="spWinner"></span>
    </div>
  </div>

  <!-- プレイマット -->
  <div id="spMat">

    <!-- 相手情報バー：左=デッキ・捨て場、右=ライフ・エネルギー・LOG -->
    <div class="sp-info-bar" id="spEnemyInfoBar">
      <div class="sp-deck-grave">
        <!-- 相手捨て場（左） -->
        <div class="sp-grave-pile" onclick="spShowGrave('enemy')" id="spEnemyGravePile">
          <div class="sp-grave-empty" id="spEnemyGraveEmpty">GRV</div>
        </div>
        <!-- 相手デッキ -->

function spConfirm(msg){

    document.getElementById("spConfirmMsg").innerText=msg;
    modal.style.display="flex";
    const ok=document.getElementById("spConfirmOK"),cancel=document.getElementById("spConfirmCancel");
    function cleanup(r){modal.style.display="none";ok.onclick=null;cancel.onclick=null;resolve(r);}
    ok.onclick=()=>cleanup(true);cancel.onclick=()=>cleanup(false);
  });
}
function spPrompt(msg){
  return new Promise(resolve=>{
    const modal=document.getElementById("spPromptModal");
    document.getElementById("spPromptMsg").innerText=msg;
    const input=document.getElementById("spPromptInput");input.value="";
    modal.style.display="flex";setTimeout(()=>input.focus(),100);

    function cleanup(r){modal.style.display="none";ok.onclick=null;cancel.onclick=null;resolve(r);}

}

// BGMはAudioContextで実装（途切れ防止）
let _bgmCtx=null, _bgmGain=null, _bgmBuf=null, _bgmSrc=null, _bgmPlaying=false;
let _spBgmEnabled=true,_spSeEnabled=true;

async function spStartBGM(){
  if(_bgmPlaying||!_spBgmEnabled) return;
  try{
    // ★Contextの生成とresumeは「await前」に同期実行（クリック文脈を保つ）
    if(!_bgmCtx){
      _bgmCtx=new(window.AudioContext||window.webkitAudioContext)();
      _bgmGain=_bgmCtx.createGain();
      _bgmGain.gain.value=0.12;
      _bgmGain.connect(_bgmCtx.destination);
    }
    // クリック文脈が生きているうちにresumeを発火（awaitしない＝文脈を消費しない）
    if(_bgmCtx.state==="suspended") _bgmCtx.resume();
    // BGMバッファが未ロードなら取得（ここで初めてawait）
    if(!_bgmBuf){
      const res=await fetch("sounds/BGM.mp3");
      const ab=await res.arrayBuffer();
      _bgmBuf=await _bgmCtx.decodeAudioData(ab);
    }
    // ロード完了後、念のため再度resume（awaitで確実に）
    if(_bgmCtx.state==="suspended") await _bgmCtx.resume();
    _bgmSrc=_bgmCtx.createBufferSource();
    _bgmSrc.buffer=_bgmBuf;
    _bgmSrc.loop=true;
    _bgmSrc.connect(_bgmGain);
    _bgmSrc.start(0);
    _bgmPlaying=true;
  }catch(e){
    // フォールバック：Audio要素
    try{
      window._bgmFallback=window._bgmFallback||new Audio("sounds/BGM.mp3");
      window._bgmFallback.volume=0.12;
      window._bgmFallback.loop=true;
      window._bgmFallback.play().catch(()=>{});
      _bgmPlaying=true;
    }catch(e2){}
  }
}

function spStopBGM(){
  if(_bgmSrc){try{_bgmSrc.stop();}catch(e){} _bgmSrc=null;}
  if(window._bgmFallback){_bgmFallback.pause();_bgmFallback.currentTime=0;}
  _bgmPlaying=false;
}

function spToggleSE(){_spSeEnabled=!_spSeEnabled;const btn=document.getElementById("spSeBtn");if(_spSeEnabled){btn.style.color="#88aacc";btn.style.opacity="1";btn.innerText="🔊";}else{btn.style.color="#666";btn.style.opacity="0.5";btn.innerText="🔇";}}

  }
});
// touchstart/click どちらでも復帰（iOS対策）
function _tryResumeBGM(){
  if(!_bgmCtx||!_bgmPlaying)return;
  if(_bgmCtx.state==="suspended"){
    _bgmCtx.resume().then(()=>{
      if(_bgmBuf&&_bgmPlaying){
        // ノードが止まっていたら再接続して再生
        try{ if(_bgmSrc)_bgmSrc.stop(); }catch(e){}
        _bgmSrc=_bgmCtx.createBufferSource();
        _bgmSrc.buffer=_bgmBuf;
        _bgmSrc.loop=true;
        _bgmSrc.connect(_bgmGain);
        _bgmSrc.start(0);
      }
    }).catch(()=>{});
  }
}

function spDetectDeckAttr(deck){
  if(!deck||deck.length===0)return"neutral";
  const counts={};
  deck.forEach(name=>{const a=_spClientAttrMap[name];if(a)counts[a]=(counts[a]||0)+1;});
  let maxA="neutral",maxN=0;
  Object.entries(counts).forEach(([a,n])=>{if(n>maxN){maxN=n;maxA=a;}});
  return maxA;
}

    all.forEach((d,i)=>{
      if(!d)return;
      const opt=document.createElement("option");
      opt.value=i; opt.innerText="["+(i+1)+"]"+(d.name||"");
      sel.appendChild(opt);
    });
  });
}

  const slotIdx=parseInt(sel.value,10);
  let deck;
  if(slotIdx>=0){
    const all=JSON.parse(localStorage.getItem("decks_p1")||"[]");
    deck=(all[slotIdx]&&all[slotIdx].cards)||[];
  }else{
    deck=JSON.parse(localStorage.getItem("deck"+num)||"[]");
  }
  if(!deck||deck.length===0){alert("デッキを選択してください");return;}
  if(num===1){ _cpuPlayerDeck=deck; spApplyAttrColor(spDetectDeckAttr(deck)); }
  else { _cpuCpuDeck=deck; }

}

  spStopBGM();

  if(c.disabled&&c.disabledCount!==undefined){const b=document.createElement("div");b.className="sp-status-badge restrain";b.innerText="⛓";wrap.appendChild(b);has=true;}
  else if(c.disabled){const b=document.createElement("div");b.className="sp-status-badge brainwash";b.innerText="✦";wrap.appendChild(b);has=true;}
  if(c.barrier){const b=document.createElement("div");b.className="sp-status-badge crystal";b.innerText="◆";wrap.appendChild(b);has=true;}
  let dk=0;if(c.denko&&!c.attacked)dk=2;else if(c.denko&&c.attacked&&!c.denkoAttackedThisTurn)dk=1;
  if(dk>0){const b=document.createElement("div");b.className="sp-status-badge denko";b.innerHTML="⚡<span class='sp-denko-count'>"+dk+"</span>";wrap.appendChild(b);has=true;}
  if(has)div.appendChild(wrap);
}

// ===== 攻撃アニメーション（PC版と同等） =====
function spPlayAttackAnim(attackerIdx, targetIdx, isDirect){
  const myContainer=document.getElementById("spMyUnits");
  if(!myContainer)return;
  const myCards=myContainer.querySelectorAll(".sp-card");
  const myBoardLen=spLatestState?.myBoard?.length||0;
  const displayAtkIdx=myBoardLen>0 ? myBoardLen-1-attackerIdx : attackerIdx;
  const card=myCards[displayAtkIdx];
  if(!card)return;

  let dx=0, dy=-100;
  if(isDirect){
    dx=0; dy=-180;
  } else if(targetIdx!==null && targetIdx!==undefined){
    const atkRect=card.getBoundingClientRect();
    const enContainer=document.getElementById("spEnemyUnits");
    if(enContainer){
      const enCards=enContainer.querySelectorAll(".sp-card");
      const tgtCard=enCards[targetIdx];
      if(tgtCard){
        const tgtRect=tgtCard.getBoundingClientRect();
        dx=((tgtRect.left+tgtRect.width/2)-(atkRect.left+atkRect.width/2))*0.7;
        dy=((tgtRect.top+tgtRect.height/2)-(atkRect.top+atkRect.height/2))*0.7;
      }
    }
  }

  card.style.transition="none";
  card.style.transform="translate(0,0)";
  void card.offsetWidth;
  card.style.transition="transform 0.18s ease-out";
  card.style.transform=`translate(${dx}px,${dy}px)`;
  setTimeout(()=>{
    card.style.transition="transform 0.16s ease-in";
    card.style.transform="translate(0,0)";
    setTimeout(()=>{ card.style.transition=""; card.style.transform=""; },180);
  },200);
}

// ===== 捨て場 =====
function spShowGrave(side){
  const data=side==="my"?spMyGraveData:spEnemyGraveData;
  const title=side==="my"?"🪦 自分の捨て場":"🪦 相手の捨て場";
  document.getElementById("spGraveModalTitle").innerText=title;
  const container=document.getElementById("spGraveModalCards");
  container.innerHTML="";
  if(!data||data.length===0){container.innerHTML="<div style='color:#888;font-size:12px'>まだカードがありません</div>";return;}
  data.forEach(c=>{
    const img=document.createElement("img");
    img.src="images/"+c.name+".png";
    img.style.cssText="width:56px;border-radius:4px;box-shadow:0 2px 5px #000;";
    // 長押しのみプレビュー（タップでは何もしない）
    let pressTimer=null;
    let _lp=false;
    img.addEventListener("touchstart",()=>{_lp=false;pressTimer=setTimeout(()=>{
      _lp=true;
      document.getElementById("spPreviewImg").src="images/"+c.name+".png";
      document.getElementById("spPreviewModal").classList.add("open");
    },400);},{passive:true});
    img.addEventListener("touchend",()=>clearTimeout(pressTimer));
    img.addEventListener("touchmove",()=>{clearTimeout(pressTimer);_lp=false;});
    container.appendChild(img);
  });
  document.getElementById("spGraveModal").classList.add("open");
}

// ===== 捨て場パイル描画 =====
function spRenderGravePile(pileId,emptyId,graveData){
  const pile=document.getElementById(pileId); if(!pile)return;
  [...pile.querySelectorAll("img.sp-grave-top")].forEach(el=>el.remove());
  [...pile.querySelectorAll(".sp-grave-count")].forEach(el=>el.remove());
  const emptyDiv=document.getElementById(emptyId);

  if(emptyDiv)emptyDiv.style.display="none";
  const top=graveData[graveData.length-1];
  const img=document.createElement("img");

  img.className="sp-grave-top";
  img.style.cssText="width:32px;border-radius:3px;box-shadow:0 1px 4px #000;display:block;";

// ===== フィールドスペル描画 =====
function spRenderFieldSpell(elementId,fsData){
  const el=document.getElementById(elementId); if(!el)return;
  if(!fsData||!fsData.name){setTimeout(()=>{const e=document.getElementById(elementId);if(e)e.innerHTML="";},400);return;}
  el.innerHTML="";
  const div=document.createElement("div"); div.className="sp-card";
  const img=document.createElement("img");
  img.src="images/"+fsData.name+".png";
  img.style.cssText="width:52px;border-radius:4px;box-shadow:0 2px 5px #000;";
  img.onerror=()=>{img.style.display="none";};
  img.onclick=null;
  const dur=document.createElement("div"); dur.className="sp-stat";
  dur.textContent="耐久:"+fsData.durability;
  div.appendChild(img); div.appendChild(dur);
  // 相手フィールドスペルへの攻撃
  if(elementId==="spEnemyFieldSpell"){
    div.onclick=()=>{
      if(spSelectedUnitIndex===null){
        document.getElementById("spPreviewImg").src="images/"+fsData.name+".png";
        document.getElementById("spPreviewModal").classList.add("open");
        return;
      }
      const atkIdx=spSelectedUnitIndex;
      const atkName=spLatestState?.myBoard?.[atkIdx]?.name||"ユニット";
      spConfirm("「"+atkName+"」で「"+fsData.name+"」に攻撃しますか？").then(ok=>{
      if(!ok)return;
      // FSへの攻撃アニメーション
      const myContainer=document.getElementById("spMyUnits");
      const myCards=myContainer?myContainer.querySelectorAll(".sp-card"):[];
      const myBoardLen=spLatestState?.myBoard?.length||0;
      const displayAtkIdx=myBoardLen>0?myBoardLen-1-atkIdx:atkIdx;
      const atkCardEl=myCards[displayAtkIdx];
      const fsDiv=document.getElementById("spEnemyFieldSpell")?.querySelector(".sp-card");
      if(atkCardEl&&fsDiv){
        const ar=atkCardEl.getBoundingClientRect(), tr=fsDiv.getBoundingClientRect();
        const dx=((tr.left+tr.width/2)-(ar.left+ar.width/2))*0.7;
        const dy=((tr.top+tr.height/2)-(ar.top+ar.height/2))*0.7;
        atkCardEl.style.transition="none"; atkCardEl.style.transform="translate(0,0)";
        void atkCardEl.offsetWidth;
        atkCardEl.style.transition="transform 0.18s ease-out";
        atkCardEl.style.transform=`translate(${dx}px,${dy}px)`;
        setTimeout(()=>{
          atkCardEl.style.transition="transform 0.16s ease-in";
          atkCardEl.style.transform="translate(0,0)";
          setTimeout(()=>{atkCardEl.style.transition="";atkCardEl.style.transform="";},180);
        },200);
      }
      spClearSelection();
      spPlaySE(SP_SE.atk[spGetClientAttr(atkName)]||SP_SE.atk.neutral);
      setTimeout(()=>socket.emit("cpuAction",{type:"attack",a:atkIdx,target:"fieldSpell"}),200);
      });
    };
  }
  el.appendChild(div);
}

// ===== ドローアニメーション =====
let _spDrawQueue=[],_spDrawPlaying=false;
function spPlayDrawAnim(cardName){
  return new Promise(resolve=>{
    _spDrawQueue.push({cardName,resolve,onPhase1Done:null});
    if(!_spDrawPlaying)_spStartDrawWhenReady();
  });
}
function spPlayDrawAnimWithCallback(cardName,onPhase1Done){
  return new Promise(resolve=>{
    _spDrawQueue.push({cardName,resolve,onPhase1Done});
    if(!_spDrawPlaying)_spStartDrawWhenReady();
  });
}
function _spStartDrawWhenReady(){
  const wait=Math.max(0,_spTurnChangeFinishTime-Date.now());
  if(wait>0)setTimeout(()=>_spProcessDrawQueue(),wait);
  else _spProcessDrawQueue();
}
function _spProcessDrawQueue(){
  if(_spDrawQueue.length===0){_spDrawPlaying=false;return;}
  _spDrawPlaying=true;
  const{cardName,resolve,onPhase1Done}=_spDrawQueue.shift();
  const back=document.getElementById("spDrawCardAnim");
  const front=document.getElementById("spDrawCardAnimFront");
  if(!back||!front){resolve();_spProcessDrawQueue();return;}
  const deckImg=document.getElementById("spMyDeckImg");
  const deckRect=deckImg?deckImg.getBoundingClientRect():{left:window.innerWidth-50,top:window.innerHeight/2,width:32,height:46};
  const deckCx=deckRect.left+deckRect.width/2, deckCy=deckRect.top+deckRect.height/2;
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  const dur1=250,dur2=380,dur3=380,dur4=200;
  spPlaySE(SP_SE.draw);
  back.src="images/card_back.png";
  back.style.display="block"; back.style.transition="none";
  back.style.left=deckCx+"px"; back.style.top=deckCy+"px";
  back.style.transform="translate(-50%,-50%)"; back.style.opacity="1"; back.style.width="32px";
  void back.offsetWidth;
  back.style.transition=`top ${dur1}ms ease-in,opacity ${dur1*0.6}ms ${dur1*0.4}ms ease-in`;
  back.style.top=(window.innerHeight+80)+"px"; back.style.opacity="0";
  setTimeout(()=>{
    back.style.display="none";
    if(onPhase1Done)onPhase1Done();
    front.src=cardName?"images/"+cardName+".png":"images/card_back.png";
    front.style.display="block"; front.style.transition="none";
    front.style.left=cx+"px"; front.style.top=(window.innerHeight+150)+"px";
    front.style.transform="translate(-50%,-50%)"; front.style.opacity="0"; front.style.width="180px";
    void front.offsetWidth;
    front.style.transition=`top ${dur2}ms cubic-bezier(0.22,1,0.36,1),opacity ${dur2*0.3}ms ease-out`;
    front.style.top=cy+"px"; front.style.opacity="1";
    setTimeout(()=>{
      setTimeout(()=>{
        front.style.transition=`opacity ${dur4}ms ease-out`; front.style.opacity="0";
        setTimeout(()=>{front.style.display="none";resolve();_spProcessDrawQueue();},dur4+30);
      },dur3);
    },dur2+30);
  },dur1+30);
}

// ===== ダメージポップ =====
socket.off("damagePop");
socket.on("damagePop",(data)=>{
  const now=Date.now();
  if(!window._spDpLastTime)window._spDpLastTime={};
  const key=`${data.amount}_${data.isLife}_${data.unitIdx}_${data.isEnemy}_${data.isCounter||false}`;
  if(window._spDpLastTime[key]&&now-window._spDpLastTime[key]<200)return;
  window._spDpLastTime[key]=now;
  const delay=data.isCounter?250:80;
  setTimeout(()=>_spShowDamagePop(data),delay);
});
function _spShowDamagePop(data){
  const{amount,isLife,unitIdx,isEnemy}=data;
  let cx,cy;
  if(data.isCounter&&!isEnemy&&_spCounterDmgPos){
    cx=_spCounterDmgPos.x;cy=_spCounterDmgPos.y;
    const pop=document.createElement("div");pop.className="sp-damage-pop dmg-unit";pop.innerText="-"+amount;pop.style.left=cx+"px";pop.style.top=cy+"px";document.body.appendChild(pop);setTimeout(()=>pop.remove(),1300);
    return;
  }
  if(isLife){
    if(isEnemy){
      const el=document.getElementById("spDirectZone");
      if(el){const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}
      else{cx=window.innerWidth/2;cy=150;}
    }else{
      const el=document.getElementById("spHandArea");
      if(el){const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top;}
      else{cx=window.innerWidth/2;cy=window.innerHeight-100;}
    }
  }else if(unitIdx===-2){
    const fsId=isEnemy?"spEnemyFieldSpell":"spMyFieldSpell";
    const fsEl=document.getElementById(fsId)?.querySelector(".sp-card");
    if(fsEl){const r=fsEl.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}
    else{cx=window.innerWidth/2;cy=window.innerHeight/2;}
  }else{
    const containerId=isEnemy?"spEnemyUnits":"spMyUnits";
    const container=document.getElementById(containerId);
    if(container){
      const cards=Array.from(container.querySelectorAll(".sp-card"));
      let targetCard=null;
      if(isEnemy){targetCard=cards[unitIdx]||null;}
      else{
        const myBoardLen=spLatestState?.myBoard?.length??0;
        const myDomLen=cards.length;
        let di=myBoardLen-1-unitIdx-(myBoardLen-myDomLen);
        targetCard=(myDomLen>0)?(cards[di]||null):null;
      }
      if(targetCard){const r=targetCard.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}
      else{cx=window.innerWidth/2;cy=window.innerHeight/2;}
    }else{cx=window.innerWidth/2;cy=window.innerHeight/2;}
  }
  const pop=document.createElement("div");
  pop.className="sp-damage-pop"+(isLife?" dmg-life":" dmg-unit")+(isEnemy?" dmg-enemy":"");
  pop.innerText="-"+amount;
  pop.style.left=cx+"px"; pop.style.top=cy+"px";
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),1300);
}

// ===== hitEffect =====
socket.on("hitEffect",(data)=>{
  if(data.isEnemy){
    spHitActiveEnemy=true; clearTimeout(spHitEnemyTimer);
    spHitEnemyTimer=setTimeout(()=>{spHitActiveEnemy=false;},520);
  }else{
    spHitActiveMy=true; clearTimeout(spHitMyTimer);
    spHitMyTimer=setTimeout(()=>{spHitActiveMy=false;},620);
  }
  const attr=data.attr||"fire";
  if(data.hasAttackAnim&&!data.isEnemy){
    spPlaySE(SP_SE.atk[attr]||SP_SE.atk.neutral);
    const enCards=Array.from(document.getElementById("spEnemyUnits")?.querySelectorAll(".sp-card")||[]);
    const savedRect=enCards[data.attackerIdx]?.getBoundingClientRect()||null;
    setTimeout(()=>{
      const enCards2=Array.from(document.getElementById("spEnemyUnits")?.querySelectorAll(".sp-card")||[]);
      const atkCard=enCards2[data.attackerIdx];
      const useRect=atkCard?atkCard.getBoundingClientRect():savedRect;
      if(!useRect)return;
      const atkRect=useRect; let dx=0,dy=0;
      if(data.isDirect){dx=0;dy=160;}
      else if(data.isFieldSpell){
        const fsCard=document.getElementById("spMyFieldSpell")?.querySelector(".sp-card");
        if(fsCard){const tr=fsCard.getBoundingClientRect();dx=((tr.left+tr.width/2)-(atkRect.left+atkRect.width/2))*0.7;dy=((tr.top+tr.height/2)-(atkRect.top+atkRect.height/2))*0.7;}
      }
      else{
        const myCards=Array.from(document.getElementById("spMyUnits")?.querySelectorAll(".sp-card")||[]);
        const logicalLen=(spLatestState&&spLatestState.myBoard)?spLatestState.myBoard.length:myCards.length;
        const domLen=myCards.length;
        // サーバーidx→表示idx（自分盤面は逆順描画）。DOM枚数が論理枚数と違う場合は差分を補正
        let di=logicalLen-1-data.targetIdx;
        di=di-(logicalLen-domLen); // 枚数が減っていれば前詰め補正
        const tgt=myCards[di];
        if(tgt){const tr=tgt.getBoundingClientRect();dx=((tr.left+tr.width/2)-(atkRect.left+atkRect.width/2))*0.7;dy=((tr.top+tr.height/2)-(atkRect.top+atkRect.height/2))*0.7;}
      }
      if(atkCard){
        atkCard.style.transition="none"; atkCard.style.transform="translate(0,0)";
        void atkCard.offsetWidth;
        atkCard.style.transition="transform 0.18s ease-out"; atkCard.style.transform=`translate(${dx}px,${dy}px)`;
        setTimeout(()=>{atkCard.style.transition="transform 0.16s ease-in";atkCard.style.transform="translate(0,0)";setTimeout(()=>{atkCard.style.transition="";atkCard.style.transform="";},180);},200);
      }
      if(data.isDirect)return;
      if(data.isFieldSpell){
        const fsCard2=document.getElementById("spMyFieldSpell")?.querySelector(".sp-card");
        if(!fsCard2)return;
        const fr=fsCard2.getBoundingClientRect();
        const ffx=document.createElement("img");
        ffx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
        ffx.style.cssText=`position:fixed;left:${fr.left+fr.width/2}px;top:${fr.top+fr.height/2}px;transform:translate(-50%,-50%);width:80px;pointer-events:none;z-index:999;`;
        document.body.appendChild(ffx); setTimeout(()=>ffx.remove(),500);
        return;
      }
      const myCards2=Array.from(document.getElementById("spMyUnits")?.querySelectorAll(".sp-card")||[]);
      const logicalLen2=(spLatestState&&spLatestState.myBoard)?spLatestState.myBoard.length:myCards2.length;
      const domLen2=myCards2.length;
      let di2=logicalLen2-1-data.targetIdx-(logicalLen2-domLen2);
      const hitCard=myCards2[di2]; if(!hitCard)return;
      const r=hitCard.getBoundingClientRect();
      const fx=document.createElement("img");
      fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
      fx.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;transform:translate(-50%,-50%);width:80px;pointer-events:none;z-index:999;`;
      document.body.appendChild(fx); setTimeout(()=>fx.remove(),500);
    },50);
    return;
  }
  if(data.isEnemy){
    if(data.targetIdx===-1)return;
    const enCards=Array.from(document.getElementById("spEnemyUnits")?.querySelectorAll(".sp-card")||[]);
    const card=enCards[data.targetIdx]; if(!card)return;
    const r=card.getBoundingClientRect();
    const fx=document.createElement("img");
    fx.src=`effects/hit_${attr}.gif?t=${Date.now()}`;
    fx.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;transform:translate(-50%,-50%);width:80px;pointer-events:none;z-index:999;`;
    document.body.appendChild(fx); setTimeout(()=>fx.remove(),500);
  }
});

    if(myFs)msg+="[自分] "+myFs.name+"（耐久"+myFs.durability+"）\n";
    if(enFs)msg+="[相手] "+enFs.name+"（耐久"+enFs.durability+"）\n";
    spConfirm(msg+"OKで相手、キャンセルで自分のFSを破壊").then(choice=>{
      socket.emit("cpuAction",{type:"select_target",fieldSpellTarget:choice?"op":"my"});
      spSelectTargetMode=null;
    });
    return;
  }
  if(data.type==="lifeInput"){
    spPrompt(data.message).then(input=>{
      const amount=parseInt(input,10);
      const sendAmt=(isNaN(amount)||amount<0)?0:amount;
      socket.emit("cpuAction",{type:"select_target",targetSide:"life",lifeAmount:sendAmt});
      spSelectTargetMode=null;
      document.getElementById("spTurnLabel").innerText="▶ YOUR TURN";
    });
    return;
  }
  if(data.type==="graveSelect"){
    const options=data.options||[];
    spPrompt(data.message+"\n"+options.map((n,i)=>i+": "+n).join("\n")).then(choice=>{
      const idx=parseInt(choice||"",10);
      if(!isNaN(idx)&&idx>=0&&idx<options.length){
        socket.emit("cpuAction",{type:"select_target",targetSide:"grave",graveIndex:idx});
        spSelectTargetMode=null;
        document.getElementById("spTurnLabel").innerText="▶ YOUR TURN";
      }
    });
    return;
  }
  if(data.type==="soulTrade"){return;} // 手札クリックで処理
});

// ===== updateイベント =====
let _spDidDrawAnim=false;
socket.on("cpuUpdate",(g)=>{
  _cpuMyTurn = (g.turn===socket.id) && !g.winner;
  spLatestState=g;
  if(_spPrevTurn!==null&&_spPrevTurn!==g.turn&&!g.winner)spShowTurnChangeAnim();
  _spPrevTurn=g.turn;

  // ドロー検知
  let drawAnimPromise=Promise.resolve(); _spDidDrawAnim=false;
  if(spPrevMyDeckCount!==null&&g.myDeckCount<spPrevMyDeckCount){
    const drawCount=spPrevMyDeckCount-g.myDeckCount;
    const drawnCards=[];
    for(let i=0;i<drawCount;i++)drawnCards.push(g.myHand[g.myHand.length-drawCount+i]||null);
    const handBefore=g.myHand.slice(0,g.myHand.length-drawCount);
    _spRenderHand(handBefore,g); _spDidDrawAnim=true;
    let displayDeckCount=spPrevMyDeckCount;
    document.getElementById("spMyDeck").innerText=displayDeckCount;
    const myDeckImgEl=document.getElementById("spMyDeckImg");
    if(myDeckImgEl)myDeckImgEl.style.opacity=displayDeckCount>0?"1":"0.2";
    drawAnimPromise=(async()=>{
      for(let i=0;i<drawCount;i++){
        await spPlayDrawAnimWithCallback(drawnCards[i],()=>{
          displayDeckCount--;
          document.getElementById("spMyDeck").innerText=displayDeckCount;
          if(myDeckImgEl)myDeckImgEl.style.opacity=displayDeckCount>0?"1":"0.2";
        });
        handBefore.push(drawnCards[i]);
        _spRenderHand(handBefore,g);
      }
    })();
  }
  // 相手ドロー効果音
  if(spPrevEnemyDeckCount!==null&&g.enemyDeckCount<spPrevEnemyDeckCount){
    const drawCount=spPrevEnemyDeckCount-g.enemyDeckCount;
    const waitEnemy=Math.max(0,_spTurnChangeFinishTime-Date.now());
    setTimeout(()=>{for(let i=0;i<drawCount;i++)setTimeout(()=>spPlaySE(SP_SE.draw),i*100);},waitEnemy);
  }
  spPrevMyDeckCount=g.myDeckCount; spPrevEnemyDeckCount=g.enemyDeckCount;

  // 召喚音
  if(spPrevMyBoardCount!==null&&g.myBoard.length>spPrevMyBoardCount)spPlaySE(SP_SE.summon);
  if(spPrevEnemyBoardCount!==null&&g.enemyBoard.length>spPrevEnemyBoardCount)spPlaySE(SP_SE.summon);
  spPrevMyBoardCount=g.myBoard.length; spPrevEnemyBoardCount=g.enemyBoard.length;

  // ログ攻撃音
  const newLogs=(g.allLogs||[]).slice(spPrevAllLogsLen);
  newLogs.forEach(log=>{
    if(log.includes("に攻撃（")||log.includes("でプレイヤーに直接攻撃")||log.includes("に全体攻撃")){
      const match=log.match(/「(.+?)」(?:で|が)/);
      if(match)spPlaySE(SP_SE.atk[spGetClientAttr(match[1])]||SP_SE.atk.neutral);
      if(log.includes("でプレイヤーに直接攻撃")){
        document.getElementById("gameRoot").classList.remove("sp-shaking");
        void document.getElementById("gameRoot").offsetWidth;
        document.getElementById("gameRoot").classList.add("sp-shaking");
        setTimeout(()=>document.getElementById("gameRoot").classList.remove("sp-shaking"),420);
      }
    }
  });
  spPrevAllLogsLen=(g.allLogs||[]).length;
  spAllLogs=g.allLogs||[];

  // ターン表示
  if(!spSelectTargetMode){
    document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"🤖 CPU思考中...";
  }
  document.getElementById("spWinner").innerText=g.winner?(g.winner===socket.id?"YOU WIN！":"YOU LOSE"):"";
  if(g.winner&&!spResultShown)setTimeout(()=>spShowResult(g.winner===socket.id),300);
  if(!g.winner){if(spResultShown){_bgmPlaying=false;setTimeout(()=>spStartBGM(),200);}spResultShown=false;}

  // 相手手札（裏向き）
  const ehArea=document.getElementById("spEnemyHand");
  if(ehArea){
    const cur=ehArea.childElementCount;
    const want=g.enemyHandCount||0;
    if(cur!==want){
      if(want>cur){
        for(let i=cur;i<want;i++){const img=document.createElement("img");img.src="images/card_back.png";ehArea.appendChild(img);}
      }else{
        for(let i=cur;i>want;i--){if(ehArea.lastElementChild)ehArea.removeChild(ehArea.lastElementChild);}
      }
    }
  }

  // 相手情報
  document.getElementById("spEnemyLife").innerText=g.enemyLife;
  document.getElementById("spEnemyEnergy").innerText=g.enemyEnergy+"/"+g.enemyMaxEnergy;
  document.getElementById("spEnemyDeck").innerText=g.enemyDeckCount;
  const enDeckImg=document.getElementById("spEnemyDeckImg");
  if(enDeckImg)enDeckImg.style.opacity=g.enemyDeckCount>0?"1":"0.2";

  // 自分情報
  document.getElementById("spMyLife").innerText=g.myLife;
  document.getElementById("spMyEnergy").innerText=g.myEnergy+"/"+g.myMaxEnergy;
  if(!_spDidDrawAnim){
    document.getElementById("spMyDeck").innerText=g.myDeckCount;
    const myDeckImg=document.getElementById("spMyDeckImg");
    if(myDeckImg)myDeckImg.style.opacity=g.myDeckCount>0?"1":"0.2";
  }

  // 捨て場
  spMyGraveData=g.myGrave; spEnemyGraveData=g.enemyGrave;
  spRenderGravePile("spMyGravePile","spMyGraveEmpty",g.myGrave);
  spRenderGravePile("spEnemyGravePile","spEnemyGraveEmpty",g.enemyGrave);

  // フィールドスペル
  spRenderFieldSpell("spMyFieldSpell",g.myFieldSpell);
  spRenderFieldSpell("spEnemyFieldSpell",g.enemyFieldSpell);

  // 相手フィールド
  const _renderEnemyField=()=>{
    const ef=document.getElementById("spEnemyUnits"); if(!ef)return;
    ef.innerHTML="";
    for(let si=0;si<3;si++){const s=document.createElement("div");s.className="sp-unit-slot-empty";ef.appendChild(s);}
    g.enemyBoard.forEach((c,i)=>{
      const div=document.createElement("div"); div.className="sp-card";
      const img=document.createElement("img");
      img.src="images/"+c.name+".png";
      img.onclick=()=>{
        document.getElementById("spPreviewImg").src="images/"+c.name+".png";
        document.getElementById("spPreviewModal").classList.add("open");
      };
      div.ontouchend=(e)=>{
        e.preventDefault();
        if(spSelectTargetMode&&(spSelectTargetMode.type==="enemyUnit"||spSelectTargetMode.type==="anyUnit")){
          socket.emit("cpuAction",{type:"select_target",targetIndex:i,targetSide:"enemy"});
          spSelectTargetMode=null;
          document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"🤖 CPU思考中...";
          return;
        }
        if(spSelectedUnitIndex!==null){
          const atkIdx=spSelectedUnitIndex; const tIdx=i; const atkN=spSelectedUnitName;
          spConfirm(atkN+" で "+c.name+" に攻撃？").then(ok=>{
            if(!ok){spClearSelection();return;}
            { const myC=document.getElementById("spMyUnits");const myCards=myC?myC.querySelectorAll(".sp-card"):[];const ml=myCards.length;const di=ml>0?ml-1-atkIdx:atkIdx;const ac=myCards[di];if(ac){const r=ac.getBoundingClientRect();_spCounterDmgPos={x:r.left+r.width/2,y:r.top+r.height/2};}else _spCounterDmgPos=null; }
            spClearSelection();
            spPlayAttackAnim(atkIdx, tIdx, false);
            setTimeout(()=>socket.emit("cpuAction",{type:"attack",a:atkIdx,t:tIdx}), 200);
          });
        }else{
          document.getElementById("spPreviewImg").src="images/"+c.name+".png";
          document.getElementById("spPreviewModal").classList.add("open");
        }
      };
      const stat=document.createElement("div"); stat.className="sp-stat";
      const baseAtk=spGetBaseAtk(c.name);
      let atkColor="#ffe066";
      if(baseAtk!==null){if(c.atk>baseAtk)atkColor="#66aaff";else if(c.atk<baseAtk)atkColor="#ff6666";}
      stat.innerHTML=`HP${c.hp} <span style="color:${atkColor}">AT${c.atk}</span>`;
      _spAppendStatusBadges(div,c);
      div.appendChild(img); div.appendChild(stat); ef.appendChild(div);
    });
    const emptySlots=ef.querySelectorAll(".sp-unit-slot-empty");
    const cardCount=ef.querySelectorAll(".sp-card").length;
    emptySlots.forEach((s,i)=>{s.style.display=i<(3-cardCount)?"flex":"none";});
  };
  if(spHitActiveEnemy)setTimeout(_renderEnemyField,400); else _renderEnemyField();

  // 自分フィールド
  const _renderMyField=()=>{
    const myUnits=document.getElementById("spMyUnits"); if(!myUnits)return;
    myUnits.innerHTML="";
    for(let si=0;si<3;si++){const s=document.createElement("div");s.className="sp-unit-slot-empty";myUnits.appendChild(s);}
    const reversedBoard=[...g.myBoard].reverse();
    reversedBoard.forEach((c,i)=>{
      const originalIdx=g.myBoard.length-1-i;
      const div=document.createElement("div"); div.className="sp-card";
      const img=document.createElement("img"); img.src="images/"+c.name+".png";
      div.ontouchend=(e)=>{
        e.preventDefault();
        if(spSelectTargetMode&&(spSelectTargetMode.type==="myUnit"||spSelectTargetMode.type==="anyUnit")){
          socket.emit("cpuAction",{type:"select_target",targetIndex:originalIdx,targetSide:"my"});
          spSelectTargetMode=null;
          document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"🤖 CPU思考中...";
          return;
        }
        if(spSelectedUnitIndex===originalIdx){
          if(c.denko&&c.attacked&&!c.denkoAttackedThisTurn)return;
          spClearSelection(); return;
        }
        spClearSelection();
        spSelectedUnitIndex=originalIdx; spSelectedUnitName=c.name;
        div.classList.add("selected");
        // 長押しでプレビュー（タップは選択）
      };
      // 長押しでプレビュー
      let pressTimer=null;
      div.addEventListener("touchstart",()=>{pressTimer=setTimeout(()=>{
        document.getElementById("spPreviewImg").src="images/"+c.name+".png";
        document.getElementById("spPreviewModal").classList.add("open");
      },500);});
      div.addEventListener("touchend",()=>clearTimeout(pressTimer));
      div.addEventListener("touchmove",()=>clearTimeout(pressTimer));

      const stat=document.createElement("div"); stat.className="sp-stat";
      const baseAtkMy=spGetBaseAtk(c.name);
      let atkColorMy="#ffe066";
      if(baseAtkMy!==null){if(c.atk>baseAtkMy)atkColorMy="#66aaff";else if(c.atk<baseAtkMy)atkColorMy="#ff6666";}
      stat.innerHTML=`HP${c.hp} <span style="color:${atkColorMy}">AT${c.atk}</span>`;
      _spAppendStatusBadges(div,c);
      div.appendChild(img); div.appendChild(stat); myUnits.appendChild(div);
    });
    const myEmptySlots=myUnits.querySelectorAll(".sp-unit-slot-empty");
    const myCardCount=myUnits.querySelectorAll(".sp-card").length;
    myEmptySlots.forEach((s,i)=>{s.style.display=i<(3-myCardCount)?"flex":"none";});
    // 巻き戻し後の選択復元
    if(spPendingAttackerIndex!==null){
      const cards2=myUnits.querySelectorAll(".sp-card");
      const di=g.myBoard.length-1-spPendingAttackerIndex;
      if(cards2[di]){
        spSelectedUnitIndex=spPendingAttackerIndex;
        spSelectedUnitName=g.myBoard[spPendingAttackerIndex]?.name||"";
        cards2[di].classList.add("selected");
      }
      spPendingAttackerIndex=null;
    }
  };
  if(spHitActiveMy)setTimeout(_renderMyField,550); else _renderMyField();

  // 直接攻撃ゾーン活性化
  const dz=document.getElementById("spDirectZone");
  if(dz)dz.classList.toggle("active",spSelectedUnitIndex!==null);

  // 手札捨て待ちメッセージ
  if(g.pendingDiscard&&g.pendingDiscard>0){
    if(g.isHandLimit)document.getElementById("spTurnLabel").innerText=`⚠️ ${g.pendingDiscard}枚捨ててください`;
    else if(g.isSoulTrade)document.getElementById("spTurnLabel").innerText="🔄 ソウルトレード：捨てるカードを選択";
  }

  // 手札
  if(!_spDidDrawAnim)_spRenderHand(g.myHand,g);
  if(!_spDidDrawAnim){
    document.getElementById("spMyDeck").innerText=g.myDeckCount;
    const myDeckImg=document.getElementById("spMyDeckImg");
    if(myDeckImg)myDeckImg.style.opacity=g.myDeckCount>0?"1":"0.2";
  }
  void drawAnimPromise;
});

// ===== 手札描画 =====
function _spRenderHand(handCards,g){
  const hand=document.getElementById("spHandArea"); hand.innerHTML="";
  const handCount=handCards.length;
  const maxAngle=Math.min(3*handCount,22);
  // 手札エリアの実際の高さからカードサイズを計算（vhベース）
  const handAreaH=document.getElementById("spHandArea")?.offsetHeight||window.innerHeight*0.18;
  // カードの縦横比は約1:1.4。高さの75%をカード高さに使いpxに変換
  const baseCardH=Math.floor(handAreaH*0.82);
  const baseCardW=Math.floor(baseCardH/1.4);
  // 枚数が多いほど縮小するが最小48px
  const cardW=handCount<=3?baseCardW:
               handCount<=5?Math.max(52,Math.floor(baseCardW*0.88)):
               handCount<=7?Math.max(48,Math.floor(baseCardW*0.76)):
               Math.max(44,Math.floor(baseCardW*0.65));
  const overlapPx=handCount<=4?0:Math.min((handCount-4)*8,36);
  handCards.forEach((card,hi)=>{
    const div=document.createElement("div"); div.className="sp-card";
    const ratio=handCount<=1?0:(hi/(handCount-1))*2-1;
    const rotate=ratio*maxAngle;
    const translateY=Math.abs(ratio)*Math.abs(rotate)*0.4;
    const marginLeft=hi===0?0:-overlapPx;
    div.style.cssText=`transform:rotate(${rotate}deg) translateY(${translateY}px);transform-origin:center bottom;z-index:${hi};margin-left:${marginLeft}px;`;
    const img=document.createElement("img"); img.src="images/"+card+".png";
    img.style.width=cardW+"px";
    // 長押しとタップを完全分離
    let pressTimer=null;
    let _longPressed=false;
    div.addEventListener("touchstart",(e)=>{
      _longPressed=false;
      pressTimer=setTimeout(()=>{
        _longPressed=true;
        document.getElementById("spPreviewImg").src="images/"+card+".png";
        document.getElementById("spPreviewModal").classList.add("open");
      },400);
    },{passive:true});
    div.addEventListener("touchmove",()=>{clearTimeout(pressTimer);_longPressed=false;});
    div.ontouchend=(e)=>{
      e.preventDefault();
      clearTimeout(pressTimer);
      if(_longPressed){ _longPressed=false; return; } // 長押しなら何もしない
      if(g.pendingDiscard&&g.pendingDiscard>0){
        spConfirm(card+" を捨てますか？").then(ok=>{if(ok)socket.emit("cpuAction",{type:"discard_hand",card});});
        return;
      }
      if(spSelectTargetMode&&(spSelectTargetMode.type==="handUnit_steel_cost3"||spSelectTargetMode.type==="handUnit_cost2"||spSelectTargetMode.type==="handUnit_cost3"||spSelectTargetMode.type==="handUnit_steel")){
        const hi2=g.myHand.indexOf(card);
        socket.emit("cpuAction",{type:"select_target",targetIndex:hi2,targetSide:"hand",handIndex:hi2});
        spSelectTargetMode=null;
        document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"🤖 CPU思考中...";
        return;
      }
      if(spSelectTargetMode&&spSelectTargetMode.type==="soulTrade"){
        spConfirm(card+" を捨てますか？").then(ok=>{
          if(ok){
            const hi2=g.myHand.indexOf(card);
            socket.emit("cpuAction",{type:"select_target",targetSide:"soulTrade",handIndex:hi2,card:card});
            spSelectTargetMode=null;
            document.getElementById("spTurnLabel").innerText=g.turn===socket.id?"▶ YOUR TURN":"🤖 CPU思考中...";
          }
        });
        return;
      }
      spConfirm(card+" を使用しますか？").then(ok=>{if(ok)socket.emit("cpuAction",{type:"play_card",card});});
    };
    div.appendChild(img); hand.appendChild(div);
  });
}
