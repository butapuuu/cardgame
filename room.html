<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Elemon ルーム対戦</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:#1a2a1a; color:#eee; font-family:sans-serif;
  min-height:100vh; display:flex; justify-content:center; padding:10px;
  transition:background 0.8s;
}
#root{ display:flex; gap:10px; width:100%; max-width:1200px; }

/* ===== ロビー ===== */
#lobby{
  width:100%; max-width:500px; margin:60px auto;
  background:rgba(0,0,0,0.45); border:1px solid #3a6a3a;
  border-radius:12px; padding:32px;
}
#lobby h2{ color:#ffe066; font-size:20px; margin-bottom:20px; text-align:center; letter-spacing:2px; }
#lobby input{
  width:100%; background:#0e1a0e; color:#eee;
  border:1px solid #3a6a3a; border-radius:6px;
  padding:10px 14px; font-size:14px; margin-bottom:10px;
}
#lobby input::placeholder{ color:#556655; }
.lobby-btn{
  width:100%; padding:11px; font-size:13px; font-weight:bold;
  border-radius:6px; cursor:pointer; letter-spacing:1px;
  margin-bottom:8px; transition:all 0.2s;
}
.btn-create{
  background:linear-gradient(135deg,#0d2a0d,#1a4a1a);
  color:#88ff88; border:1px solid #2a8a2a;
  box-shadow:0 0 8px rgba(40,180,40,0.25);
}
.btn-create:hover{ background:linear-gradient(135deg,#1a4a1a,#2a6a2a); box-shadow:0 0 14px rgba(40,220,40,0.4); }
.btn-join{
  background:linear-gradient(135deg,#0a1a2a,#1a2a3a);
  color:#88aaff; border:1px solid #2a4a8a;
  box-shadow:0 0 8px rgba(40,80,200,0.25);
}
.btn-join:hover{ background:linear-gradient(135deg,#1a2a3a,#2a3a5a); box-shadow:0 0 14px rgba(40,100,220,0.4); }
.btn-spectate{
  background:linear-gradient(135deg,#1a1a0a,#2a2a1a);
  color:#ffcc44; border:1px solid #6a6a22;
  box-shadow:0 0 8px rgba(180,160,0,0.25);
}
.btn-spectate:hover{ background:linear-gradient(135deg,#2a2a1a,#3a3a2a); box-shadow:0 0 14px rgba(200,180,0,0.4); }
#lobbyStatus{ color:#aaa; font-size:13px; text-align:center; margin-top:10px; min-height:20px; }
#lobbyError{ color:#ff6666; font-size:13px; text-align:center; margin-top:6px; min-height:18px; }
.lobby-divider{ border:none; border-top:1px solid #2a4a2a; margin:18px 0; }
.lobby-label{ color:#aaddaa; font-size:12px; margin-bottom:6px; letter-spacing:1px; }
#spectateIdDisplay{
  background:rgba(255,200,0,0.1); border:1px solid rgba(255,200,0,0.4);
  border-radius:8px; padding:12px; margin-top:10px; display:none;
  text-align:center;
}
#spectateIdDisplay .sid-label{ color:#aaa; font-size:11px; letter-spacing:1px; }
#spectateIdDisplay .sid-val{ color:#ffe066; font-size:28px; font-weight:bold; letter-spacing:6px; margin-top:4px; }
#spectateIdDisplay .sid-note{ color:#888; font-size:11px; margin-top:4px; }

/* ===== 待機中 ===== */
#waitingScreen{
  display:none; width:100%; max-width:500px; margin:60px auto;
  background:rgba(0,0,0,0.45); border:1px solid #3a6a3a;
  border-radius:12px; padding:32px; text-align:center;
}
#waitingScreen h3{ color:#ffe066; font-size:16px; margin-bottom:16px; }
#waitingRoomId{ color:#88ff88; font-size:24px; font-weight:bold; letter-spacing:4px; margin-bottom:8px; }
#waitingSpectateId{ color:#aaa; font-size:13px; margin-bottom:16px; }
.waiting-anim{ color:#aaddaa; font-size:13px; animation:waitBlink 1.2s ease-in-out infinite; }
@keyframes waitBlink{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ===== ゲーム画面（index.htmlと同じ構造） ===== */
#gameArea{ display:none; width:100%; }
#sidePreview{ width:300px; flex-shrink:0; position:sticky; top:10px; align-self:flex-start; }
#sidePreview img{ width:300px; border-radius:8px; box-shadow:0 0 12px #000; }
#mat{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
#logPanel{ width:260px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; position:sticky; top:10px; align-self:flex-start; }
#logTitle{ font-size:13px; font-weight:bold; color:#ffe066; padding:4px 0; border-bottom:1px solid #444; margin-bottom:4px; }
#logBox{ background:rgba(0,0,0,0.45); border:1px solid #333; border-radius:8px; padding:8px; font-size:12px; color:#ccc; line-height:1.6; min-height:200px; max-height:60vh; overflow-y:auto; }
#logBox .logLine{ padding:2px 0; border-bottom:1px solid #2a2a2a; }
#allLogBtn{ background:linear-gradient(135deg,#0a0a1a,#1a1a2a); color:#8899cc; border:1px solid #334488; border-radius:6px; padding:7px; font-size:11px; font-weight:bold; letter-spacing:2px; cursor:pointer; text-align:center; }
#allLogBtn:hover{ background:linear-gradient(135deg,#1a1a2a,#2a2a4a); color:#aabbee; }

/* モーダル類 */
#graveModal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:1000; justify-content:center; align-items:center; }
#graveModal.open{ display:flex; }
#graveModalInner{ background:#1e1e2e; border:1px solid #555; border-radius:10px; padding:20px; width:60%; max-width:700px; min-width:320px; max-height:80vh; overflow-y:auto; position:relative; }
#graveModalInner h3{ color:#ffe066; margin-bottom:12px; font-size:15px; }
#graveModalCards{ display:flex; flex-wrap:wrap; gap:8px; }
#graveModalCards img{ width:64px; border-radius:5px; box-shadow:0 2px 6px #000; cursor:pointer; transition:transform 0.15s; }
#graveModalCards img:hover{ transform:translateY(-4px); }
#gravePreview{ position:fixed; top:50%; left:20px; transform:translateY(-50%); z-index:1100; pointer-events:none; display:none; }
#gravePreview img{ width:300px; border-radius:8px; box-shadow:0 0 16px #000; }
#logModal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:1000; justify-content:center; align-items:center; }
#logModal.open{ display:flex; }
#logModalInner{ background:#1e2e1e; border:1px solid #444; border-radius:10px; padding:20px; width:90%; max-width:600px; max-height:80vh; overflow-y:auto; font-size:13px; color:#ccc; line-height:1.8; }
#logModalInner h3{ color:#ffe066; margin-bottom:12px; }
#logModalClose{ margin-top:12px; background:#444; color:#eee; border:1px solid #666; border-radius:6px; padding:6px 20px; cursor:pointer; font-size:13px; }

/* ヘッダー */
#header{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#header button{ background:linear-gradient(135deg,#1a2a1a,#2a3a2a); color:#aaddaa; border:1px solid #3a6a3a; border-radius:6px; padding:6px 14px; cursor:pointer; font-size:12px; font-weight:bold; letter-spacing:1px; transition:all 0.2s; white-space:nowrap; }
#header button:hover{ background:linear-gradient(135deg,#2a3a2a,#3a5a3a); color:#ccffcc; }
#header select{ background:#0e1a0e; color:#aaddaa; border:1px solid #3a6a3a; border-radius:6px; padding:4px 8px; font-size:12px; max-width:130px; cursor:pointer; }
#turn{ font-size:16px; font-weight:bold; color:#ffe066; }
#winner{ font-size:18px; font-weight:bold; color:#ff6666; }
.infoBar{ background:rgba(0,0,0,0.4); border-radius:8px; padding:6px 12px; font-size:13px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }

/* フィールド・カード（index.htmlと同じ） */
:root{ --field-bg:rgba(0,80,0,0.35); --field-border:#2d6a2d; --enemy-field-bg:rgba(80,0,0,0.25); --enemy-field-border:#6a2d2d; }
.pm-wrapper{ display:flex; flex-direction:column; gap:6px; width:100%; }
.pm-half{ display:flex; align-items:stretch; gap:8px; min-height:180px; position:relative; }
.pm-side{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; flex-shrink:0; width:110px; }
#enemyDeckSide{ justify-content:flex-end; padding-bottom:1px; }
.life-circle{ width:72px; height:72px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#5a1a1a,#1a0808); border:3px solid #cc4444; box-shadow:0 0 12px rgba(200,50,50,0.5),inset 0 0 8px rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.life-circle .lc-val{ font-size:22px; font-weight:bold; color:#ffaaaa; line-height:1; font-family:Georgia,serif; }
.life-circle .lc-label{ font-size:9px; color:#cc6666; letter-spacing:2px; margin-top:1px; }
.energy-plate{ background:linear-gradient(135deg,#0a1a2a,#0d2a3a); border:1px solid #2266aa; border-radius:8px; padding:5px 10px; text-align:center; box-shadow:0 0 8px rgba(40,120,200,0.3); width:100%; }
.energy-plate .ep-label{ font-size:9px; color:#4488cc; letter-spacing:1px; }
.energy-plate .ep-val{ font-size:13px; font-weight:bold; color:#88ccff; }
.deck-grave-area{ display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; }
.deck-pile{ position:relative; width:56px; cursor:default; }
.deck-pile img{ width:56px; border-radius:5px; box-shadow:1px 1px 0 #222,2px 2px 0 #1a1a1a,3px 3px 0 #141414,4px 4px 0 #0e0e0e,5px 5px 0 #080808,0 6px 12px rgba(0,0,0,0.7); }
.deck-pile .deck-count{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:15px; font-weight:bold; text-shadow:0 0 6px #000,0 0 12px #000; pointer-events:none; z-index:10; }
.grave-pile{ position:relative; width:56px; cursor:pointer; }
.grave-pile img{ width:56px; border-radius:5px; box-shadow:0 2px 6px #000; transition:transform 0.15s; }
.grave-pile:hover img{ transform:translateY(-4px); }
.grave-pile .grave-empty{ width:56px; height:80px; border:1px solid rgba(180,140,80,0.4); border-radius:5px; display:flex; align-items:center; justify-content:center; color:rgba(180,140,80,0.4); font-size:9px; letter-spacing:2px; font-weight:bold; background:rgba(180,140,80,0.04); }
.pm-center{ flex:1; display:flex; flex-direction:column; gap:6px; }
.field-row{ display:flex; align-items:center; gap:8px; background:var(--field-bg); border:2px solid var(--field-border); border-radius:10px; min-height:130px; padding:8px 10px; flex:1; transition:background 0.8s,border-color 0.8s; }
.field-row.enemy-row{ background:var(--enemy-field-bg); border-color:var(--enemy-field-border); }
.unit-slots{ display:flex; gap:8px; align-items:center; flex:1; position:relative; min-height:110px; }
.unit-slot-empty{ width:72px; height:100px; border:1px solid rgba(255,255,255,0.18); border-radius:6px; flex-shrink:0; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; }
.unit-slot-empty::before{ content:"UNIT"; font-size:9px; color:rgba(255,255,255,0.18); letter-spacing:3px; font-weight:bold; pointer-events:none; }
.fs-slot{ width:80px; flex-shrink:0; display:flex; align-items:center; justify-content:center; min-height:110px; border:1px solid rgba(255,215,0,0.45); border-radius:6px; position:relative; background:rgba(255,215,0,0.04); }
.fs-slot::before{ content:"FIELD"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; color:rgba(255,215,0,0.3); letter-spacing:3px; pointer-events:none; font-weight:bold; }
.fs-slot:not(:empty)::before{ display:none; }
.enemy-hand-area{ display:flex; gap:3px; justify-content:center; flex-wrap:wrap; padding:4px 0; min-height:40px; }
.enemy-hand-card img{ width:40px; border-radius:3px; box-shadow:0 1px 4px #000; }
.pm-divider{ height:2px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent); margin:2px 0; }
.card{ display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; transition:transform 0.15s; position:relative; z-index:1; flex-shrink:0; }
.card:hover{ transform:translateY(-10px) !important; z-index:100 !important; }
.card img{ width:72px; border-radius:5px; box-shadow:0 2px 6px #000; }
.card .stat{ font-size:11px; color:#ffe066; margin-top:2px; background:rgba(0,0,0,0.6); border-radius:3px; padding:1px 4px; }
.card.selected img{ outline:3px solid #ff4444; border-radius:5px; }
/* 特殊状態バッジ（カード右上に重ねる） */
.status-badges{ position:absolute; top:2px; right:2px; display:flex; flex-direction:column; gap:2px; z-index:20; pointer-events:none; }
.status-badge{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; box-shadow:0 0 6px rgba(0,0,0,0.8); border:1.5px solid rgba(255,255,255,0.85); }
.status-badge.brainwash{ background:radial-gradient(circle at 35% 30%,#c77dff,#7b2cbf); color:#fff; text-shadow:0 0 3px #4a0a7a; }
.status-badge.restrain{ background:radial-gradient(circle at 35% 30%,#5eff7d,#1a9a3a); color:#fff; text-shadow:0 0 3px #0a5a1a; }
.status-badge.crystal{ background:radial-gradient(circle at 35% 30%,#7dewff,#1a9aca); background:radial-gradient(circle at 35% 30%,#7de4ff,#1a9aca); color:#fff; text-shadow:0 0 3px #0a5a7a; }
.status-badge.denko{ background:radial-gradient(circle at 35% 30%,#fff27d,#e0a800); color:#7a5a00; text-shadow:none; position:relative; }
.status-badge.void{ background:radial-gradient(circle at 35% 30%,#4a4a55,#080810); color:#ccccdd; text-shadow:0 0 3px #000; border-color:rgba(180,180,200,0.9); }
.status-badge.denko .denko-count{ position:absolute; bottom:-3px; right:-3px; background:#222; color:#ffe066; font-size:8px; font-weight:bold; width:11px; height:11px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid #ffe066; }
#enemyPlayerZone{ background:linear-gradient(135deg,rgba(80,0,0,0.25),rgba(120,0,0,0.15)); border:1px solid rgba(180,60,60,0.4); border-radius:6px; height:36px; display:flex; align-items:center; justify-content:center; color:rgba(220,100,100,0.7); font-size:11px; font-weight:bold; letter-spacing:3px; cursor:pointer; transition:all 0.2s; }
#enemyPlayerZone:hover{ background:linear-gradient(135deg,rgba(160,20,20,0.4),rgba(100,0,0,0.3)); border-color:rgba(255,80,80,0.7); color:rgba(255,150,150,0.95); }
#handArea{ background:rgba(0,0,0,0.3); border:2px solid #2d4a2d; border-radius:10px; min-height:110px; padding:8px 16px; display:flex; align-items:flex-end; justify-content:center; flex-wrap:nowrap; overflow:visible; position:relative; }
#endTurnBtn{ background:linear-gradient(135deg,#0d2a0d,#1a4a1a); color:#88ff88; border:1px solid #2a8a2a; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:bold; cursor:pointer; width:100%; }
#endTurnBtn:hover{ background:linear-gradient(135deg,#1a4a1a,#2a6a2a); }
#surrenderBtn{ background:linear-gradient(135deg,#2a0808,#4a1212) !important; color:#ff8888 !important; border:1px solid #8a2222 !important; border-radius:8px !important; padding:8px 16px !important; font-size:13px !important; font-weight:bold !important; cursor:pointer !important; width:100% !important; }

/* 観戦バナー */
#spectateBanner{ background:rgba(255,200,0,0.15); border:1px solid rgba(255,200,0,0.4); border-radius:8px; padding:8px 16px; text-align:center; color:#ffe066; font-size:13px; font-weight:bold; letter-spacing:2px; }

/* アニメーション */
@keyframes attackMoveUp{ 0%{transform:translateY(0);} 45%{transform:translateY(-220px);} 100%{transform:translateY(0);} }
@keyframes screenShake{ 0%{transform:translate(0,0) rotate(0deg);} 15%{transform:translate(-6px,-4px) rotate(-0.5deg);} 30%{transform:translate(6px,4px) rotate(0.5deg);} 45%{transform:translate(-5px,3px) rotate(-0.3deg);} 60%{transform:translate(5px,-3px) rotate(0.3deg);} 75%{transform:translate(-3px,2px) rotate(-0.2deg);} 90%{transform:translate(3px,-2px) rotate(0.2deg);} 100%{transform:translate(0,0) rotate(0deg);} }
.shaking{ animation:screenShake 0.45s ease-in-out; }
#turnChangeOverlay{ position:fixed; top:0; left:-100%; width:100%; height:100%; z-index:3000; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#turnChangeOverlay img{ width:80%; max-width:700px; filter:drop-shadow(0 0 30px rgba(255,200,50,0.8)); }
@keyframes turnChangeSlide{ 0%{left:-100%;opacity:0;} 15%{left:0%;opacity:1;} 75%{left:0%;opacity:1;} 100%{left:100%;opacity:0;} }
.turn-change-anim{ animation:turnChangeSlide 1.4s cubic-bezier(0.22,1,0.36,1) forwards !important; }
#drawCardAnim{ position:fixed; pointer-events:none; z-index:2500; display:none; border-radius:8px; box-shadow:0 0 20px rgba(255,220,100,0.8); width:72px; }
#drawCardAnimFront{ position:fixed; pointer-events:none; z-index:2500; display:none; border-radius:8px; box-shadow:0 0 28px rgba(255,220,100,0.9); width:260px; }
@keyframes damagePopAnim{ 0%{transform:translate(-50%,-150%) scale(0.5);opacity:0;} 15%{transform:translate(-50%,-180%) scale(1.3);opacity:1;} 40%{transform:translate(-50%,-200%) scale(1.0);opacity:1;} 100%{transform:translate(-50%,-280%) scale(0.8);opacity:0;} }
.damage-pop{ position:fixed; pointer-events:none; z-index:1800; font-family:Georgia,'Times New Roman',serif; font-weight:bold; text-shadow:0 0 8px rgba(0,0,0,0.9); animation:damagePopAnim 1.2s ease-out forwards; white-space:nowrap; }
.damage-pop.dmg-unit{ font-size:28px; color:#ff4444; }
.damage-pop.dmg-life{ font-size:36px; color:#ff2222; }
.damage-pop.dmg-enemy{ color:#ffaa00; }
#resultOverlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:2000; justify-content:center; align-items:center; cursor:pointer; }
#resultOverlay img{ max-width:60%; max-height:60%; }

#gameArea{
  display:contents;
}

</style>
</head>
<body>

<img id="drawCardAnim" src="images/card_back.png">
<img id="drawCardAnimFront" src="images/card_back.png">
<div id="turnChangeOverlay"><img src="images/TURN CHANGE.png" alt="TURN CHANGE"></div>
<div id="resultOverlay" onclick="closeResult()"><img id="resultImg" src=""></div>
<div id="gravePreview"></div>

<div id="graveModal">
  <div id="graveModalInner">
    <h3 id="graveModalTitle">🪦 捨て場</h3>
    <div id="graveModalCards"></div>
    <br>
    <button onclick="closeGraveModal()" style="background:#444;color:#eee;border:1px solid #666;border-radius:6px;padding:6px 20px;cursor:pointer;font-size:13px;">閉じる</button>
  </div>
</div>

<div id="logModal">
  <div id="logModalInner">
    <h3>📜 ゲームログ（全履歴）</h3>
    <div id="logModalContent"></div>
    <br>
    <button id="logModalClose" onclick="closeLogModal()">閉じる</button>
  </div>
</div>

<!-- ロビー -->
<div id="lobby">
  <h2>⚔ ルーム対戦</h2>
  <a href="top.html" style="display:block;width:100%;text-align:center;padding:8px;margin-bottom:6px;background:linear-gradient(135deg,#0a1a0a,#1a2a1a);color:rgba(180,220,100,0.7);border:1px solid rgba(60,140,60,0.35);border-radius:8px;font-size:11px;font-weight:bold;letter-spacing:3px;text-decoration:none;text-transform:uppercase;transition:all 0.2s;" onmouseover="this.style.color='#aaffaa';this.style.borderColor='rgba(80,180,80,0.6)'" onmouseout="this.style.color='rgba(180,220,100,0.7)';this.style.borderColor='rgba(60,140,60,0.35)'">◈ TOP</a>

  <div class="lobby-label">デッキ選択</div>
  <select id="deckSelectLobby" style="width:100%;background:#0e1a0e;color:#aaddaa;border:1px solid #3a6a3a;border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:10px;">
    <option value="-1">デッキ選択</option>
  </select>
  <button class="lobby-btn" onclick="window.open('deck1.html','_blank')" style="background:linear-gradient(135deg,#1a0a2a,#2a1a3a);color:#cc88ff;border:1px solid #6a3a8a;margin-bottom:8px;">⚔ デッキ構築</button>

  <hr class="lobby-divider">

  <div class="lobby-label">ルームIDを入力して作成 / 参加</div>
  <input type="text" id="roomIdInput" placeholder="ルームID（好きな言葉）" maxlength="20">

  <button class="lobby-btn btn-create" onclick="createRoom()">🏠 ルームを作成する</button>
  <button class="lobby-btn btn-join" onclick="joinRoom()">🚪 ルームに参加する</button>

  <div id="spectateIdDisplay">
    <div class="sid-label">観戦ID（対戦相手・観戦者に教えてください）</div>
    <div class="sid-val" id="spectateIdVal">----</div>
    <div class="sid-note">この数字を知っている人は観戦できます</div>
  </div>

  <hr class="lobby-divider">

  <div class="lobby-label">観戦IDを入力して観戦</div>
  <input type="text" id="spectateIdInput" placeholder="観戦ID（4桁の数字）" maxlength="4">
  <button class="lobby-btn btn-spectate" onclick="joinSpectate()">👁 観戦する</button>

  <div id="lobbyStatus"></div>
  <div id="lobbyError"></div>

</div>

<!-- 待機中 -->
<div id="waitingScreen">
  <h3>⏳ 対戦相手を待っています</h3>
  <div id="waitingRoomId"></div>

<script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:800,reconnectionDelayMax:4000,timeout:20000});

let _lastUpdateTime=Date.now(); // 最後にサーバー応答を受けた時刻
let _gameStarted=false;        // 対戦が始まったか（ロビー中は監視しない）

// ===== 接続状態バナー =====
function _showConnBanner(text,color){
  let b=document.getElementById("connBanner");
  if(!b){
    b=document.createElement("div");b.id="connBanner";
    b.style.cssText="position:fixed;top:0;left:0;width:100%;text-align:center;padding:8px;font-size:13px;font-weight:bold;z-index:9000;letter-spacing:1px;";
    document.body.appendChild(b);
  }
  b.style.background=color;b.style.color="#fff";b.innerText=text;b.style.display="block";
}
function _hideConnBanner(){const b=document.getElementById("connBanner");if(b)b.style.display="none";}

// 切断検知
socket.on("disconnect",(reason)=>{
  _disconnected=true;
  _showConnBanner("⚠️ 接続が切れました。再接続しています…","rgba(180,40,40,0.95)");
});
// 再接続中
socket.io.on("reconnect_attempt",()=>{
  if(_disconnected)_showConnBanner("🔄 再接続を試みています…","rgba(180,120,0,0.95)");
});
function _pcDoRejoin(){
  const rid=sessionStorage.getItem("pcMyRoomId");
  const role=sessionStorage.getItem("pcMyRole");
  if(rid&&role){ socket.emit("roomRejoin",{roomId:rid,role:role}); }
  else { socket.emit("roomResync"); }
}
// 再接続成功
socket.io.on("reconnect",()=>{
  _disconnected=false;
  _showConnBanner("✅ 再接続しました。盤面を復元しています…","rgba(40,140,40,0.95)");
  _pcDoRejoin();
  setTimeout(_hideConnBanner,1500);
});
// 再接続成功（connイベント側でも保険）
socket.on("connect",()=>{
  // 初回接続でも発火するためrejoinはreconnect側に任せる。ここではフラグ整理のみ
  if(_disconnected){
    _disconnected=false;
    _showConnBanner("✅ 再接続しました","rgba(40,140,40,0.95)");
    setTimeout(_hideConnBanner,1500);
  }
});
socket.on("rejoinOK",(data)=>{
  playerRole=data.role;
  document.getElementById("lobby").style.display="none";
  document.getElementById("waitingScreen").style.display="none";
  document.getElementById("gameArea").style.display="contents";
  _showConnBanner("✅ 試合に復帰しました","rgba(40,140,40,0.95)");
  setTimeout(_hideConnBanner,1500);
});
socket.on("rejoinFailed",(data)=>{
  _showConnBanner("⚠️ 復帰できませんでした。再接続を試すか再読み込みしてください","rgba(180,40,40,0.95)");
});

socket.on("needRejoin",()=>{
  // roomActionがルーム未特定→自動でrejoinを試みる
  _pcDoRejoin();
  _showConnBanner("🔄 接続を復元しています…","rgba(180,120,0,0.95)");
  setTimeout(_hideConnBanner,1500);
});

// ===== 無応答（フリーズ）検知：30秒応答が無ければリロードを促す =====
setInterval(()=>{
  if(!_gameStarted||_disconnected)return;
  if(Date.now()-_lastUpdateTime>30000){
    let f=document.getElementById("freezeHelp");
    if(!f){
      f=document.createElement("div");f.id="freezeHelp";
      f.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#2a1a1a;border:2px solid #cc6666;border-radius:12px;padding:24px;z-index:9500;text-align:center;box-shadow:0 0 30px rgba(0,0,0,0.8);max-width:90vw;";
      f.innerHTML=`<div style="color:#ffaaaa;font-size:14px;font-weight:bold;margin-bottom:6px;">⚠️ 通信が停止している可能性があります</div>
        <div style="color:#ccc;font-size:12px;margin-bottom:14px;line-height:1.6;">サーバーからの応答が一定時間ありません。<br>下のボタンで再接続を試せます。</div>
        <button onclick="_tryResync()" style="background:linear-gradient(135deg,#0d2a0d,#1a4a1a);color:#88ff88;border:1px solid #2a8a2a;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:bold;cursor:pointer;margin-right:8px;">🔄 再接続を試す</button>
        <button onclick="location.reload()" style="background:linear-gradient(135deg,#2a0808,#4a1212);color:#ff8888;border:1px solid #8a2222;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:bold;cursor:pointer;">↻ 再読み込み</button>`;
      document.body.appendChild(f);
    }
  }
},5000);
function _tryResync(){
  const f=document.getElementById("freezeHelp");if(f)f.remove();
  if(!socket.connected){ socket.connect(); }
  _pcDoRejoin();
  _showConnBanner("🔄 再接続を試みています…","rgba(180,120,0,0.95)");

function _showDamagePop(data){

  else{const cid=isEnemy?"enemyUnits":"myUnits";const c=document.getElementById(cid);if(c){const cards=Array.from(c.querySelectorAll(".card"));let tc=null;if(isEnemy){tc=cards[unitIdx]||null;
}else{const dl=cards.length;if(data.isCounter){if(dl>0)tc=cards[dl-1-unitIdx]||cards[Math.min(unitIdx,dl-1)]||null;}else{const ml=latestState?.myBoard?.length??0;if(ml===dl&&dl>0)tc=cards[dl-1-unitIdx]||null;else if(dl>0)tc=cards[Math.min(unitIdx,dl-1)]||null;}}
if(tc){const r=tc.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}else{cx=window.innerWidth/2;cy=window.innerHeight/2;}}else{cx=window.innerWidth/2;cy=window.innerHeight/2;}}
  const pop=document.createElement("div");pop.className="damage-pop"+(isLife?" dmg-life":" dmg-unit")+(isEnemy?" dmg-enemy":"");pop.innerText="-"+amount;pop.style.left=cx+"px";pop.style.top=cy+"px";document.body.appendChild(pop);setTimeout(()=>pop.remove(),1300);
}

            playAttackAnim(ai,ti,false);
            setTimeout(()=>{
              playSE(SE.atk[getClientAttr(sn)]||SE.atk.neutral);
              socket.emit("roomAction",{type:"attack",a:ai,t:ti});
            },200);
          }else clearSelection();
        }
      };
      const stat=document.createElement("div");stat.className="stat";const ba=getBaseAtk(c.name);let ac="#ffe066";if(ba!==null){if(c.atk>ba)ac="#66aaff";else if(c.atk<ba)ac="#ff6666";}
      stat.innerHTML=`HP${c.hp} <span style="color:${ac}">AT${c.atk}</span>`;
      _appendStatusBadges(div,c);
      div.appendChild(img);div.appendChild(stat);ef.appendChild(div);
    });
    const es=ef.querySelectorAll(".unit-slot-empty"),cc=ef.querySelectorAll(".card").length;
    const _enLim=(g.enemySlotLimit!==undefined)?g.enemySlotLimit:3;
    es.forEach((s,i)=>{
      s.style.display=i<(3-cc)?"flex":"none";
      const locked=i<(3-_enLim);
      s.style.borderColor=locked?"rgba(255,60,60,0.7)":"";
      s.style.background=locked?"rgba(80,0,0,0.35)":"";
      let x=s.querySelector(".slot-lock-x");
      if(locked&&!x){x=document.createElement("div");x.className="slot-lock-x";x.innerText="✕";x.style.cssText="position:absolute;font-size:34px;color:rgba(255,80,80,0.85);font-weight:bold;pointer-events:none;text-shadow:0 0 8px #000;";s.style.position="relative";s.appendChild(x);}
      else if(!locked&&x){x.remove();}
    });
  };
  if(hitEffectActiveEnemy)setTimeout(_renderEnemyField,400);else _renderEnemyField();

  // 直接攻撃ゾーン
  const epz=document.getElementById("enemyPlayerZone");
  epz.onclick=()=>{
    if(playerRole==="spectator")return;
    if(selectedUnitIndex!==null){
      if(confirm(`${selectedUnitName} でプレイヤーに直接攻撃？`)){
        const ai=selectedUnitIndex;const sn=selectedUnitName;
        clearSelection();
        playAttackAnim(ai,null,true);
        setTimeout(()=>{
          playSE(SE.atk[getClientAttr(sn)]||SE.atk.neutral);
          document.body.classList.remove("shaking");
          void document.body.offsetWidth;
          document.body.classList.add("shaking");
          setTimeout(()=>document.body.classList.remove("shaking"),460);
          socket.emit("roomAction",{type:"attack",a:ai});
        },200);
      }else clearSelection();
    }
  };

  // 自分フィールド
  const _renderMyField=()=>{
    const myUnits=document.getElementById("myUnits");if(!myUnits)return;myUnits.innerHTML="";
    for(let si=0;si<3;si++){const s=document.createElement("div");s.className="unit-slot-empty";myUnits.appendChild(s);}
    const rev=[...g.myBoard].reverse();
    rev.forEach((c,i)=>{
      const originalIdx=g.myBoard.length-1-i;
      const div=document.createElement("div");div.className="card";
      const img=document.createElement("img");img.src="images/"+c.name+".png";
      img.onmouseenter=()=>{document.getElementById("preview").innerHTML=`<img src="images/${c.name}.png">`;};
      img.onmouseleave=()=>{document.getElementById("preview").innerHTML="";};
      img.draggable=true;
      div.onclick=()=>{
        if(playerRole==="spectator")return;
        if(selectTargetMode&&(selectTargetMode.type==="myUnit"||selectTargetMode.type==="anyUnit")){
          socket.emit("roomAction",{type:"select_target",targetIndex:originalIdx,targetSide:"my"});
          selectTargetMode=null;
          document.getElementById("turn").innerText=latestState?.turn===socket.id?"▶ YOUR TURN":"ENEMY TURN";
          return;
        }
        if(selectedUnitIndex===originalIdx){
          if(c.denko&&c.attacked&&!c.denkoAttackedThisTurn)return;
          clearSelection();return;
        }
        clearSelection();
        selectedUnitIndex=originalIdx;selectedUnitName=c.name;
        div.classList.add("selected");
      };
      const stat=document.createElement("div");stat.className="stat";const ba=getBaseAtk(c.name);let ac="#ffe066";if(ba!==null){if(c.atk>ba)ac="#66aaff";else if(c.atk<ba)ac="#ff6666";}
      stat.innerHTML=`HP${c.hp} <span style="color:${ac}">AT${c.atk}</span>`;
      _appendStatusBadges(div,c);
      div.appendChild(img);div.appendChild(stat);myUnits.appendChild(div);
    });
    const mes=myUnits.querySelectorAll(".unit-slot-empty"),mc=myUnits.querySelectorAll(".card").length;
    const _myLim=(g.mySlotLimit!==undefined)?g.mySlotLimit:3;
    mes.forEach((s,i)=>{
      s.style.display=i<(3-mc)?"flex":"none";
      const locked=i<(3-_myLim);
      s.style.borderColor=locked?"rgba(255,60,60,0.7)":"";
      s.style.background=locked?"rgba(80,0,0,0.35)":"";
      s.dataset.locked=locked?"1":"";
      let x=s.querySelector(".slot-lock-x");
      if(locked&&!x){x=document.createElement("div");x.className="slot-lock-x";x.innerText="✕";x.style.cssText="position:absolute;font-size:34px;color:rgba(255,80,80,0.85);font-weight:bold;pointer-events:none;text-shadow:0 0 8px #000;";s.style.position="relative";s.appendChild(x);}
      else if(!locked&&x){x.remove();}
    });
    if(pendingAttackerIndex!==null){const cards=myUnits.querySelectorAll(".card");const di=g.myBoard.length-1-pendingAttackerIndex;if(cards[di]){selectedUnitIndex=pendingAttackerIndex;selectedUnitName=g.myBoard[pendingAttackerIndex]?.name||"";cards[di].classList.add("selected");}pendingAttackerIndex=null;}
  };
  if(hitEffectActiveMy)setTimeout(_renderMyField,550);else _renderMyField();

  document.getElementById("myLife").innerText=g.myLife;
  document.getElementById("myEnergy").innerText=g.myEnergy+"/"+g.myMaxEnergy;
  if(!_didDrawAnim){document.getElementById("myDeck").innerText=g.myDeckCount;const mdi=document.getElementById("myDeckImg");if(mdi)mdi.style.opacity=g.myDeckCount>0?"1":"0.2";}
  myGraveData=g.myGrave;enemyGraveData=g.enemyGrave;
  _renderGravePile("myGravePile","myGraveEmpty",g.myGrave);
  _renderGravePile("enemyGravePile","enemyGraveEmpty",g.enemyGrave);

  if(g.pendingDiscard&&g.pendingDiscard>0){if(g.isHandLimit)document.getElementById("turn").innerText=`⚠️ 手札上限超過！${g.pendingDiscard}枚捨ててください`;else if(g.isSoulTrade)document.getElementById("turn").innerText="🔄 ソウルトレード：捨てるカードを選択";}

  if(!_didDrawAnim)_renderHand(g.myHand,g);
  if(!_didDrawAnim){document.getElementById("myDeck").innerText=g.myDeckCount;const mdi=document.getElementById("myDeckImg");if(mdi)mdi.style.opacity=g.myDeckCount>0?"1":"0.2";}
  void drawAnimPromise;
});

// ===== 特殊状態バッジ生成 =====
function _appendStatusBadges(div,c){
  const wrap=document.createElement("div");wrap.className="status-badges";
  let has=false;
  if(c.disabled&&c.disabledCount!==undefined){const b=document.createElement("div");b.className="status-badge restrain";b.innerText="⛓";b.title="拘束";wrap.appendChild(b);has=true;}
  else if(c.disabled){const b=document.createElement("div");b.className="status-badge brainwash";b.innerText="✦";b.title="洗脳";wrap.appendChild(b);has=true;}
  if(c.barrier){const b=document.createElement("div");b.className="status-badge crystal";b.innerText="◆";b.title="結晶";wrap.appendChild(b);has=true;}
  if(c.voided){const b=document.createElement("div");b.className="status-badge void";b.innerText="✖";b.title="虚無（効果無効）";wrap.appendChild(b);has=true;}
  let denkoLeft=0;
  if(c.denko&&!c.attacked)denkoLeft=2;else if(c.denko&&c.attacked&&!c.denkoAttackedThisTurn)denkoLeft=1;
  if(denkoLeft>0){const b=document.createElement("div");b.className="status-badge denko";b.innerHTML="⚡<span class='denko-count'>"+denkoLeft+"</span>";b.title="電光石火 残り"+denkoLeft+"回";wrap.appendChild(b);has=true;}
  if(has)div.appendChild(wrap);
}

// ===== 攻撃アニメーション =====
function playAttackAnim(attackerIdx,targetIdx,isDirect){
  const myContainer=document.getElementById("myUnits");if(!myContainer)return;
  const myCards=myContainer.querySelectorAll(".card");const myBoardLen=latestState?.myBoard?.length||0;
  const displayAtkIdx=myBoardLen>0?myBoardLen-1-attackerIdx:attackerIdx;const card=myCards[displayAtkIdx];if(!card)return;
  let dx=0,dy=-120;
  if(isDirect){dx=0;dy=-220;}
  else if(targetIdx!==null&&targetIdx!==undefined){const ar=card.getBoundingClientRect();const ec=document.getElementById("enemyUnits");if(ec){const en=ec.querySelectorAll(".card");const tc=en[targetIdx];if(tc){const tr=tc.getBoundingClientRect();dx=((tr.left+tr.width/2)-(ar.left+ar.width/2))*0.7;dy=((tr.top+tr.height/2)-(ar.top+ar.height/2))*0.7;}}}
  card.style.transition="none";card.style.transform="translate(0,0)";void card.offsetWidth;card.style.transition="transform 0.18s ease-out";card.style.transform=`translate(${dx}px,${dy}px)`;
  setTimeout(()=>{card.style.transition="transform 0.16s ease-in";card.style.transform="translate(0,0)";setTimeout(()=>{card.style.transition="";card.style.transform="";},180);},200);
}

// ===== 手札描画 =====
function _renderHand(handCards,g){
  if(playerRole==="spectator"){
    const hand=document.getElementById("handArea");
    hand.innerHTML="";
    hand.style.overflow="hidden"; // 枠をはみ出さない
    const count=g.myHandCount||0;
    if(count===0)return;
    // 枠の実際の幅を取得（パディング除いた内側）
    const handW=Math.max(1, hand.clientWidth - 32); // padding:8px 16px = 32px
    // 枠に収まる最大カード幅を計算（最小28px）
    const rawCardW=count<=1 ? 56 : Math.floor(handW/count);
    const cardW=Math.max(28, Math.min(56, rawCardW));
    // 重なり量：全カードが枠内に収まるように
    const totalNatural=cardW*count;
    const overlapPx=totalNatural>handW&&count>1 ? Math.ceil((totalNatural-handW)/(count-1)) : 0;
    for(let i=0;i<count;i++){
      const div=document.createElement("div");div.className="card";
      const ml=i===0?0:-overlapPx;
      // 回転なし・translateYなし（扇型不要、シンプルに並べる）
      div.style.cssText=`display:inline-flex;flex-direction:column;align-items:center;flex-shrink:0;margin-left:${ml}px;`;
      const img=document.createElement("img");img.src="images/card_back.png";
      img.style.cssText=`width:${cardW}px;border-radius:4px;box-shadow:0 2px 5px #000;`;
      div.appendChild(img);hand.appendChild(div);
    }
    return;
  }
  // 通常プレイヤーの場合はoveflowを戻す
  document.getElementById("handArea").style.overflow="visible";
  const hand=document.getElementById("handArea");hand.innerHTML="";
  const hc=handCards.length;const maxAngle=Math.min(3*hc,24);const overlapPx=hc<=4?0:Math.min((hc-4)*12,44);
  handCards.forEach((card,hi)=>{
    const div=document.createElement("div");div.className="card";
    const ratio=hc<=1?0:(hi/(hc-1))*2-1;const rotate=ratio*maxAngle;const ty=Math.abs(ratio)*Math.abs(rotate)*0.4;const ml=hi===0?0:-overlapPx;
    div.style.cssText=`transform:rotate(${rotate}deg) translateY(${ty}px);transform-origin:center bottom;z-index:${hi};margin-left:${ml}px;`;
    div.onmouseenter=()=>{div.style.cssText=`transform:rotate(${rotate}deg) translateY(${ty-12}px);transform-origin:center bottom;z-index:100;transition:transform 0.18s ease;margin-left:${ml}px;`;};
    div.onmouseleave=()=>{div.style.cssText=`transform:rotate(${rotate}deg) translateY(${ty}px);transform-origin:center bottom;z-index:${hi};transition:transform 0.18s ease;margin-left:${ml}px;`;};
    const img=document.createElement("img");img.src="images/"+card+".png";
    img.onmouseenter=()=>{document.getElementById("preview").innerHTML=`<img src="images/${card}.png">`;};
    img.onmouseleave=()=>{document.getElementById("preview").innerHTML="";};
    img.draggable=true;
    div.onclick=()=>{
      if(playerRole==="spectator")return;
      if(g.pendingDiscard&&g.pendingDiscard>0){if(confirm(card+" を捨てますか？"))socket.emit("roomAction",{type:"discard_hand",card});return;}
      if(selectTargetMode&&selectTargetMode.type==="handAny"){const hi2=g.myHand.indexOf(card);if(confirm(card+" を捨てますか？")){socket.emit("roomAction",{type:"select_target",targetSide:"hand",handIndex:hi2,card:card});selectTargetMode=null;document.getElementById("turn").innerText="▶ YOUR TURN";}return;}
      if(selectTargetMode&&(selectTargetMode.type==="handUnit_steel_cost3"||selectTargetMode.type==="handUnit_cost2"||selectTargetMode.type==="handUnit_cost3"||selectTargetMode.type==="handUnit_cost4"||selectTargetMode.type==="handUnit_steel")){const hi2=g.myHand.indexOf(card);socket.emit("roomAction",{type:"select_target",targetIndex:hi2,targetSide:"hand",handIndex:hi2});selectTargetMode=null;document.getElementById("turn").innerText="▶ YOUR TURN";return;}
      if(selectTargetMode&&selectTargetMode.type==="soulTrade"){if(confirm(card+" を捨てますか？")){const hi2=g.myHand.indexOf(card);socket.emit("roomAction",{type:"select_target",targetSide:"soulTrade",handIndex:hi2,card:card});selectTargetMode=null;document.getElementById("turn").innerText="▶ YOUR TURN";}return;}
      if(confirm(card+" を使用しますか？"))socket.emit("roomAction",{type:"play_card",card});
    };
    div.appendChild(img);hand.appendChild(div);
  });
}
</script>
