<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デッキ構築</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background:#0d1a0d;
  color:#ccc;
  font-family:'Segoe UI',sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== ヘッダー ===== */
#pageHeader{
  background:linear-gradient(135deg,#0a180a,#162816);
  border-bottom:1px solid #2a5a2a;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:0 2px 16px rgba(0,0,0,0.6);
}
#pageHeader h2{
  color:#88dd88;
  font-size:18px;
  letter-spacing:3px;
  font-weight:bold;
  text-shadow:0 0 12px rgba(100,220,100,0.4);
  white-space:nowrap;
}
#pageHeader a{
  color:#66aa66;
  font-size:12px;
  text-decoration:none;
  border:1px solid #3a6a3a;
  border-radius:4px;
  padding:4px 10px;
  background:rgba(0,80,0,0.3);
  transition:all 0.2s;
}
#pageHeader a:hover{ background:rgba(0,120,0,0.4); color:#aaffaa; }

/* ===== メインレイアウト ===== */
#mainLayout{
  display:flex;
  flex:1;
  gap:0;
  overflow:hidden;
  min-height:0;
}

/* ===== 左カラム（デッキ＋操作） ===== */
#leftCol{
  width:340px;
  flex-shrink:0;
  background:linear-gradient(180deg,#0e1c0e,#121e12);
  border-right:1px solid #2a4a2a;
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:12px;
  overflow-y:auto;
}

/* デッキ枚数 */
#deckCountBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(135deg,#0a1a0a,#162416);
  border:1px solid #2a5a2a;
  border-radius:8px;
  padding:8px 14px;
  box-shadow:0 0 10px rgba(40,160,40,0.15);
}
#deckCountBar .count-label{
  font-size:11px;color:#4a8a4a;letter-spacing:2px;
}
#deckCountBar .count-val{
  font-size:22px;font-weight:bold;color:#88ff88;
  text-shadow:0 0 10px rgba(100,255,100,0.4);
}
#deckCountBar .count-max{
  font-size:13px;color:#3a6a3a;
}

/* デッキグリッド */
#deck{
  display:grid;
  grid-template-columns:repeat(5,56px);
  grid-template-rows:repeat(4,76px);
  gap:4px;
  background:rgba(0,0,0,0.3);
  border:1px solid #1a3a1a;
  border-radius:8px;
  padding:8px;
  height:336px;
}
#deck .card{
  cursor:pointer;
  position:relative;
}
#deck .card img{
  width:56px;border-radius:4px;
  box-shadow:0 1px 4px rgba(0,0,0,0.6);
  transition:transform 0.15s;
  display:block;
}
#deck .card:hover img{ transform:translateY(-3px); }
#deck .card .remove-badge{
  position:absolute;top:-4px;right:-4px;
  background:#cc2222;color:#fff;
  border-radius:50%;width:16px;height:16px;
  font-size:10px;line-height:16px;text-align:center;
  opacity:0;transition:opacity 0.15s;
  pointer-events:none;
}
#deck .card:hover .remove-badge{ opacity:1; }

/* スロット・デッキ名 */
.slot-section{
  background:rgba(0,0,0,0.3);
  border:1px solid #1a3a1a;
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.slot-section label{
  font-size:10px;color:#4a8a4a;letter-spacing:2px;
}
.slot-section input,.slot-section select{
  background:#0a1a0a;
  color:#aaddaa;
  border:1px solid #2a5a2a;
  border-radius:6px;
  padding:5px 8px;
  font-size:12px;
  width:100%;
}
.slot-section input::placeholder{ color:#3a6a3a; }
#slotList{
  font-size:10px;color:#3a6a3a;line-height:1.6;
}

/* アクションボタン群 */
.action-btns{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.btn-primary{
  background:linear-gradient(135deg,#0d2a0d,#1a4a1a);
  color:#88ff88;
  border:1px solid #2a8a2a;
  border-radius:8px;
  padding:9px 16px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 0 8px rgba(40,180,40,0.2);
  transition:all 0.2s;
  width:100%;
}
.btn-primary:hover{
  background:linear-gradient(135deg,#1a4a1a,#2a6a2a);
  box-shadow:0 0 14px rgba(40,220,40,0.4);
  color:#aaffaa;
}
.btn-danger{
  background:linear-gradient(135deg,#2a0808,#4a1212);
  color:#ff8888;
  border:1px solid #8a2222;
  border-radius:8px;
  padding:9px 16px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 0 8px rgba(180,40,40,0.2);
  transition:all 0.2s;
  width:100%;
}
.btn-danger:hover{
  background:linear-gradient(135deg,#4a1212,#6a1a1a);
  box-shadow:0 0 14px rgba(220,40,40,0.4);
  color:#ffaaaa;
}
.btn-copy{
  background:linear-gradient(135deg,#0a1a2a,#1a2a4a);
  color:#88aaff;
  border:1px solid #2a4a8a;
  border-radius:8px;
  padding:9px 16px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 0 8px rgba(40,80,200,0.2);
  transition:all 0.2s;
  width:100%;
}
.btn-copy:hover{
  background:linear-gradient(135deg,#1a2a4a,#2a3a6a);
  box-shadow:0 0 14px rgba(80,120,240,0.4);
  color:#aabbff;
}

/* ===== 右：フィルター＋カード一覧 ===== */
#rightCol{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  margin-right:280px;
}

/* フィルターバー */
#filterBar{
  background:linear-gradient(135deg,#0a180a,#121e12);
  border-bottom:1px solid #1a3a1a;
  padding:10px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.filter-row{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.filter-label{
  font-size:10px;color:#4a8a4a;letter-spacing:2px;
  min-width:40px;
}
/* 検索バー */
#search{
  background:#0a1a0a;
  color:#aaddaa;
  border:1px solid #2a5a2a;
  border-radius:6px;
  padding:5px 10px;
  font-size:12px;
  width:200px;
  outline:none;
}
#search::placeholder{ color:#3a6a3a; }
#search:focus{ border-color:#4a9a4a; box-shadow:0 0 6px rgba(60,180,60,0.3); }

/* フィルターボタン */
.filt-btn{
  background:rgba(0,0,0,0.4);
  color:#666;
  border:1px solid #2a3a2a;
  border-radius:5px;
  padding:4px 10px;
  font-size:11px;
  cursor:pointer;
  transition:all 0.15s;
  letter-spacing:1px;
  white-space:nowrap;
}
.filt-btn:hover{ background:rgba(40,80,40,0.5); color:#88aa88; }
.filt-btn.active{
  background:linear-gradient(135deg,#0d2a0d,#1a4a1a);
  color:#88ff88;
  border-color:#2a8a2a;
  box-shadow:0 0 6px rgba(40,180,40,0.3);
}
/* 属性別アクティブ色 */
.filt-btn.active.fire{ background:linear-gradient(135deg,#2a0a00,#4a1800);color:#ffaa66;border-color:#aa4400; }
.filt-btn.active.water{ background:linear-gradient(135deg,#001a2a,#002a4a);color:#66aaff;border-color:#0044aa; }
.filt-btn.active.thunder{ background:linear-gradient(135deg,#1a1a00,#2a2a00);color:#ffff44;border-color:#aaaa00; }
.filt-btn.active.forest{ background:linear-gradient(135deg,#001a00,#002a00);color:#88ff44;border-color:#00aa00; }
.filt-btn.active.dark{ background:linear-gradient(135deg,#0a001a,#18003a);color:#cc88ff;border-color:#6600cc; }
.filt-btn.active.poison{ background:linear-gradient(135deg,#001a00,#003000);color:#aaff44;border-color:#44cc00; }
.filt-btn.active.steel{ background:linear-gradient(135deg,#1a1a1a,#2a2a2a);color:#ccccdd;border-color:#7777aa; }
.filt-btn.active.neutral{ background:linear-gradient(135deg,#1a1a0a,#2a2a1a);color:#ddddaa;border-color:#888844; }

/* カード一覧エリア */
#cardsOuter{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
}
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,72px);
  gap:8px;
}
#cards .card{
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  position:relative;
}
#cards .card img{
  width:72px;border-radius:5px;
  box-shadow:0 2px 6px rgba(0,0,0,0.6);
  transition:transform 0.15s, box-shadow 0.15s;
}
#cards .card:hover img{
  transform:translateY(-4px);
  box-shadow:0 6px 14px rgba(0,0,0,0.8);
}
#cards .card .card-count-badge{
  position:absolute;top:2px;right:2px;
  background:rgba(0,180,0,0.85);
  color:#fff;font-size:10px;font-weight:bold;
  border-radius:3px;padding:1px 4px;
  display:none;
}
#cards .card.in-deck-1 .card-count-badge,
#cards .card.in-deck-2 .card-count-badge{ display:block; }
#cards .card.in-deck-2 .card-count-badge{ background:rgba(200,120,0,0.9); }

/* ===== 右端プレビュー ===== */
#previewPanel{
  width:280px;
  flex-shrink:0;
  background:linear-gradient(180deg,#0a180a,#0e1c0e);
  border-left:1px solid #1a3a1a;
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  position:fixed;
  top:70px;
  right:0;
  height:calc(100vh - 70px);
  z-index:100;
  overflow-y:auto;
}
#preview img{
  width:256px;border-radius:8px;
  box-shadow:0 0 20px rgba(0,0,0,0.8);
}
#previewName{
  font-size:12px;color:#88aa88;text-align:center;
  letter-spacing:1px;
}

/* スクロールバー */
::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-track{ background:#0a140a; }
::-webkit-scrollbar-thumb{ background:#2a5a2a; border-radius:3px; }

/* トースト */
#toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%);
  background:rgba(20,60,20,0.95);
  color:#88ff88;
  border:1px solid #2a8a2a;
  border-radius:8px;
  padding:10px 24px;
  font-size:13px;
  letter-spacing:1px;
  box-shadow:0 0 16px rgba(40,180,40,0.4);
  z-index:1000;
  display:none;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ===== デッキ共有コード モーダル ===== -->
<div id="shareModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.82);z-index:2000;justify-content:center;align-items:center;" onclick="if(event.target===this)closeShareModal()">
  <div style="background:linear-gradient(180deg,#0e1c0e,#121e12);border:1px solid #2a5a2a;border-radius:12px;padding:20px 22px;width:580px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,0,0,0.85);">
    <div style="color:#88ff88;font-size:15px;font-weight:bold;letter-spacing:3px;margin-bottom:4px;">⇄ DECK CODE</div>
    <div style="color:#4a8a4a;font-size:11px;margin-bottom:16px;">コードを渡すだけでデッキを共有できます</div>
    <div style="color:#4a8a4a;font-size:10px;letter-spacing:2px;margin-bottom:6px;">▸ EXPORT 　今のデッキのコード</div>
    <textarea id="shareOut" readonly placeholder="　" style="width:100%;height:68px;background:#0a140a;color:#aaddaa;border:1px solid #2a5a2a;border-radius:6px;padding:8px 10px;font-size:11px;font-family:Consolas,monospace;line-height:1.6;resize:vertical;word-break:break-all;outline:none;"></textarea>
    <button onclick="copyShareCode()" style="width:100%;background:linear-gradient(135deg,#0a1a2a,#1a2a4a);color:#88aaff;border:1px solid #2a4a8a;border-radius:6px;padding:9px;font-size:12px;font-weight:bold;letter-spacing:2px;cursor:pointer;margin:7px 0 18px;">⧉ クリップボードにコピー</button>
    <div style="border-top:1px solid #1a3a1a;margin-bottom:16px;"></div>
    <div style="color:#4a8a4a;font-size:10px;letter-spacing:2px;margin-bottom:6px;">▸ IMPORT 　もらったコードを読み込む</div>
    <textarea id="shareIn" placeholder="ELM1-..." style="width:100%;height:68px;background:#0a140a;color:#aaddaa;border:1px solid #2a5a2a;border-radius:6px;padding:8px 10px;font-size:11px;font-family:Consolas,monospace;line-height:1.6;resize:vertical;word-break:break-all;outline:none;"></textarea>
    <button onclick="applyShareCode()" style="width:100%;background:linear-gradient(135deg,#0d2a0d,#1a4a1a);color:#88ff88;border:1px solid #2a8a2a;border-radius:6px;padding:10px;font-size:12px;font-weight:bold;letter-spacing:2px;cursor:pointer;margin-top:7px;">▶ このコードを読み込む</button>
    <div id="shareMsg" style="color:#ff8888;font-size:11px;min-height:17px;margin-top:9px;line-height:1.6;"></div>
    <button onclick="closeShareModal()" style="width:100%;background:rgba(0,0,0,0.5);color:#999;border:1px solid #444;border-radius:6px;padding:8px;font-size:12px;cursor:pointer;margin-top:10px;">閉じる</button>
  </div>
</div>

<div id="pageHeader">

    <!-- 枚数表示 -->

      <div class="count-label">DECK</div>

        <span class="count-val" id="countVal">0</span>

  <!-- 右：フィルター＋カード一覧 -->
  <div id="rightCol">

        <span class="filter-label">SEARCH</span>
        <input id="search" placeholder="カード名を入力..." oninput="renderCards()">
      </div>
      <!-- 属性フィルター -->
      <div class="filter-row">
        <span class="filter-label">ATTR</span>
        <button class="filt-btn active" data-attr="all" onclick="setAttrFilter(this,'all')">ALL</button>
        <button class="filt-btn" data-attr="fire" onclick="setAttrFilter(this,'fire')">🔥 FIRE</button>
        <button class="filt-btn" data-attr="water" onclick="setAttrFilter(this,'water')">💧 WATER</button>
        <button class="filt-btn" data-attr="thunder" onclick="setAttrFilter(this,'thunder')">⚡ THUNDER</button>
        <button class="filt-btn" data-attr="forest" onclick="setAttrFilter(this,'forest')">🌿 FOREST</button>
        <button class="filt-btn" data-attr="dark" onclick="setAttrFilter(this,'dark')">🌑 DARK</button>
        <button class="filt-btn" data-attr="poison" onclick="setAttrFilter(this,'poison')">☠ POISON</button>
        <button class="filt-btn" data-attr="steel" onclick="setAttrFilter(this,'steel')">⚙ STEEL</button>
        <button class="filt-btn" data-attr="neutral" onclick="setAttrFilter(this,'neutral')">◈ NEUTRAL</button>
      </div>
      <!-- タイプフィルター -->
      <div class="filter-row">
        <span class="filter-label">TYPE</span>
        <button class="filt-btn active" data-type="all" onclick="setTypeFilter(this,'all')">ALL</button>
        <button class="filt-btn" data-type="unit" onclick="setTypeFilter(this,'unit')">UNIT</button>
        <button class="filt-btn" data-type="spell" onclick="setTypeFilter(this,'spell')">SPELL</button>
        <button class="filt-btn" data-type="field" onclick="setTypeFilter(this,'field')">FIELD SPELL</button>
      </div>
      <!-- コストフィルター -->
      <div class="filter-row">
        <span class="filter-label">COST</span>
        <button class="filt-btn active" data-cost="all" onclick="setCostFilter(this,'all')">ALL</button>
        <button class="filt-btn" data-cost="1" onclick="setCostFilter(this,'1')">1</button>
        <button class="filt-btn" data-cost="2" onclick="setCostFilter(this,'2')">2</button>
        <button class="filt-btn" data-cost="3" onclick="setCostFilter(this,'3')">3</button>
        <button class="filt-btn" data-cost="4" onclick="setCostFilter(this,'4')">4</button>
        <button class="filt-btn" data-cost="5" onclick="setCostFilter(this,'5')">5</button>
      </div>
    </div>

    <!-- カード一覧 -->
    <div id="cardsOuter">
      <div id="cards"></div>
    </div>

  </div>

  <!-- 右端：プレビュー -->
  <div id="previewPanel">
    <div id="preview"></div>
    <div id="previewName"></div>
  </div>

</div><!-- /mainLayout -->

let deck=[];
let attrFilter="all";
let typeFilter="all";
let costFilter="all";

// ★制限カード（デッキに1枚まで）
const limitedCards=["マインドコントロール"];

// ===== ひらがな変換 =====
function hira(str){
  return str.replace(/[ァ-ン]/g,s=>String.fromCharCode(s.charCodeAt(0)-0x60));
}

// ===== フィルター設定 =====
function setAttrFilter(btn,val){
  attrFilter=val;
  document.querySelectorAll("[data-attr]").forEach(b=>{
    b.classList.remove("active","fire","water","thunder","forest","dark","poison","steel","neutral");
  });
  btn.classList.add("active");
  if(val!=="all") btn.classList.add(val);
  renderCards();
}
function setTypeFilter(btn,val){
  typeFilter=val;
  document.querySelectorAll("[data-type]").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderCards();
}
function setCostFilter(btn,val){
  costFilter=val;
  document.querySelectorAll("[data-cost]").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderCards();
}

// ===== カード一覧描画 =====
function renderCards(){
  const area=document.getElementById("cards");
  area.innerHTML="";
  const keyword=document.getElementById("search").value;
  cardDataList.forEach(cd=>{
    if(attrFilter!=="all"&&cd.attr!==attrFilter) return;
    if(typeFilter!=="all"&&cd.type!==typeFilter) return;
    if(costFilter!=="all"&&cd.cost!==parseInt(costFilter)) return;
    if(keyword){
      const k=hira(keyword);
      if(!hira(cd.name).includes(k)) return;
    }
    const countInDeck=deck.filter(x=>x===cd.name).length;
    const div=document.createElement("div");
    div.className="card"+(countInDeck===1?" in-deck-1":countInDeck>=2?" in-deck-2":"");
    const img=document.createElement("img");
    img.src="images/"+cd.name+".png";
    img.onmouseenter=()=>{
      document.getElementById("preview").innerHTML=`<img src="images/${cd.name}.png">`;
      document.getElementById("previewName").innerText=cd.name;
    };
    img.onmouseleave=()=>{
      document.getElementById("preview").innerHTML="";
      document.getElementById("previewName").innerText="";
    };
    const badge=document.createElement("div");
    badge.className="card-count-badge";
    badge.innerText="×"+countInDeck;
    div.appendChild(img);
    div.appendChild(badge);
    if(limitedCards.includes(cd.name)){
      const lbadge=document.createElement("div");
      lbadge.style.cssText="position:absolute;bottom:2px;left:2px;background:rgba(180,0,0,0.88);color:#fff;font-size:9px;font-weight:bold;border-radius:3px;padding:1px 4px;letter-spacing:1px;pointer-events:none;";
      lbadge.textContent="制限";
      div.appendChild(lbadge);
    }
    div.onclick=()=>{
      if(deck.length>=20){ showToast("デッキは20枚まで"); return; }
      const inDeckCount=deck.filter(x=>x===cd.name).length;
      if(limitedCards.includes(cd.name)&&inDeckCount>=1){ showToast(`「${cd.name}」は制限カードのため1枚までです`); return; }
      if(inDeckCount>=2){ showToast("同名カードは2枚まで"); return; }
      deck.push(cd.name);
      render();
      renderCards();
    };
    area.appendChild(div);
  });
}

// ===== デッキ描画 =====
function render(){
  document.getElementById("countVal").innerText=deck.length;
  // ★カード定義順に自動整列（属性ごと→ユニット低コスト順→スペル順）
  deck.sort((a,b)=>{
    const ia=cardDataList.findIndex(x=>x.name===a);
    const ib=cardDataList.findIndex(x=>x.name===b);
    return ia-ib;
  });
  const area=document.getElementById("deck");
  area.innerHTML="";
  deck.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="card";
    const img=document.createElement("img");
    img.src="images/"+c+".png";
    img.onmouseenter=()=>{
      document.getElementById("preview").innerHTML=`<img src="images/${c}.png">`;
      document.getElementById("previewName").innerText=c;
    };
    img.onmouseleave=()=>{
      document.getElementById("preview").innerHTML="";
      document.getElementById("previewName").innerText="";
    };
    img.onclick=()=>{ deck.splice(i,1); render(); renderCards(); };
    const badge=document.createElement("div");
    badge.className="remove-badge";
    badge.innerText="✕";
    div.appendChild(img);
    div.appendChild(badge);
    area.appendChild(div);
  });
}

// ===== クリア =====
function clearDeck(){
  if(!confirm("デッキをすべてクリアしますか？")) return;
  deck=[]; render(); renderCards();
}

// ===== スロット一覧 =====
function refreshSlotList(){
  const all=JSON.parse(localStorage.getItem("decks_p1")||"[]");
  const el=document.getElementById("slotList");
  if(!el) return;
  const names=all.map((d,i)=>d?"["+(i+1)+"] "+(d.name||"名称未設定"):"").filter(s=>s);
  el.innerText=names.length>0?names.join("\n"):"(保存済みなし)";
}

// ===== スロット読込 =====
function loadSlot(){
  const slot=parseInt(document.getElementById("deckSlotSelect").value,10);
  const all=JSON.parse(localStorage.getItem("decks_p1")||"[]");
  if(!all[slot]){ showToast("このスロットにデッキがありません"); return; }
  const d=all[slot];
  document.getElementById("deckNameInput").value=d.name||"";
  deck=d.cards||[];
  render(); renderCards();
  showToast("SLOT "+(slot+1)+" ["+(d.name||"名称未設定")+"] を読み込みました");
}

// ===== 保存 =====
function save(){
  if(deck.length!==20){ showToast("20枚必要です（現在"+deck.length+"枚）"); return; }
  const attrs=new Set();
  deck.forEach(c=>{
    const cd=cardDataList.find(x=>x.name===c);
    if(cd&&cd.attr!=="neutral") attrs.add(cd.attr);
  });
  if(attrs.size>1){ showToast("属性は1種類のみです"); return; }
  const slot=parseInt(document.getElementById("deckSlotSelect").value,10);
  const name=document.getElementById("deckNameInput").value||("DECK "+(slot+1));
  const all=JSON.parse(localStorage.getItem("decks_p1")||"[]");
  while(all.length<=slot) all.push(null);
  all[slot]={name,cards:deck};
  localStorage.setItem("decks_p1",JSON.stringify(all));
  localStorage.setItem("deck1",JSON.stringify(deck));
  refreshSlotList();
  showToast("SLOT "+(slot+1)+" 「"+name+"」 を保存しました");
}

// ===== デッキ複製 =====
function copyDeck(){
  if(deck.length===0){ showToast("デッキが空です"); return; }
  const all=JSON.parse(localStorage.getItem("decks_p1")||"[]");
  // コピー先スロットを選択
  const options=[];
  for(let i=0;i<10;i++){
    const label="SLOT "+(i+1)+(all[i]?" ["+(all[i].name||"名称未設定")+"]":"(空)");
    options.push(label);
  }
  const choice=prompt("コピー先スロットを番号で入力（1〜10）:\n"+options.map((o,i)=>(i+1)+": "+o).join("\n"));
  if(!choice) return;
  const dest=parseInt(choice,10)-1;
  if(isNaN(dest)||dest<0||dest>9){ showToast("無効なスロット番号です"); return; }
  const srcSlot=parseInt(document.getElementById("deckSlotSelect").value,10);
  const srcName=document.getElementById("deckNameInput").value||("DECK "+(srcSlot+1));
  while(all.length<=dest) all.push(null);
  all[dest]={name:srcName+"_COPY",cards:[...deck]};
  localStorage.setItem("decks_p1",JSON.stringify(all));
  refreshSlotList();
  showToast("SLOT "+(dest+1)+" にコピーしました");
}

// ===== トースト =====
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}

const _B36="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function _e2(n){return _B36[Math.floor(n/36)%36]+_B36[n%36];}
function _e3(n){return _B36[Math.floor(n/1296)%36]+_B36[Math.floor(n/36)%36]+_B36[n%36];}
function _d2(s){const a=_B36.indexOf(s[0]),b=_B36.indexOf(s[1]);if(a<0||b<0)return -1;return a*36+b;}
function _ckSum(b){let s=5381;for(let i=0;i<b.length;i++){s=((s*33)^b.charCodeAt(i))>>>0;}return s%46656;}

function buildDeckCode(cards,deckName){
  if(!cards||cards.length===0) return {err:"デッキが空です"};
  let cs="";
  for(const n of cards){
    const i=CARD_CODE_ORDER.indexOf(n);
    if(i<0) return {err:"「"+n+"」はまだ共有コードに対応していません"};
    cs+=_e2(i);
  }
  let nh="";
  const nm=(deckName||"").trim().slice(0,20);
  if(nm){ for(const b of new TextEncoder().encode(nm)) nh+=_e2(b); }
  return {code:"ELM1-"+cs+"-"+nh+"-"+_e3(_ckSum(cs+nh))};
}

function parseDeckCode(raw){
  const s=(raw||"").toUpperCase().replace(/[\s　]+/g,"");
  if(!s) return {err:"コードが入力されていません"};
  const p=s.split("-");
  if(p[0]!=="ELM1"){
    if(p[0]&&p[0].indexOf("ELM")===0) return {err:"このコードは新しい形式です。ゲームの更新が必要です"};
    return {err:"コードの形式が違います（ELM1- から始まる1行をそのまま貼り付けてください）"};
  }
  if(p.length!==4) return {err:"コードが途中で切れているようです（全部コピーできているか確認してください）"};
  const cs=p[1],nh=p[2],ck=p[3];
  if(_e3(_ckSum(cs+nh))!==ck) return {err:"コードが壊れています（文字の抜けや余計な文字がないか確認してください）"};
  if(cs.length%2!==0) return {err:"コードが壊れています（カード部分）"};
  const n=cs.length/2;
  if(n!==20) return {err:"このコードのカードは"+n+"枚です（20枚必要です）"};
  const out=[];
  for(let i=0;i<n;i++){
    const idx=_d2(cs.substr(i*2,2));
    if(idx<0||idx>=CARD_CODE_ORDER.length) return {err:"このコードには未対応のカードが含まれています（新しいカードのコードかもしれません）"};
    out.push(CARD_CODE_ORDER[idx]);
  }
  let name="";
  if(nh.length>0){
    if(nh.length%2!==0) return {err:"コードが壊れています（デッキ名部分）"};
    const by=[];
    for(let i=0;i<nh.length/2;i++){const b=_d2(nh.substr(i*2,2));if(b<0||b>255)return {err:"コードが壊れています（デッキ名部分）"};by.push(b);}
    try{ name=new TextDecoder().decode(new Uint8Array(by)); }catch(e){ name=""; }
  }
  return {cards:out,name:name};
}

function checkDeckRules(cards){
  const w=[],at=new Set(),ct={};
  cards.forEach(n=>{
    const c=cardDataList.find(x=>x.name===n);
    if(c&&c.attr!=="neutral") at.add(c.attr);
    ct[n]=(ct[n]||0)+1;
  });
  if(at.size>1) w.push("属性が複数混ざっています");
  const ov=Object.keys(ct).filter(n=>ct[n]>(limitedCards.includes(n)?1:2));
  if(ov.length) w.push("枚数オーバー："+ov.join("、"));
  return w;
}

function openShareModal(){
  const msg=document.getElementById("shareMsg");
  msg.style.color="#ff8888"; msg.innerText="";
  document.getElementById("shareIn").value="";
  const out=document.getElementById("shareOut");
  const r=buildDeckCode(deck,document.getElementById("deckNameInput").value);
  if(r.err){ out.value=""; out.placeholder=r.err; } else { out.value=r.code; }
  document.getElementById("shareModal").style.display="flex";
}
function closeShareModal(){ document.getElementById("shareModal").style.display="none"; }
function _copyFallback(ta){
  try{
    const ro=ta.readOnly; ta.readOnly=false;
    ta.focus(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand("copy"); ta.readOnly=ro;
    showToast(ok?"コードをコピーしました":"コピーできません。選択してコピーしてください");
  }catch(e){ showToast("コピーできません。選択してコピーしてください"); }
}
function copyShareCode(){
  const ta=document.getElementById("shareOut");
  if(!ta.value){ showToast("コードを作れませんでした"); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>showToast("コードをコピーしました")).catch(()=>_copyFallback(ta));
  }else _copyFallback(ta);
}
function applyShareCode(){
  const msg=document.getElementById("shareMsg");
  const r=parseDeckCode(document.getElementById("shareIn").value);
  if(r.err){ msg.style.color="#ff8888"; msg.innerText="✕ "+r.err; return; }
  deck=r.cards.slice();
  if(r.name) document.getElementById("deckNameInput").value=r.name;
  render(); renderCards();
  closeShareModal();
  const w=checkDeckRules(deck);
  if(w.length) showToast("読み込みました（注意："+w.join(" / ")+"）");
  else showToast("デッキ「"+(r.name||"名称なし")+"」を読み込みました");
}
