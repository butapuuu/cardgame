<style>
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{ --gold:#c8a96e; --gold2:#ffe599; --dark:#080c08; --card-bg:rgba(10,25,10,0.9); }
html,body{ width:100%; height:100%; background:var(--dark); color:#ddd; font-family:'Rajdhani',sans-serif; }
#bg{ position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse 140% 50% at 50% -10%,rgba(20,60,20,0.8) 0%,transparent 60%), radial-gradient(ellipse 100% 60% at 90% 100%,rgba(10,40,10,0.4) 0%,transparent 60%), #080c08; }
#bg::before{ content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(40,100,40,0.05) 40px), repeating-linear-gradient(60deg,transparent,transparent 39px,rgba(40,100,40,0.05) 40px); animation:gridShift 30s linear infinite; }
@keyframes gridShift{ 0%{transform:translate(0,0);} 100%{transform:translate(40px,40px);} }
.particle{ position:fixed; border-radius:50%; pointer-events:none; z-index:1; background:radial-gradient(circle,rgba(100,220,80,0.5),transparent 70%); animation:floatUp linear infinite; }
@keyframes floatUp{ 0%{transform:translateY(110vh) scale(0);opacity:0;} 10%{opacity:0.8;} 90%{opacity:0.2;} 100%{transform:translateY(-10vh) scale(1);opacity:0;} }

/* スクロール可能にしつつ、画面に収まる場合はぴったりにする */
#wrap{
  position:relative; z-index:10;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:18px 14px 16px;
}

#hero{ text-align:center; width:100%; flex-shrink:0; }
.hero-emblem{ width:54px; height:54px; margin:0 auto 6px; animation:emblemFloat 4s ease-in-out infinite; }
@keyframes emblemFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-6px) rotate(2deg);} }
.hero-emblem svg{ width:100%; height:100%; filter:drop-shadow(0 0 14px rgba(100,220,80,0.6)); }
.hero-subtitle{ font-size:8px; letter-spacing:5px; color:var(--gold); margin-bottom:4px; text-transform:uppercase; }
.hero-title{ font-family:'Cinzel Decorative',serif; font-size:clamp(28px,9vw,42px); font-weight:900; letter-spacing:4px; line-height:1; background:linear-gradient(135deg,#4aff4a 0%,var(--gold2) 40%,#88ff44 70%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 20px rgba(80,220,80,0.4)); margin-bottom:4px; }
.hero-tagline{ font-size:9px; letter-spacing:5px; color:rgba(200,220,180,0.5); }

.divider{ width:100%; height:1px; background:linear-gradient(90deg,transparent,rgba(60,140,60,0.4),rgba(200,180,80,0.3),rgba(60,140,60,0.4),transparent); margin:10px 0; flex-shrink:0; }

/* グリッド：固定高さで3段均等 */
#navGrid{
  display:flex; flex-direction:column;
  gap:8px;
  width:100%;
  flex:1;
}
.nav-row{
  display:grid; grid-template-columns:1fr 1fr;
  gap:8px;
  flex:1;
  min-height:80px;
}

.nav-card{
  position:relative; background:var(--card-bg);
  border:1px solid rgba(60,140,60,0.3); border-radius:12px;
  cursor:pointer; text-decoration:none; color:#ddd;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:6px; overflow:hidden;
  transition:transform 0.2s ease;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  padding:8px 4px;
}
.nav-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(80,200,80,0.5),transparent); }
.nav-card:active{ transform:scale(0.97); }
.nav-card.room{ border-color:rgba(80,180,255,0.35); }
.nav-card.room::before{ background:linear-gradient(90deg,transparent,rgba(80,180,255,0.55),transparent); }
.nav-card.deck{ border-color:rgba(200,180,80,0.35); }
.nav-card.deck::before{ background:linear-gradient(90deg,transparent,rgba(200,180,80,0.55),transparent); }
.nav-card.coming{ opacity:0.48; cursor:default; }

.card-icon{ width:36px; height:36px; flex-shrink:0; }
.nav-card.room .card-icon svg{ filter:drop-shadow(0 0 8px rgba(80,180,255,0.7)); }
.nav-card.deck .card-icon svg{ filter:drop-shadow(0 0 8px rgba(200,180,80,0.7)); }

.card-title{ font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; line-height:1; }
.nav-card.room .card-title{ color:#88ccff; }
.nav-card.deck .card-title{ color:var(--gold2); }
.nav-card:not(.room):not(.deck) .card-title{ color:#88dd88; }

.coming-badge{ position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.5); border:1px solid rgba(100,100,100,0.4); border-radius:3px; padding:1px 5px; font-size:7px; letter-spacing:1px; color:#777; text-transform:uppercase; }

#footer{ padding:8px 0 0; text-align:center; font-size:9px; letter-spacing:2px; color:rgba(80,120,80,0.35); flex-shrink:0; }
</style>
</head>
